    <section id="view-care" class="view"></section>
    <section id="view-journey" class="view"></section>
    <section id="view-academy" class="view"></section>
    <section id="view-impact" class="view"></section>
    <section id="view-safety" class="view"></section>
  </main>
</div>

<div id="lessonModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><article class="modal-card"><header class="modal-head"><div><div id="modalEyebrow" class="eyebrow"></div><h2 id="modalTitle"></h2></div><button id="modalClose" class="modal-close" aria-label="Fechar">×</button></header><div id="modalBody" class="modal-body"></div><footer class="modal-foot"><span id="modalPoints" class="points"></span><button id="modalComplete" class="button button--teal">Concluir atividade</button></footer></article></div>
<div id="toast" class="toast" aria-live="polite"></div>
<script type="module">
  import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {auth,BACKEND_BASE_URL} from "./js/firebase-config.js";
  const $=id=>document.getElementById(id),esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const NAV=[['home','⌂','Início'],['care','♡','Consultas'],['journey','◌','Jornada'],['academy','▤','Academia'],['impact','✦','Impacto'],['safety','+','Ajuda']];
  const statusLabels={pending_guardian_consent:'Consentimento pendente',pending_participant_consent:'Consentimento pendente',pending_triage:'Aguardando triagem',triage_in_progress:'Triagem em andamento',waiting_assignment:'Aguardando psicólogo',assigned:'Psicólogo definido',care_active:'Atendimento em andamento',referral_required:'Encaminhamento necessário',referred_in_person:'Encaminhado presencialmente',referred_network:'Encaminhado para a rede',discharged:'Atendimento encerrado',declined:'Participação recusada',consent_revoked:'Autorização retirada',suspended:'Atendimento suspenso',scheduled:'Agendada',completed:'Realizada',canceled:'Cancelada'};
  const ACTIVITIES={
    breathe_60:{group:'practice',icon:'◌',tag:'1 minuto',title:'Respirar e voltar',description:'Uma pausa curta para reduzir o ritmo e recuperar presença.',points:10,timer:60,intro:'Encontre uma posição confortável. Esta prática não substitui cuidado profissional e deve ser interrompida se causar desconforto.',steps:['Solte os ombros e apoie os pés no chão.','Respire sem forçar. Perceba o ar entrando e saindo.','Alongue suavemente a saída do ar, se isso for confortável.','Ao final, observe uma coisa que parece um pouco mais clara.'],alert:'Se sentir tontura ou desconforto, pare e volte à respiração normal.'},
    focus_5:{group:'practice',icon:'◎',tag:'5 minutos',title:'Sprint de foco',description:'Transforme uma tarefa grande em um primeiro passo possível.',points:15,timer:300,intro:'Foco não é fazer tudo de uma vez. É escolher uma ação pequena e protegê-la por alguns minutos.',steps:['Escolha uma única tarefa pequena.','Afaste notificações e deixe somente o necessário aberto.','Trabalhe por cinco minutos sem buscar perfeição.','Ao terminar, decida: continuar, pausar ou dividir novamente.']},
    emotion_checkin:{group:'practice',icon:'◇',tag:'Autoconhecimento',title:'Mapa do agora',description:'Reconheça emoção, intensidade e necessidade sem julgamento.',points:10,intro:'Você não precisa escrever nem enviar nada. As respostas ficam com você.',steps:['Dê um nome aproximado ao que sente agora.','Perceba a intensidade de 0 a 10.','Pergunte: do que eu preciso neste momento?','Escolha uma ação segura e pequena: água, pausa, movimento ou conversa.'],alert:'Se o sofrimento estiver intenso ou persistente, procure um adulto de confiança ou sua equipe de cuidado.'},
    gratitude_3:{group:'practice',icon:'✦',tag:'2 minutos',title:'Três pontos de luz',description:'Treine atenção para pequenos acontecimentos que fizeram diferença.',points:10,intro:'Não é preciso ignorar o que está difícil. A proposta é apenas ampliar o campo de atenção.',steps:['Lembre de algo que facilitou seu dia.','Pense em uma pessoa ou gesto que ajudou.','Escolha algo simples que você gostaria de repetir amanhã.']},
    active_pause:{group:'practice',icon:'↗',tag:'3 minutos',title:'Pausa ativa',description:'Movimento leve para sair do modo automático entre tarefas.',points:10,intro:'Movimente-se dentro dos seus limites e respeite qualquer orientação de saúde que você já tenha.',steps:['Levante ou ajuste sua postura.','Movimente ombros, mãos e pescoço com suavidade.','Caminhe um pouco ou alongue as pernas.','Beba água e volte devagar.']},
    kindness_mission:{group:'mission',icon:'♡',tag:'Missão do dia',title:'Cuidado que circula',description:'Faça uma ação pequena, concreta e respeitosa por alguém.',points:20,intro:'Ajudar não significa assumir problemas que não são seus. É oferecer presença dentro dos seus limites.',steps:['Escolha alguém da escola, família ou comunidade.','Ofereça um gesto possível: ouvir, agradecer, incluir ou orientar.','Respeite se a pessoa não quiser ajuda.','Se houver risco ou violência, procure um adulto responsável.']},
    course_emotional_literacy:{group:'course',icon:'◉',tag:'Bem-estar',title:'Entender emoções',description:'Nomear, compreender e escolher respostas mais conscientes.',points:80,intro:'Emoções trazem informações, mas não precisam decidir todas as nossas ações.',steps:['Perceba sinais no corpo, pensamentos e vontade de agir.','Nomeie a emoção com palavras simples.','Considere o contexto e o que essa emoção pode estar sinalizando.','Escolha uma resposta segura, respeitosa e possível.'],question:'Qual é uma resposta útil quando uma emoção fica intensa?',options:['Ignorar sempre o que está sentindo.','Reconhecer, fazer uma pausa e buscar apoio quando necessário.','Tomar uma decisão importante imediatamente.'],answer:1},
    course_focus_learning:{group:'course',icon:'◎',tag:'Aprendizagem',title:'Aprender a aprender',description:'Foco, recuperação ativa e revisão sem sobrecarga.',points:80,intro:'Estudar melhor depende menos de horas infinitas e mais de ciclos claros de atenção, teste e descanso.',steps:['Defina o que você quer conseguir explicar ao final.','Estude em blocos curtos com distrações reduzidas.','Feche o material e tente lembrar com suas palavras.','Revise erros e programe uma nova tentativa em outro dia.'],question:'Qual estratégia ajuda a consolidar a aprendizagem?',options:['Reler sem parar até cansar.','Tentar recuperar a informação sem olhar e depois conferir.','Estudar várias matérias ao mesmo tempo.'],answer:1},
    course_first_aid_awareness:{group:'course',icon:'+',tag:'Segurança',title:'Primeiros socorros: saber agir',description:'Reconheça riscos, chame ajuda e evite atitudes que podem piorar a situação.',points:100,intro:'Este módulo é educativo e não certifica socorristas. Em uma emergência, proteja a cena, chame um adulto e ligue 192, seguindo as orientações do SAMU.',steps:['Observe se o local é seguro antes de se aproximar.','Peça ajuda a um adulto e acione o SAMU 192 quando houver urgência.','Informe local, quantidade de vítimas, consciência e o que aconteceu.','Não dê água a acidentados e não mova vítimas de trauma sem orientação.','Faça apenas manobras para as quais recebeu treinamento e siga o médico regulador.'],alert:'A Lei 13.722/2018 prevê capacitação escolar ministrada por entidades especializadas ou profissionais habilitados. Este conteúdo de conscientização não substitui essa formação.',question:'Ao encontrar uma possível emergência, qual é a primeira sequência mais segura?',options:['Filmar, mover a vítima e oferecer água.','Verificar a segurança, chamar um adulto, ligar 192 e seguir as orientações.','Tentar qualquer manobra vista na internet.'],answer:1,sources:[['SAMU 192 — Ministério da Saúde','https://www.gov.br/saude/pt-br/composicao/saes/samu-192/samu-192'],['Lei 13.722/2018 — Planalto','https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13722.htm']]},
    course_peer_support:{group:'course',icon:'♡',tag:'Conscientização',title:'Como apoiar alguém',description:'Escuta, limites e caminhos seguros para pedir ajuda.',points:90,intro:'Você pode ser uma ponte de cuidado, mas não precisa resolver tudo sozinho.',steps:['Escute sem ridicularizar, pressionar ou interromper.','Pergunte como pode ajudar e respeite os limites da pessoa.','Incentive a conversa com um adulto ou profissional de confiança.','Se houver risco imediato, violência ou ameaça à vida, não guarde segredo: procure ajuda adulta e os serviços de emergência.'],question:'Se um amigo disser que está em risco imediato, o que fazer?',options:['Prometer segredo absoluto.','Deixar para conversar outro dia.','Procurar imediatamente um adulto de confiança e acionar ajuda adequada.'],answer:2},
    course_digital_balance:{group:'course',icon:'◫',tag:'Vida digital',title:'Equilíbrio digital',description:'Tecnologia com intenção, proteção do sono e atenção.',points:70,intro:'A tecnologia pode aproximar, ensinar e divertir. O equilíbrio começa quando você decide como quer usá-la.',steps:['Identifique aplicativos que mais capturam sua atenção.','Crie momentos sem notificações para estudar, conversar e descansar.','Proteja o horário de sono e deixe o aparelho fora do alcance, quando possível.','Bloqueie e denuncie assédio; procure um adulto se algo causar medo ou ameaça.'],question:'Qual escolha favorece equilíbrio digital?',options:['Manter todas as notificações durante o estudo.','Criar períodos protegidos sem notificações.','Dormir com vídeos tocando todas as noites.'],answer:1},
    course_citizenship:{group:'course',icon:'✦',tag:'Cidadania',title:'Agir na comunidade',description:'Empatia, direitos e pequenas ações de transformação.',points:70,intro:'Cidadania também acontece nas escolhas diárias: incluir, respeitar, cuidar dos espaços e pedir ajuda diante de violações.',steps:['Observe uma necessidade real da sua escola ou comunidade.','Converse com quem é afetado antes de propor uma solução.','Planeje uma ação pequena, respeitosa e possível.','Compartilhe responsabilidades e avalie o resultado.'],question:'Uma ação comunitária responsável começa por:',options:['Decidir sozinho o que todos precisam.','Ouvir as pessoas envolvidas e compreender a necessidade.','Expor publicamente quem discorda.'],answer:1}
  };
  let user=null,students=[],activeStudent=null,progress={totalPoints:0,level:1,nextLevelAt:250,streakDays:0,completedCourses:0,totalActions:0,completedActivityIds:[],practicedToday:[]},activeView='home',currentActivity=null,timerHandle=null;
  function navMarkup(){return NAV.map(([id,icon,label])=>`<button class="nav-button ${activeView===id?'is-active':''}" data-view="${id}"><span class="nav-icon">${icon}</span><span>${label}</span></button>`).join('')}
  function bindNav(){document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>showView(button.dataset.view));document.querySelectorAll('[data-view-link]').forEach(link=>link.onclick=e=>{e.preventDefault();showView(link.dataset.viewLink)})}
  function showView(view){activeView=view;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('is-active',el.id===`view-${view}`));$('desktopNav').innerHTML=navMarkup();$('mobileNav').innerHTML=navMarkup().replaceAll('Ajuda','Ajuda');bindNav();scrollTo({top:0,behavior:'smooth'})}
  async function api(path,options={}){const token=await auth.currentUser.getIdToken();const response=await fetch(BACKEND_BASE_URL+path,{...options,headers:{Authorization:`Bearer ${token}`,...(options.body?{'Content-Type':'application/json'}:{})}}),data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.error||'Não foi possível concluir');return data}
  const label=value=>statusLabels[value]||'Em acompanhamento';
  const formatDate=value=>value?new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(new Date(value)):'Ainda não agendada';
  const isDone=id=>progress.completedActivityIds?.includes(id)||progress.practicedToday?.includes(id);
  function toast(message){$('toast').textContent=message;$('toast').classList.add('is-visible');setTimeout(()=>$('toast').classList.remove('is-visible'),3200)}
  async function load(account){user=account;const data=await api('/therapy/aluno/me');students=data.items||[];if(!students.length)throw new Error('Nenhum acompanhamento ativo');const wanted=localStorage.getItem('ep_student_active');activeStudent=students.find(item=>item.id===wanted)||students[0];$('studentSwitch').innerHTML=students.map(item=>`<option value="${esc(item.id)}">${esc(item.name)}</option>`).join('');$('studentSwitch').value=activeStudent.id;await loadProgress();renderAll();$('loading').style.display='none';showView('home')}
  async function loadProgress(){try{const data=await api(`/therapy/aluno/desenvolvimento/${encodeURIComponent(activeStudent.id)}`);progress=data.progress||progress}catch(error){console.warn(error)}}
  function header(title,subtitle,eyebrow='Meu espaço'){return `<div class="eyebrow">${esc(eyebrow)}</div><h1 class="page-title">${esc(title)}</h1><p class="page-sub">${esc(subtitle)}</p>`}
  function activityCard(id){const item=ACTIVITIES[id],done=isDone(id);return `<article class="activity-card interactive-card ${done?'is-complete':''}" data-card-activity="${id}" role="button" tabindex="0" aria-label="Abrir atividade ${esc(item.title)}"><span class="card-tag">${esc(item.tag)}</span><div class="card-icon">${item.icon}</div><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p><div class="card-foot"><span class="points">+${item.points} pontos</span><span class="card-open" aria-hidden="true">${done&&item.group!=='practice'?'Rever':'Começar'} →</span></div></article>`}
  function courseCard(id){const item=ACTIVITIES[id],done=isDone(id);return `<article class="course-card interactive-card ${done?'is-complete':''}" data-card-activity="${id}" role="button" tabindex="0" aria-label="Abrir trilha ${esc(item.title)}"><div class="course-card__art"><span>${item.icon}</span></div><span class="card-tag">${esc(item.tag)}</span><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p><div class="progress-line"><span style="width:${done?'100':'12'}%"></span></div><div class="card-foot"><span class="points">${item.points} pontos</span><span class="card-open" aria-hidden="true">${done?'Revisar':'Abrir trilha'} →</span></div></article>`}
  function nextSession(){return (activeStudent.sessions||[]).filter(s=>s.scheduledAt>Date.now()&&!['canceled','completed'].includes(s.status)).sort((a,b)=>a.scheduledAt-b.scheduledAt)[0]||null}
  function appointmentCard(){const next=nextSession();return `<div class="appointment"><div class="appointment__top"><div><span class="pill">${esc(label(activeStudent.status))}</span><h3 class="ep-mt-12">${next?'Seu próximo encontro':'Seu cuidado está em preparação'}</h3></div><span>♡</span></div><p class="page-sub">${next?formatDate(next.scheduledAt):'Assim que a triagem e o agendamento forem concluídos, os detalhes aparecerão aqui.'}</p><div class="meta-grid"><div class="meta"><small>Programa</small><strong>${esc(activeStudent.programName||'Programa escolar')}</strong></div><div class="meta"><small>Escola</small><strong>${esc(activeStudent.schoolName||'Não informada')}</strong></div><div class="meta"><small>${activeStudent.demo?'Operação':'Psicólogo'}</small><strong>${esc(activeStudent.therapistName||'Aguardando definição')}</strong></div><div class="meta"><small>Atendimento</small><strong>Gratuito para o aluno</strong></div></div>${activeStudent.demo?'<div class="demo-note"><strong>Demonstração:</strong> este cenário não gera atendimento clínico, cobrança ou sala de vídeo.</div>':''}</div>`}
  function renderHome(){const firstName=(activeStudent.name||'Estudante').split(' ')[0],within=progress.totalPoints%250,percent=Math.round(within/250*100);$('view-home').innerHTML=`<div class="hero"><div class="hero__copy"><small>Seu espaço de cuidado e crescimento</small><h1>Olá, ${esc(firstName)}.</h1><p>Aqui você encontra acompanhamento psicológico gratuito, práticas para o dia a dia e conhecimento para cuidar de si e apoiar outras pessoas.</p><div class="hero-actions"><button class="button button--gold" data-view="journey">Começar atividade</button><button class="button button--light" data-view="care">Ver consultas</button></div></div><div class="level"><div class="ring" style="--value:${percent*3.6}deg"><div class="ring__text"><strong>${progress.level}</strong><small>Nível</small></div></div><small>${within}/250 para evoluir</small></div></div><div class="stats"><div class="stat"><span>Minha sequência</span><strong>${progress.streakDays} dia${progress.streakDays===1?'':'s'}</strong><small>Um passo por vez</small></div><div class="stat"><span>Pontos de jornada</span><strong>${progress.totalPoints}</strong><small>Progresso educacional</small></div><div class="stat"><span>Trilhas concluídas</span><strong>${progress.completedCourses}</strong><small>Conhecimento que fica</small></div><div class="stat"><span>Ações realizadas</span><strong>${progress.totalActions}</strong><small>Práticas e missões</small></div></div><div class="safety-strip"><span>✦</span><p><strong>Precisa de ajuda imediata?</strong> Este portal não é um serviço de emergência. Procure um adulto e, em risco imediato, acione o SAMU 192 ou a emergência policial 190.</p><a href="tel:192">Ligar 192</a></div><div class="section-head"><div><h2>Para hoje</h2><p>Atividades breves que respeitam seu ritmo.</p></div><button class="text-link" data-view="journey">Ver jornada completa →</button></div><div class="cards">${['breathe_60','focus_5','emotion_checkin'].map(activityCard).join('')}</div><div class="section-head"><div><h2>Cuidado conectado</h2><p>Consultas e desenvolvimento no mesmo lugar.</p></div></div><div class="dashboard-grid"><div class="panel"><h3>Meu acompanhamento</h3>${appointmentCard()}</div><div class="panel"><h3>Próxima conquista</h3><p class="page-sub ep-mt-8">Conclua uma trilha de conscientização e transforme conhecimento em cuidado.</p><div class="ep-mt-16">${courseCard(progress.completedActivityIds?.includes('course_first_aid_awareness')?'course_peer_support':'course_first_aid_awareness')}</div></div></div>`}
  function renderCare(){const sessions=(activeStudent.sessions||[]).slice().sort((a,b)=>(b.scheduledAt||0)-(a.scheduledAt||0));$('view-care').innerHTML=`${header('Meu cuidado','Consultas gratuitas, situação do acompanhamento e informações do programa.','Consultas')}<div class="safety-strip"><span>+</span><p><strong>Em uma emergência, não espere a consulta.</strong> Procure um adulto de confiança e use a rede local indicada pela escola.</p><a href="tel:192">SAMU 192</a></div><div class="dashboard-grid ep-mt-24"><div class="panel"><h3>Acompanhamento atual</h3>${appointmentCard()}</div><div class="panel"><h3>Como funciona</h3><div class="steps"><div class="step"><b>1</b><p>Cadastro e consentimento são confirmados.</p></div><div class="step"><b>2</b><p>A equipe realiza a triagem de segurança e viabilidade.</p></div><div class="step"><b>3</b><p>Se o atendimento remoto for adequado, a consulta é agendada sem custo.</p></div><div class="step"><b>4</b><p>Quando necessário, a equipe orienta o encaminhamento para a rede local.</p></div></div></div></div><div class="section-head"><div><h2>Histórico de atendimentos</h2><p>Somente informações operacionais aparecem nesta tela.</p></div></div><div class="panel">${sessions.length?sessions.map(s=>`<div class="session"><span><strong>${esc(formatDate(s.scheduledAt))}</strong><br><small>${esc(s.therapistName||'Equipe de cuidado')}${s.demo?' · simulação':''}</small></span><span class="pill">${esc(label(s.status))}</span></div>`).join(''):'<p class="page-sub">Nenhum atendimento agendado até o momento.</p>'}</div>`}
  function renderJourney(){$('view-journey').innerHTML=`${header('Minha jornada','Práticas curtas para atenção, autoconhecimento, rotina e conexão.','Desenvolvimento')}<div class="privacy-note ep-mt-20"><strong>Privacidade por escolha:</strong> suas reflexões não são enviadas ao servidor. Guardamos apenas quais atividades você concluiu e os pontos conquistados.</div><div class="section-head"><div><h2>Práticas para o dia a dia</h2><p>Você pode repetir cada prática uma vez por dia.</p></div></div><div class="cards">${['breathe_60','focus_5','emotion_checkin','gratitude_3','active_pause','kindness_mission'].map(activityCard).join('')}</div>`}
  function renderAcademy(){$('view-academy').innerHTML=`${header('Academia Prelúdio','Trilhas educativas para compreender a mente, aprender melhor e agir com segurança.','Conhecimento')}<div class="section-head"><div><h2>Trilhas disponíveis</h2><p>Conteúdo direto, atividades e uma verificação final.</p></div><span class="pill">${progress.completedCourses}/6 concluídas</span></div><div class="cards">${['course_emotional_literacy','course_focus_learning','course_first_aid_awareness','course_peer_support','course_digital_balance','course_citizenship'].map(courseCard).join('')}</div>`}
  function renderImpact(){$('view-impact').innerHTML=`${header('Cuidado que transforma','Aprenda a apoiar sem ultrapassar seus limites e participe de uma comunidade mais consciente.','Impacto positivo')}<div class="impact-hero ep-mt-24"><div><h2 class="ep-h2">Você pode fazer diferença sem carregar tudo sozinho.</h2><p class="page-sub">Empatia é escutar, respeitar, reconhecer limites e conectar a pessoa à ajuda adequada.</p><div class="impact-list"><div class="impact-item"><b>1</b><div><strong>Escute com respeito</strong><br><small>Evite julgamentos, ironias e respostas apressadas.</small></div></div><div class="impact-item"><b>2</b><div><strong>Não prometa segredo diante de risco</strong><br><small>Procure um adulto quando houver ameaça, violência ou risco à vida.</small></div></div><div class="impact-item"><b>3</b><div><strong>Convide para buscar ajuda</strong><br><small>Você pode acompanhar, mas não precisa resolver sozinho.</small></div></div></div></div><div class="impact-quote"><p>“Apoiar alguém também é saber quando chamar quem pode ajudar.”</p><button class="button button--gold ep-mt-20" data-activity="course_peer_support">Abrir trilha de apoio</button></div></div><div class="section-head"><div><h2>Missões de impacto</h2><p>Pequenas ações, com respeito e responsabilidade.</p></div></div><div class="cards">${activityCard('kindness_mission')}${courseCard('course_citizenship')}${courseCard('course_peer_support')}</div>`}
  function renderSafety(){$('view-safety').innerHTML=`${header('Ajuda e segurança','Informação clara para reconhecer limites, procurar apoio e agir com responsabilidade.','Você não está sozinho')}<div class="safety-grid ep-mt-24"><div class="emergency-card"><div class="eyebrow">Risco imediato</div><h2>Chame um adulto e acione ajuda.</h2><p>O SAMU 192 é gratuito e funciona 24 horas para urgências e emergências. Em ameaça ou violência imediata, use também o 190.</p><div class="hero-actions"><a class="button" href="tel:192">Ligar 192</a><a class="button button--light" href="tel:190">Ligar 190</a></div><p class="ep-text-xs ep-mt-20">Informe o local, o que aconteceu, quantas pessoas precisam de ajuda e se estão conscientes. Siga as orientações do atendente.</p></div><div class="panel"><h3>Quando conversar com alguém</h3><div class="steps"><div class="step"><b>1</b><p>Quando pensamentos ou emoções estão difíceis de lidar.</p></div><div class="step"><b>2</b><p>Quando você se sente ameaçado, humilhado, isolado ou em perigo.</p></div><div class="step"><b>3</b><p>Quando um amigo revela risco, violência ou intenção de se machucar.</p></div></div><p class="page-sub">Procure um familiar, professor, coordenação, profissional de saúde ou outra pessoa adulta em quem confie. Se a primeira pessoa não ajudar, procure outra.</p></div></div><div class="section-head"><div><h2>Fontes e orientação oficial</h2><p>Conteúdo educativo revisado a partir de referências públicas.</p></div></div><div class="source-list"><a class="source-link" target="_blank" rel="noopener" href="https://www.gov.br/saude/pt-br/composicao/saes/samu-192/samu-192">SAMU 192 · Ministério da Saúde →</a><a class="source-link" target="_blank" rel="noopener" href="https://bvsms.saude.gov.br/bvs/publicacoes/guia_saude_mental_adolescente_11_14_anos.pdf">Guia de saúde mental para adolescentes · Ministério da Saúde →</a><a class="source-link" target="_blank" rel="noopener" href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13722.htm">Lei 13.722/2018 · capacitação em primeiros socorros nas escolas →</a></div><div class="privacy-note ep-mt-20">Os cursos deste portal são de conscientização. Eles não substituem avaliação médica, consulta psicológica, atendimento de emergência ou curso prático ministrado por profissional habilitado.</div>`}
  function renderAll(){renderHome();renderCare();renderJourney();renderAcademy();renderImpact();renderSafety();bindActions()}
  function bindActions(){bindNav();document.querySelectorAll('[data-activity]').forEach(button=>button.onclick=event=>{event.stopPropagation();openActivity(button.dataset.activity)});document.querySelectorAll('[data-card-activity]').forEach(card=>{card.onclick=()=>openActivity(card.dataset.cardActivity);card.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openActivity(card.dataset.cardActivity)}}})}
  function openActivity(id){const item=ACTIVITIES[id];if(!item)return;currentActivity=id;clearInterval(timerHandle);$('modalEyebrow').textContent=item.group==='course'?'Trilha educativa':item.group==='mission'?'Missão de impacto':'Prática guiada';$('modalTitle').textContent=item.title;$('modalPoints').textContent=`+${item.points} pontos`;$('modalComplete').disabled=!!item.question&&!isDone(id);$('modalComplete').textContent=isDone(id)&&item.group!=='practice'?'Concluído':'Concluir atividade';$('modalBody').innerHTML=`<p class="lesson-intro">${esc(item.intro)}</p>${item.timer?`<div class="panel" style="text-align:center"><div id="activityTimer" class="timer">${formatTimer(item.timer)}</div><button id="timerStart" class="button button--ghost ep-mt-12">Iniciar tempo</button></div>`:''}<div class="steps">${item.steps.map((step,index)=>`<div class="step"><b>${index+1}</b><p>${esc(step)}</p></div>`).join('')}</div>${item.alert?`<div class="lesson-alert">${esc(item.alert)}</div>`:''}${item.sources?`<div class="source-list ep-mt-16">${item.sources.map(([label,url])=>`<a class="source-link" href="${url}" target="_blank" rel="noopener">${esc(label)} →</a>`).join('')}</div>`:''}${item.question?`<div class="quiz"><h3>Para concluir</h3><p>${esc(item.question)}</p><div class="quiz-options">${item.options.map((option,index)=>`<label class="quiz-option"><input type="radio" name="quizAnswer" value="${index}">${esc(option)}</label>`).join('')}</div><button id="quizCheck" class="button button--ghost ep-mt-12">Verificar resposta</button><div id="quizFeedback" class="quiz-feedback" role="status" aria-live="polite"></div></div>`:''}`;$('lessonModal').classList.add('is-open');document.body.style.overflow='hidden';if(item.timer)$('timerStart').onclick=()=>startTimer(item.timer);if(item.question)$('quizCheck').onclick=()=>checkQuiz(item)}
  function formatTimer(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
  function startTimer(seconds){clearInterval(timerHandle);let remaining=seconds;$('timerStart').disabled=true;timerHandle=setInterval(()=>{remaining-=1;const el=$('activityTimer');if(el)el.textContent=formatTimer(Math.max(0,remaining));if(remaining<=0){clearInterval(timerHandle);$('timerStart').textContent='Tempo concluído';toast('Pausa concluída. Perceba como você está agora.')}},1000)}
  function checkQuiz(item){const selected=document.querySelector('input[name="quizAnswer"]:checked'),feedback=$('quizFeedback'),options=[...document.querySelectorAll('.quiz-option')];options.forEach(option=>option.classList.remove('is-correct','is-wrong'));feedback.classList.remove('is-correct','is-wrong');if(!selected){feedback.textContent='Escolha uma resposta para continuar.';return}const selectedIndex=Number(selected.value),correct=selectedIndex===item.answer;options[item.answer]?.classList.add('is-correct');if(!correct)options[selectedIndex]?.classList.add('is-wrong');feedback.classList.add(correct?'is-correct':'is-wrong');if(correct){feedback.textContent='Certo. Você identificou a escolha mais segura.';$('modalComplete').disabled=false}else{feedback.textContent='Essa resposta não está correta. A alternativa em verde mostra a escolha mais segura.'}}
  function closeModal(){clearInterval(timerHandle);$('lessonModal').classList.remove('is-open');document.body.style.overflow='';currentActivity=null}
  async function completeCurrent(){if(!currentActivity)return;const button=$('modalComplete'),previousLabel=button.textContent;button.disabled=true;button.textContent='Salvando…';try{const result=await api(`/therapy/aluno/desenvolvimento/${encodeURIComponent(activeStudent.id)}/concluir`,{method:'POST',body:JSON.stringify({activityId:currentActivity})});progress=result.progress;closeModal();renderAll();showView(activeView);toast(result.alreadyCompleted?'Atividade já registrada hoje.':`Conquista registrada: +${result.awardedPoints} pontos`)}catch(error){button.disabled=false;button.textContent=previousLabel;toast(error.message)}}
  $('modalClose').onclick=closeModal;$('lessonModal').onclick=e=>{if(e.target===$('lessonModal'))closeModal()};$('modalComplete').onclick=completeCurrent;
  $('studentSwitch').onchange=async()=>{activeStudent=students.find(item=>item.id===$('studentSwitch').value)||students[0];localStorage.setItem('ep_student_active',activeStudent.id);await loadProgress();renderAll();showView('home')};
  $('logoutButton').onclick=async()=>{const button=$('logoutButton');button.disabled=true;button.textContent='Saindo…';try{await signOut(auth);location.replace('./aluno-login.html')}catch(error){button.disabled=false;button.textContent='Sair';toast('Não foi possível sair. Tente novamente.')}};
  const localPreview=['localhost','127.0.0.1'].includes(location.hostname)&&new URLSearchParams(location.search).has('preview');
  if(localPreview){activeStudent={id:'preview',name:'Marina Oliveira',caseCode:'EP-PREVIEW-2026',programName:'Programa Municipal de Cuidado Integral',schoolName:'Escola Caminhos do Sol',status:'care_active',therapistName:'Dra. Ana Martins',nextSessionAt:Date.now()+86400000,sessions:[{id:'preview-session',scheduledAt:Date.now()+86400000,status:'scheduled',therapistName:'Dra. Ana Martins'}]};students=[activeStudent];progress={totalPoints:365,level:2,nextLevelAt:500,streakDays:4,completedCourses:2,totalActions:11,completedActivityIds:['course_emotional_literacy','course_digital_balance'],practicedToday:['breathe_60']};$('studentSwitch').innerHTML='<option value="preview">Marina Oliveira</option>';renderAll();$('loading').style.display='none';showView('home')}else{onAuthStateChanged(auth,account=>{if(!account){location.replace('./aluno-login.html');return}load(account).catch(()=>location.replace('./aluno-login.html'))})}
</script>
