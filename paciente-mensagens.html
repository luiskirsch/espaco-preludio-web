  <div class="ep-container ep-topbar__inner">

    <nav class="ep-nav">

<main class="ep-container ep-mt-32 ep-mb-16 ep-page-main" style="overflow: hidden;">
  <section class="ep-stack">
    <div>
      <div class="ep-eyebrow" data-i18n="paciente-mensagens:eyebrow">Conversas</div>
      <h1 class="ep-h1 ep-mt-12 ep-page-title" data-i18n="paciente-mensagens:h1">Mensagens</h1>
      <p class="ep-text-muted ep-mt-8" data-i18n-html="paciente-mensagens:subtitle">
        Conversas com seu(sua) profissional. <strong>Cifradas ponta-a-ponta</strong> — só você e ele(a) leem.
      </p>
    </div>

    <div style="display: flex; height: calc(100dvh - 260px); min-height: 420px; margin-top: 16px; border: 1px solid var(--ep-line); border-radius: var(--ep-radius-lg, 12px); overflow: hidden; box-shadow: var(--ep-shadow-soft); background: var(--ep-surface);">
      <!-- Sidebar de threads -->
      <aside style="width: 280px; flex-shrink: 0; border-right: 1px solid var(--ep-line); display: flex; flex-direction: column; overflow: hidden; background: var(--ep-surface);">
        <div style="padding: 12px 14px; border-bottom: 1px solid var(--ep-line);">
          <strong class="ep-text-sm" data-i18n="paciente-mensagens:threadsHead">Profissionais</strong>
        </div>
        <div id="threadList" style="display: flex; flex-direction: column; gap: 0; flex: 1; overflow-y: auto; align-content: flex-start;">
          <div class="ep-text-xs ep-text-muted" style="padding: 12px;" data-i18n="paciente-mensagens:threads.loading">Carregando…</div>
        </div>
      </aside>

      <!-- Painel da thread ativa -->
      <section style="flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
        <div id="msgEmpty" style="margin: auto; text-align: center; padding: 40px; color: var(--ep-ink-3);">
          <div style="font-size: 48px; margin-bottom: 12px;">💬</div>
          <h3 class="ep-h3 ep-mt-0" data-i18n="paciente-mensagens:emptyTitle">Selecione uma conversa</h3>
          <p class="ep-text-muted ep-mt-8" data-i18n="paciente-mensagens:emptySub">
            Conversas aparecem aqui quando seu(sua) profissional iniciar.
          </p>
        </div>
        <div id="msgThread" class="ep-hide" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
          <div style="padding: 8px 16px; background: var(--ep-bg-2); border-bottom: 1px solid var(--ep-line);">
            <div id="msgPeerName" style="font-weight: 600; font-size: 15px; line-height: 1.3;">—</div>
            <div class="ep-text-xs ep-text-muted" data-i18n="paciente-mensagens:e2eeBadge">cifrada ponta-a-ponta</div>
          </div>
          <div id="msgList" class="ep-chat-area" style="flex: 1; overflow-y: auto; min-height: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px;"></div>
          <div style="background: var(--ep-bg-2); border-top: 1px solid var(--ep-line); position: relative;">
            <div style="padding: 10px 12px; display: flex; gap: 8px; align-items: center;">
              <button id="emojiToggleBtn" type="button" aria-label="Inserir emoji" title="Inserir emoji" style="border: 0; background: transparent; cursor: pointer; padding: 4px; line-height: 1; border-radius: 8px; flex-shrink: 0; color: var(--ep-ink-3); display: flex; align-items: center;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
              </button>
              <input id="msgInput" type="text" class="ep-input" data-i18n-placeholder="paciente-mensagens:composer.placeholder" placeholder="Digite uma mensagem…" maxlength="3000" style="flex: 1; border-radius: 20px; padding: 8px 16px; font-size: 14px;">
              <button id="msgSendBtn" type="button" class="ep-btn ep-btn--primary" style="border-radius: 20px; padding: 8px 20px;" data-i18n="paciente-mensagens:composer.send">Enviar</button>
            </div>
            <span id="msgStatus" class="ep-text-xs ep-text-muted" style="position: absolute; bottom: 3px; left: 16px;"></span>
          </div>
        </div>

<!-- Emoji picker do composer -->
<div id="composerEmojiPicker" role="dialog" style="position: fixed; z-index: 1001; display: none; background: #fff; border: 1px solid var(--ep-line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); padding: 8px; gap: 2px; grid-template-columns: repeat(10, 36px); width: max-content;"></div>

<script type="module">
  import { signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "./js/firebase-config.js";
  import { requirePatient } from "./js/patient-auth-guard.js?v=2";
  import {
    generateEcdhKeypair,
    wrapKey, unwrapKey,
    unwrapThreadKeyFromPeer,
    encryptNote, decryptNote
  } from "./js/crypto.js";
  import { clearPatientDek } from "./js/patient-session.js";

  function tr(key, fallback, opts) {
    if (window.EP_I18N && window.EP_I18N.t) {
      const v = window.EP_I18N.t(key, opts);
      if (v && v !== key) return v;
    }
    return fallback;
  }
  function currentLocale() {
    if (window.EP_I18N && window.EP_I18N.locale) {
      try { return window.EP_I18N.locale(); } catch (_) { /* empty */ }
    }
    return (document.documentElement.lang || "pt-BR");
  }

  const ctx = await requirePatient({ requireDek: true });
  const { idToken, account, dek } = ctx;
  const myUid = ctx.user.uid;

  document.getElementById("navUser").textContent = account.displayName
    ? tr("paciente-mensagens:nav.greetingPrefix", "Olá, ") + account.displayName
    : tr("paciente-mensagens:nav.userLoading", "…");

  // ─── ECDH lazy ──────────────────────────────────────────────────
  let myEcdhPrivBytes = null;
  let myEcdhPublicJwk = null;

  async function ensureEcdhKeypair() {
    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/keypair`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    if (r.ok) {
      const d = await r.json();
      myEcdhPublicJwk = d.ecdhPublicJwk;
      myEcdhPrivBytes = await unwrapKey(d.ecdhPrivateWrapped, dek);
      return;
    }
    if (r.status !== 404) {
      const body = await r.text().catch(() => "");
      throw new Error(`GET keypair falhou: HTTP ${r.status} ${body.slice(0, 200)}`);
    }
    const kp = await generateEcdhKeypair();
    const privWrapped = await wrapKey(kp.privateRaw, dek);
    const post = await fetch(`${BACKEND_BASE_URL}/therapy/chat/keypair`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${idToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ ecdhPublicJwk: kp.publicJwk, ecdhPrivateWrapped: privWrapped })
    });
    if (!post.ok) {
      const body = await post.text().catch(() => "");
      throw new Error(`POST keypair falhou: HTTP ${post.status} ${body.slice(0, 200)}`);
    }
    myEcdhPublicJwk = kp.publicJwk;
    myEcdhPrivBytes = kp.privateRaw;
  }
  let ecdhReady = false;
  try {
    await ensureEcdhKeypair();
    ecdhReady = true;
  } catch (e) {
    console.error("ecdh_init_failed", e);
    const errMsg = e?.message || tr("paciente-mensagens:ecdh.unknownError", "desconhecido");
    const tpl = tr(
      "paciente-mensagens:ecdh.initError",
      "Não consegui inicializar a chave ECDH do chat. Detalhe: {{err}}<br><br>Recarregue a página em 30s.",
      { err: escapeHtmlSafeFn(errMsg) }
    );
    // Se tr() devolveu a string já interpolada, usa direto; senão faz fallback manual.
    const html = tpl.includes("{{err}}") ? tpl.replace("{{err}}", escapeHtmlSafeFn(errMsg)) : tpl;
    document.getElementById("threadList").innerHTML =
      `<div class="ep-status is-err" style="margin:12px;font-size:12px;">${html}</div>`;
  }
  function escapeHtmlSafeFn(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
  }

  // ─── Push subscription (best-effort, prompt na 1ª visita) ───────
  // Pra paciente receber notificação quando profissional enviar mensagem.
  (async () => {
    try {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
      if (Notification.permission === "denied") return;
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();
      if (existing) return; // já subscrito
      if (Notification.permission !== "granted") {
        // pede permissão sem ser invasivo — só na 1ª visita à página de chat
        const flagKey = "ep:paciente:push-prompted";
        if (localStorage.getItem(flagKey)) return;
        localStorage.setItem(flagKey, "1");
        const perm = await Notification.requestPermission();
        if (perm !== "granted") return;
      }
      const cfgRes = await fetch(`${BACKEND_BASE_URL}/therapy/push/config`, {
        headers: { "Authorization": `Bearer ${idToken}` }
      });
      const cfg = await cfgRes.json().catch(() => ({}));
      if (!cfg.ok || !cfg.publicKey) return;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(cfg.publicKey)
      });
      await fetch(`${BACKEND_BASE_URL}/therapy/paciente/push/subscribe`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${idToken}` },
        body: JSON.stringify({ subscription: sub.toJSON() })
      });
    } catch (e) { /* push é best-effort */ }
  })();

  function urlBase64ToUint8Array(b64) {
    const padding = "=".repeat((4 - b64.length % 4) % 4);
    const base64 = (b64 + padding).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(base64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // ─── Helpers ────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
  }
  function fmtTime(ms) {
    if (!ms) return "";
    const d = new Date(ms);
    const today = new Date();
    const loc = currentLocale();
    if (d.toDateString() === today.toDateString()) {
      return d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
    }
    return d.toLocaleString(loc, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  const threadKeyCache = new Map();
  let currentThreadId = null;
  let currentThread = null;
  let pollTimer = null;
  let presenceTimer = null;
  let lastSeenMessageMs = 0;

  function pingPresence(threadId, offline = false) {
    if (!threadId) return;
    const opts = {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${idToken}`, "Content-Type": "application/json" },
      body: offline ? JSON.stringify({ offline: true }) : undefined,
      keepalive: offline  // keepalive garante envio mesmo durante unload
    };
    if (!offline) delete opts.body;
    fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(threadId)}/patient-presence`, opts).catch(() => {});
  }
  // Offline imediato ao sair/trocar aba
  document.addEventListener("pagehide", () => pingPresence(currentThreadId, true));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pingPresence(currentThreadId, true);
    else if (currentThreadId) pingPresence(currentThreadId);
  });

  $("logoutBtn").addEventListener("click", async () => {
    clearPatientDek();
    try { await signOut(auth); } catch {}
    window.location.href = "./paciente-login.html";
  });

  // ─── Preview cache (localStorage, nunca sai para o servidor) ────
  const lastMsgKey = id => `ep:pm:preview:${id}`;
  function saveLastMsgPreview(threadId, text, senderRole) {
    if (!threadId || !text) return;
    try { localStorage.setItem(lastMsgKey(threadId), JSON.stringify({ text: String(text).slice(0, 200), senderRole: senderRole || null, at: Date.now() })); } catch(_) {}
  }
  function getLastMsgPreview(threadId) {
    try { const raw = localStorage.getItem(lastMsgKey(threadId)); if (!raw) return null; return JSON.parse(raw); } catch(_) { return null; }
  }
  function plainForPreview(plain) {
    if (plain && plain.startsWith("CONTACT_CARD:")) {
      try { const card = JSON.parse(plain.slice(13)); return `👤 ${card.displayName || "Contato"}`; } catch {}
    }
    return plain;
  }

  function renderThreads(threads) {
    const peerFallback = tr("paciente-mensagens:peerFallback", "Profissional");
    if (!threads.length) {
      $("threadList").innerHTML = `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${tr("paciente-mensagens:threads.empty", "Você ainda não tem conversas.<br>O(a) profissional inicia a partir do consultório.")}</div>`;
      return;
    }
    $("threadList").innerHTML = threads.map(t => {
      const peerName = t.therapistDisplayName || peerFallback;
      const lastTime = t.lastMessageAt ? fmtTime(t.lastMessageAt) : "";
      const isActive = t.threadId === currentThreadId;
      const count = Number(t.unreadCount) || 0;
      const badgeNew = count > 0
        ? `<span style="background:#25d366;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0;">${count > 99 ? "99+" : count}</span>`
        : "";
      const initials = peerName.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase() || "?";
      const preview = getLastMsgPreview(t.threadId);
      let previewLine;
      if (preview && preview.text) {
        const prefix = preview.senderRole === "patient" ? '<span style="color:var(--ep-ink-3);">Você: </span>' : "";
        previewLine = `${prefix}${escapeHtml(preview.text)}`;
      } else {
        previewLine = `<span style="color:var(--ep-ink-3);font-style:italic;">${escapeHtml(tr("paciente-mensagens:threads.noMessages", "Sem mensagens"))}</span>`;
      }
      return `<button type="button" class="ep-thread-card${isActive ? " is-active" : ""}" data-thread-id="${escapeHtml(t.threadId)}" style="text-align:left;padding:10px 12px;margin:6px 8px;border:1px solid ${isActive ? "var(--ep-accent)" : "var(--ep-line)"};border-radius:12px;background:${isActive ? "var(--ep-accent-soft)" : "var(--ep-bg-2)"};cursor:pointer;display:flex;gap:10px;align-items:center;width:calc(100% - 16px);transition:background-color 0.15s ease,border-color 0.15s ease;">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--ep-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0;">${escapeHtml(initials)}</div>
        <div style="flex:1;min-width:0;">
          <div class="ep-flex" style="justify-content:space-between;align-items:center;gap:6px;">
            <span style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(peerName)}</span>
            <span style="font-size:11px;color:var(--ep-ink-3);flex-shrink:0;">${escapeHtml(lastTime)}</span>
          </div>
          <div class="ep-flex" style="gap:6px;align-items:center;margin-top:2px;">
            <span style="font-size:12.5px;color:var(--ep-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">${previewLine}</span>
            ${badgeNew}
          </div>
        </div>
      </button>`;
    }).join("");
  }

  async function decryptThreadPreviews(threads) {
    let changed = false;
    for (const t of threads) {
      if (!t.lastMessageCiphertext || !t.lastMessageIv || !t.lastMessageAt) continue;
      const cached = getLastMsgPreview(t.threadId);
      if (cached && (cached.at || 0) >= t.lastMessageAt) continue;
      try {
        let key = threadKeyCache.get(t.threadId);
        if (!key && t.myThreadKeyWrapper) {
          key = t.myThreadKeyWrappedVia === "own-dek"
            ? await unwrapKey(t.myThreadKeyWrapper, dek)
            : await unwrapThreadKeyFromPeer(t.myThreadKeyWrapper, myEcdhPrivBytes, t.peerEcdhPublicJwk);
          threadKeyCache.set(t.threadId, key);
        }
        if (!key) continue;
        const plain = await decryptNote({ ciphertext: t.lastMessageCiphertext, iv: t.lastMessageIv }, key);
        saveLastMsgPreview(t.threadId, plainForPreview(plain), t.lastMessageSenderRole);
        changed = true;
      } catch {}
    }
    if (changed) renderThreads(threads);
  }

  let _lastThreads = [];
  async function loadThreads() {
    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) {
      $("threadList").innerHTML = `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${escapeHtml(tr("paciente-mensagens:threads.loadError", "Erro ao carregar."))}</div>`;
      return;
    }
    _lastThreads = d.threads || [];
    renderThreads(_lastThreads);
    decryptThreadPreviews(_lastThreads);
  }
  if (ecdhReady) await loadThreads();

  $("threadList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-thread-id]");
    if (!btn) return;
    await openThread(btn.getAttribute("data-thread-id"));
  });

  async function openThread(threadId) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; }
    currentThreadId = threadId;
    $("msgEmpty").classList.add("ep-hide");
    $("msgThread").classList.remove("ep-hide");
    $("msgList").innerHTML = `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${escapeHtml(tr("paciente-mensagens:messages.loading", "Carregando…"))}</div>`;
    $("msgStatus").textContent = "";

    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(threadId)}`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) {
      $("msgList").innerHTML = `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${escapeHtml(tr("paciente-mensagens:messages.loadError", "Erro ao carregar conversa."))}</div>`;
      return;
    }
    currentThread = d.thread;
    $("msgPeerName").textContent = currentThread.therapistDisplayName || tr("paciente-mensagens:peerFallback", "Profissional");

    let threadKeyBytes = threadKeyCache.get(threadId);
    if (!threadKeyBytes) {
      if (currentThread.myThreadKeyWrappedVia === "own-dek") {
        threadKeyBytes = await unwrapKey(currentThread.myThreadKeyWrapper, dek);
      } else {
        threadKeyBytes = await unwrapThreadKeyFromPeer(
          currentThread.myThreadKeyWrapper,
          myEcdhPrivBytes,
          currentThread.peerEcdhPublicJwk
        );
      }
      threadKeyCache.set(threadId, threadKeyBytes);
    }

    await refreshMessages(threadKeyBytes);

    fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(threadId)}/read`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${idToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ until: Date.now() })
    }).catch(() => {});

    pollTimer = setInterval(() => refreshMessages(threadKeyBytes), 8000);

    // Presença: ping imediato + heartbeat a cada 60s enquanto thread aberta
    pingPresence(threadId);
    if (presenceTimer) clearInterval(presenceTimer);
    presenceTimer = setInterval(() => pingPresence(currentThreadId), 10000);

    loadThreads();
  }

  async function refreshMessages(threadKeyBytes) {
    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(currentThreadId)}/messages?limit=100`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) return;

    const corruptedLabel = tr("paciente-mensagens:messages.corrupted", "[mensagem corrompida]");
    const decrypted = [];
    for (const m of (d.messages || [])) {
      try {
        const plain = await decryptNote({ ciphertext: m.ciphertext, iv: m.iv }, threadKeyBytes);
        decrypted.push({ ...m, plain });
      } catch {
        decrypted.push({ ...m, plain: corruptedLabel });
      }
    }

    const newest = decrypted.length ? decrypted[decrypted.length - 1].createdAt : 0;
    const grewSinceLast = newest > lastSeenMessageMs;
    lastSeenMessageMs = newest;

    const emptyMsg = tr("paciente-mensagens:messages.empty", "Nenhuma mensagem ainda.");

    function renderBubbleContent(plain) {
      if (plain && plain.startsWith("CONTACT_CARD:")) {
        try {
          const card = JSON.parse(plain.slice(13));
          const initials = escapeHtml((card.displayName || "?").charAt(0).toUpperCase());
          const sub = [card.especialidade, card.conselho].filter(Boolean).join(" · ");
          return `<div class="ep-contact-card">
            <div class="ep-contact-card__head">
              <div class="ep-contact-card__avatar">${initials}</div>
              <div>
                <div class="ep-contact-card__name">${escapeHtml(card.displayName || "")}</div>
                ${sub ? `<div class="ep-contact-card__sub">${escapeHtml(sub)}</div>` : ""}
              </div>
            </div>
            <div class="ep-contact-card__divider"></div>
            <div class="ep-contact-card__label">👤 Profissional indicado</div>
          </div>`;
        } catch {}
      }
      return `<span class="ep-wb-text">${escapeHtml(plain)}</span>`;
    }

    $("msgList").innerHTML = decrypted.map(m => {
      const mine = m.senderRole === "patient";
      return `
        <div class="ep-msg-bubble ${mine ? "is-mine" : "is-theirs"}">
          ${renderBubbleContent(m.plain)}
          <div class="ep-msg-bubble__time">${fmtTime(m.createdAt)}</div>
        </div>
      `;
    }).join("") || `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${escapeHtml(emptyMsg)}</div>`;

    if (decrypted.length) {
      const last = decrypted[decrypted.length - 1];
      saveLastMsgPreview(currentThreadId, plainForPreview(last.plain), last.senderRole);
      renderThreads(_lastThreads);
    }

    if (grewSinceLast) {
      const list = $("msgList");
      list.scrollTop = list.scrollHeight;
    }
  }

  $("msgSendBtn").addEventListener("click", () => sendCurrentMessage());
  $("msgInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); sendCurrentMessage(); }
  });

  // ─── Emoji picker do composer ────────────────────────────────────
  const COMPOSER_EMOJIS = [
    "😀","😃","😄","😁","😆","😅","😂","🤣","😊","🙂",
    "😉","😍","🥰","😘","😋","😎","🤩","🥳","😏","😞",
    "😢","😭","😤","😠","🤬","🤯","😱","😨","🥺","🙄",
    "😴","🤐","🤔","🤫","🤥","😷","🤒","🤕","❤️","🧡",
    "💛","💚","💙","💜","🖤","💔","💯","👍","👎","👌",
    "✌️","🤞","🤝","🙏","👏","🙌","💪","👋","🎉","🔥"
  ];
  const composerPicker = $("composerEmojiPicker");
  composerPicker.innerHTML = COMPOSER_EMOJIS.map(e =>
    `<button type="button" data-insert-emoji="${e}" style="font-size: 22px; background: transparent; border: 0; cursor: pointer; padding: 0; width: 36px; height: 36px; border-radius: 6px; line-height: 1; display: flex; align-items: center; justify-content: center;">${e}</button>`
  ).join("");
  const emojiToggleBtn = $("emojiToggleBtn");
  function closeComposerPicker() { composerPicker.style.display = "none"; }
  function toggleComposerPicker() {
    if (composerPicker.style.display !== "none") { closeComposerPicker(); return; }
    composerPicker.style.display = "grid";
    const rect = emojiToggleBtn.getBoundingClientRect();
    const w = composerPicker.offsetWidth;
    let left = Math.max(8, rect.left);
    if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
    let top = rect.top - composerPicker.offsetHeight - 8;
    if (top < 8) top = rect.bottom + 8;
    composerPicker.style.left = left + "px";
    composerPicker.style.top  = top  + "px";
  }
  emojiToggleBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleComposerPicker(); });
  composerPicker.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-insert-emoji]");
    if (!btn) return;
    const emoji = btn.dataset.insertEmoji;
    const inp = $("msgInput");
    const start = inp.selectionStart ?? inp.value.length;
    const end = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, start) + emoji + inp.value.slice(end);
    inp.focus();
    inp.setSelectionRange(start + emoji.length, start + emoji.length);
  });
  document.addEventListener("click", (e) => {
    if (composerPicker.style.display !== "none" && !composerPicker.contains(e.target) && e.target !== emojiToggleBtn) closeComposerPicker();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && composerPicker.style.display !== "none") closeComposerPicker();
  });

  async function sendCurrentMessage() {
    if (!currentThreadId) return;
    const text = $("msgInput").value.trim();
    if (!text) return;
    const threadKeyBytes = threadKeyCache.get(currentThreadId);
    if (!threadKeyBytes) return;

    $("msgSendBtn").disabled = true;
    $("msgStatus").textContent = tr("paciente-mensagens:status.encrypting", "cifrando…");
    try {
      const enc = await encryptNote(text, threadKeyBytes);
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(currentThreadId)}/messages`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${idToken}`, "Content-Type": "application/json" },
        body: JSON.stringify(enc)
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d?.error || `HTTP ${r.status}`);
      $("msgInput").value = "";
      $("msgStatus").textContent = "";
      saveLastMsgPreview(currentThreadId, plainForPreview(text), "patient");
      await refreshMessages(threadKeyBytes);
      loadThreads();
    } catch (e) {
      $("msgStatus").textContent = tr("paciente-mensagens:status.errorPrefix", "Erro: ") + (e?.message || "");
    } finally {
      $("msgSendBtn").disabled = false;
    }
  }

  if (ecdhReady) setInterval(() => loadThreads(), 30_000);
</script>

</body>
</html>
