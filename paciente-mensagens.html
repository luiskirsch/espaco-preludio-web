<!DOCTYPE html>
<html lang="pt-BR" data-i18n-ns="paciente-mensagens">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{if(localStorage.getItem("ep:theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://osl-video-server-staging.up.railway.app">
  <script type="speculationrules">{"prerender":[{"where":{"selector_matches":"a[href$='.html']:not([href^='http'])"},"eagerness":"moderate"}]}</script>
  <title data-i18n="paciente-mensagens:title">Mensagens · Espaço Prelúdio</title>
  <link rel="icon" type="image/png" href="/logo_oficial_fundo_transparente.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/espaco-preludio.css?v=3-269">
  <script src="./i18n/init.js?v=1-0" defer></script>
  <script src="./js/monitoring.js?v=3" defer></script>
</head>
<body>

<div class="ep-shell">
  <header class="ep-topbar">
    <a href="./paciente-painel.html" class="ep-brand" aria-label="Espaço Prelúdio">
      <span class="ep-brand__mark">EP</span>
      <span class="ep-brand__name">
        <span class="ep-brand__lead" data-i18n="common:brand.lead">Espaço</span>
        <span data-i18n="common:brand.tail">Prelúdio</span>
      </span>
    </a>
    <nav class="ep-nav">
      <a href="./paciente-painel.html" class="ep-text-sm" data-i18n="paciente-mensagens:nav.history">Histórico</a>
      <a href="./paciente-audit.html" class="ep-text-sm" data-i18n="paciente-mensagens:nav.audit">Auditoria</a>
      <span id="navUser" class="ep-text-sm ep-text-muted" data-i18n="paciente-mensagens:nav.userLoading">…</span>
      <button class="ep-btn ep-btn--ghost ep-btn--sm" type="button" id="logoutBtn" data-i18n="paciente-mensagens:nav.logout">Sair</button>
    </nav>
  </header>

  <main class="ep-main">
    <div class="ep-eyebrow" data-i18n="paciente-mensagens:eyebrow">Conversas</div>
    <h1 class="ep-h1 ep-mt-12" data-i18n="paciente-mensagens:h1">Mensagens</h1>
    <p class="ep-text-muted ep-mt-8" data-i18n-html="paciente-mensagens:subtitle">
      Conversas com seu(sua) profissional. <strong>Cifradas ponta-a-ponta</strong> — só você e ele(a) leem.
    </p>

    <div id="mensagensLayout" class="ep-msg-layout ep-mt-24">
      <aside class="ep-msg-threads">
        <div class="ep-msg-threads__head">
          <strong class="ep-text-sm" data-i18n="paciente-mensagens:threadsHead">Profissionais</strong>
        </div>
        <div id="threadList" class="ep-msg-threads__list">
          <div class="ep-text-xs ep-text-muted" style="padding: 12px;" data-i18n="paciente-mensagens:threads.loading">Carregando…</div>
        </div>
      </aside>

      <section class="ep-msg-main">
        <div id="msgEmpty" class="ep-msg-empty">
          <h3 class="ep-h3" data-i18n="paciente-mensagens:emptyTitle">Selecione uma conversa</h3>
          <p class="ep-text-muted ep-mt-8" data-i18n="paciente-mensagens:emptySub">
            Conversas aparecem aqui quando seu(sua) profissional iniciar.
          </p>
        </div>

        <div id="msgThread" class="ep-msg-thread ep-hide">
          <header class="ep-msg-thread__head">
            <div>
              <div id="msgPeerName" class="ep-h3 ep-mt-0">—</div>
              <div class="ep-text-xs ep-text-muted" data-i18n="paciente-mensagens:e2eeBadge">cifrada ponta-a-ponta</div>
            </div>
          </header>
          <div id="msgList" class="ep-msg-thread__list"></div>
          <form id="msgForm" class="ep-msg-thread__composer">
            <textarea id="msgInput" data-i18n-placeholder="paciente-mensagens:composer.placeholder" placeholder="Digite uma mensagem… (Ctrl+Enter envia)" maxlength="3000" rows="2"></textarea>
            <div class="ep-flex" style="justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--ep-line);">
              <span id="msgStatus" class="ep-text-xs ep-text-muted">&nbsp;</span>
              <button id="msgSendBtn" type="submit" class="ep-btn ep-btn--primary ep-btn--sm" data-i18n="paciente-mensagens:composer.send">Enviar</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>
</div>

<script type="module">
  import { signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "./js/firebase-config.js";
  import { requirePatient } from "./js/patient-auth-guard.js?v=2";
  import {
    generateEcdhKeypair,
    wrapKey, unwrapKey,
    unwrapThreadKeyFromPeer,
    encryptNote, decryptNote
  } from "./js/crypto.js";
  import { clearPatientDek } from "./js/patient-session.js";

  function tr(key, fallback, opts) {
    if (window.EP_I18N && window.EP_I18N.t) {
      const v = window.EP_I18N.t(key, opts);
      if (v && v !== key) return v;
    }
    return fallback;
  }
  function currentLocale() {
    if (window.EP_I18N && window.EP_I18N.locale) {
      try { return window.EP_I18N.locale(); } catch (_) { /* empty */ }
    }
    return (document.documentElement.lang || "pt-BR");
  }

  const ctx = await requirePatient({ requireDek: true });
  const { idToken, account, dek } = ctx;
  const myUid = ctx.user.uid;

  document.getElementById("navUser").textContent = account.displayName
    ? tr("paciente-mensagens:nav.greetingPrefix", "Olá, ") + account.displayName
    : tr("paciente-mensagens:nav.userLoading", "…");

  // ─── ECDH lazy ──────────────────────────────────────────────────
  let myEcdhPrivBytes = null;
  let myEcdhPublicJwk = null;

  async function ensureEcdhKeypair() {
    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/keypair`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    if (r.ok) {
      const d = await r.json();
      myEcdhPublicJwk = d.ecdhPublicJwk;
      myEcdhPrivBytes = await unwrapKey(d.ecdhPrivateWrapped, dek);
      return;
    }
    if (r.status !== 404) {
      const body = await r.text().catch(() => "");
      throw new Error(`GET keypair falhou: HTTP ${r.status} ${body.slice(0, 200)}`);
    }
    const kp = await generateEcdhKeypair();
    const privWrapped = await wrapKey(kp.privateRaw, dek);
    const post = await fetch(`${BACKEND_BASE_URL}/therapy/chat/keypair`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${idToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ ecdhPublicJwk: kp.publicJwk, ecdhPrivateWrapped: privWrapped })
    });
    if (!post.ok) {
      const body = await post.text().catch(() => "");
      throw new Error(`POST keypair falhou: HTTP ${post.status} ${body.slice(0, 200)}`);
    }
    myEcdhPublicJwk = kp.publicJwk;
    myEcdhPrivBytes = kp.privateRaw;
  }
  let ecdhReady = false;
  try {
    await ensureEcdhKeypair();
    ecdhReady = true;
  } catch (e) {
    console.error("ecdh_init_failed", e);
    const errMsg = e?.message || tr("paciente-mensagens:ecdh.unknownError", "desconhecido");
    const tpl = tr(
      "paciente-mensagens:ecdh.initError",
      "Não consegui inicializar a chave ECDH do chat. Detalhe: {{err}}<br><br>Recarregue a página em 30s.",
      { err: escapeHtmlSafeFn(errMsg) }
    );
    // Se tr() devolveu a string já interpolada, usa direto; senão faz fallback manual.
    const html = tpl.includes("{{err}}") ? tpl.replace("{{err}}", escapeHtmlSafeFn(errMsg)) : tpl;
    document.getElementById("threadList").innerHTML =
      `<div class="ep-status is-err" style="margin:12px;font-size:12px;">${html}</div>`;
  }
  function escapeHtmlSafeFn(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
  }

  // ─── Push subscription (best-effort, prompt na 1ª visita) ───────
  // Pra paciente receber notificação quando profissional enviar mensagem.
  (async () => {
    try {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
      if (Notification.permission === "denied") return;
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();
      if (existing) return; // já subscrito
      if (Notification.permission !== "granted") {
        // pede permissão sem ser invasivo — só na 1ª visita à página de chat
        const flagKey = "ep:paciente:push-prompted";
        if (localStorage.getItem(flagKey)) return;
        localStorage.setItem(flagKey, "1");
        const perm = await Notification.requestPermission();
        if (perm !== "granted") return;
      }
      const cfgRes = await fetch(`${BACKEND_BASE_URL}/therapy/push/config`, {
        headers: { "Authorization": `Bearer ${idToken}` }
      });
      const cfg = await cfgRes.json().catch(() => ({}));
      if (!cfg.ok || !cfg.publicKey) return;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(cfg.publicKey)
      });
      await fetch(`${BACKEND_BASE_URL}/therapy/paciente/push/subscribe`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${idToken}` },
        body: JSON.stringify({ subscription: sub.toJSON() })
      });
    } catch (e) { /* push é best-effort */ }
  })();

  function urlBase64ToUint8Array(b64) {
    const padding = "=".repeat((4 - b64.length % 4) % 4);
    const base64 = (b64 + padding).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(base64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // ─── Helpers ────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
  }
  function fmtTime(ms) {
    if (!ms) return "";
    const d = new Date(ms);
    const today = new Date();
    const loc = currentLocale();
    if (d.toDateString() === today.toDateString()) {
      return d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
    }
    return d.toLocaleString(loc, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  const threadKeyCache = new Map();
  let currentThreadId = null;
  let currentThread = null;
  let pollTimer = null;
  let lastSeenMessageMs = 0;

  $("logoutBtn").addEventListener("click", async () => {
    clearPatientDek();
    try { await signOut(auth); } catch {}
    window.location.href = "./paciente-login.html";
  });

  async function loadThreads() {
    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) {
      $("threadList").innerHTML = `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${escapeHtml(tr("paciente-mensagens:threads.loadError", "Erro ao carregar."))}</div>`;
      return;
    }
    const threads = d.threads || [];
    if (!threads.length) {
      $("threadList").innerHTML = `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${tr("paciente-mensagens:threads.empty", "Você ainda não tem conversas.<br>O(a) profissional inicia a partir do consultório.")}</div>`;
      return;
    }
    const peerFallback = tr("paciente-mensagens:peerFallback", "Profissional");
    $("threadList").innerHTML = threads.map(t => {
      const peerName = t.therapistDisplayName || peerFallback;
      const unreadDot = t.hasUnread ? `<span class="ep-msg-unread"></span>` : "";
      const lastTime = t.lastMessageAt ? fmtTime(t.lastMessageAt) : "";
      const cls = t.threadId === currentThreadId ? " is-active" : "";
      return `
        <button type="button" class="ep-msg-thread-item${cls}" data-thread-id="${t.threadId}">
          <div class="ep-msg-thread-item__name">${escapeHtml(peerName)} ${unreadDot}</div>
          <div class="ep-msg-thread-item__time">${lastTime}</div>
        </button>
      `;
    }).join("");
  }
  if (ecdhReady) await loadThreads();

  $("threadList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-thread-id]");
    if (!btn) return;
    await openThread(btn.getAttribute("data-thread-id"));
  });

  async function openThread(threadId) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    currentThreadId = threadId;
    $("msgEmpty").classList.add("ep-hide");
    $("msgThread").classList.remove("ep-hide");
    $("msgList").innerHTML = `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${escapeHtml(tr("paciente-mensagens:messages.loading", "Carregando…"))}</div>`;
    $("msgStatus").textContent = "";

    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(threadId)}`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) {
      $("msgList").innerHTML = `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${escapeHtml(tr("paciente-mensagens:messages.loadError", "Erro ao carregar conversa."))}</div>`;
      return;
    }
    currentThread = d.thread;
    $("msgPeerName").textContent = currentThread.therapistDisplayName || tr("paciente-mensagens:peerFallback", "Profissional");

    let threadKeyBytes = threadKeyCache.get(threadId);
    if (!threadKeyBytes) {
      if (currentThread.myThreadKeyWrappedVia === "own-dek") {
        threadKeyBytes = await unwrapKey(currentThread.myThreadKeyWrapper, dek);
      } else {
        threadKeyBytes = await unwrapThreadKeyFromPeer(
          currentThread.myThreadKeyWrapper,
          myEcdhPrivBytes,
          currentThread.peerEcdhPublicJwk
        );
      }
      threadKeyCache.set(threadId, threadKeyBytes);
    }

    await refreshMessages(threadKeyBytes);

    fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(threadId)}/read`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${idToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ until: Date.now() })
    }).catch(() => {});

    pollTimer = setInterval(() => refreshMessages(threadKeyBytes), 8000);
    loadThreads();
  }

  async function refreshMessages(threadKeyBytes) {
    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(currentThreadId)}/messages?limit=100`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) return;

    const corruptedLabel = tr("paciente-mensagens:messages.corrupted", "[mensagem corrompida]");
    const decrypted = [];
    for (const m of (d.messages || [])) {
      try {
        const plain = await decryptNote({ ciphertext: m.ciphertext, iv: m.iv }, threadKeyBytes);
        decrypted.push({ ...m, plain });
      } catch {
        decrypted.push({ ...m, plain: corruptedLabel });
      }
    }

    const newest = decrypted.length ? decrypted[decrypted.length - 1].createdAt : 0;
    const grewSinceLast = newest > lastSeenMessageMs;
    lastSeenMessageMs = newest;

    const emptyMsg = tr("paciente-mensagens:messages.empty", "Nenhuma mensagem ainda.");
    $("msgList").innerHTML = decrypted.map(m => {
      const mine = m.senderRole === "patient";
      return `
        <div class="ep-msg-bubble ${mine ? "is-mine" : "is-theirs"}">
          <div class="ep-msg-bubble__text">${escapeHtml(m.plain)}</div>
          <div class="ep-msg-bubble__time">${fmtTime(m.createdAt)}</div>
        </div>
      `;
    }).join("") || `<div class="ep-text-xs ep-text-muted" style="padding:12px;">${escapeHtml(emptyMsg)}</div>`;

    if (grewSinceLast) {
      const list = $("msgList");
      list.scrollTop = list.scrollHeight;
    }
  }

  $("msgForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await sendCurrentMessage();
  });
  $("msgInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendCurrentMessage(); }
  });

  async function sendCurrentMessage() {
    if (!currentThreadId) return;
    const text = $("msgInput").value.trim();
    if (!text) return;
    const threadKeyBytes = threadKeyCache.get(currentThreadId);
    if (!threadKeyBytes) return;

    $("msgSendBtn").disabled = true;
    $("msgStatus").textContent = tr("paciente-mensagens:status.encrypting", "cifrando…");
    try {
      const enc = await encryptNote(text, threadKeyBytes);
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(currentThreadId)}/messages`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${idToken}`, "Content-Type": "application/json" },
        body: JSON.stringify(enc)
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d?.error || `HTTP ${r.status}`);
      $("msgInput").value = "";
      $("msgStatus").textContent = "";
      await refreshMessages(threadKeyBytes);
      loadThreads();
    } catch (e) {
      $("msgStatus").textContent = tr("paciente-mensagens:status.errorPrefix", "Erro: ") + (e?.message || "");
    } finally {
      $("msgSendBtn").disabled = false;
    }
  }

  if (ecdhReady) setInterval(() => loadThreads(), 30_000);
</script>

</body>
</html>
