<!DOCTYPE html>
<html lang="pt-BR" data-i18n-ns="paciente-login">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="paciente-login:title">Entrar · Espaço Prelúdio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/espaco-preludio.css?v=3-224">
  <script src="./i18n/init.js?v=1-0" defer></script>
  <script src="./js/monitoring.js?v=3" defer></script>
</head>
<body>

<main class="ep-auth">
  <div class="ep-auth__panel">
    <a href="./index.html" class="ep-brand" aria-label="Espaço Prelúdio">
      <span class="ep-brand__mark">EP</span>
      <span class="ep-brand__name">
        <span class="ep-brand__lead" data-i18n="common:brand.lead">Espaço</span>
        <span data-i18n="common:brand.tail">Prelúdio</span>
      </span>
    </a>

    <h2 class="ep-auth__title ep-mt-32" data-i18n="paciente-login:h2">Entrar na sua conta</h2>
    <p class="ep-auth__sub" data-i18n="paciente-login:sub">
      Sua senha desbloqueia também a chave que decifra suas anotações.
    </p>

    <div id="reauthAlert" class="ep-alert ep-alert--info ep-mt-12 ep-hide" data-i18n="paciente-login:reauthAlert">
      Sua sessão de cifragem expirou. Confirme sua senha para continuar.
    </div>

    <form id="loginForm" class="ep-stack ep-mt-16" novalidate>
      <div class="ep-field">
        <label class="ep-label" for="email" data-i18n="paciente-login:labelEmail">E-mail</label>
        <input id="email" class="ep-input" type="email" autocomplete="email" maxlength="160" required>
      </div>
      <div class="ep-field">
        <label class="ep-label" for="password" data-i18n="paciente-login:labelPassword">Senha</label>
        <input id="password" class="ep-input" type="password" autocomplete="current-password" required>
      </div>

      <div class="ep-status" id="status"></div>

      <div class="ep-stack" style="gap: 8px;">
        <button class="ep-btn ep-btn--primary ep-btn--lg ep-btn--block" type="submit" id="submitBtn" data-i18n="paciente-login:btnSubmit">Entrar</button>
        <a href="./paciente-cadastro.html" class="ep-btn ep-btn--ghost ep-btn--block" data-i18n="paciente-login:btnCreate">Criar conta de paciente</a>
      </div>
    </form>

    <div class="ep-auth__bottom">
      <a href="./paciente-recuperar.html" data-i18n="paciente-login:forgot">Esqueci minha senha · usar chave-semente</a>
    </div>
  </div>
</main>

<script type="module">
  import {
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "./js/firebase-config.js";
  import { unwrapDek } from "./js/crypto.js";
  import { rememberPatientDek, rememberPatientUser } from "./js/patient-session.js";
  function tr(key, fallback) {
    if (window.EP_I18N && window.EP_I18N.t) {
      const v = window.EP_I18N.t(key);
      if (v && v !== key) return v;
    }
    return fallback;
  }
  // Sanitiza redirect: aceita so path relativo same-origin (./...). Bloqueia
  // //evil, /\\evil, https://evil, javascript:, data:, etc. — protege phishing
  // que abusava do redirect pra mandar user pro fake-login.
  function sanitizeRedirect(raw, fallback) {
    if (!raw || typeof raw !== "string") return fallback;
    if (!/^\.\/[a-zA-Z0-9_\-/.?=&%]+$/.test(raw)) return fallback;
    if (raw.includes(":") || raw.includes("//") || raw.includes("\\")) return fallback;
    return raw;
  }


  const params = new URLSearchParams(location.search);
  const reauth = params.get("reauth") === "1";
  const redirect = sanitizeRedirect(params.get("redirect"), "./paciente-painel.html");
  const errorParam = params.get("error");

  if (reauth) document.getElementById("reauthAlert").classList.remove("ep-hide");

  const statusEl = document.getElementById("status");
  function setStatus(text, type = "") {
    statusEl.textContent = text;
    statusEl.className = "ep-status";
    if (type) statusEl.classList.add("is-" + type);
  }

  if (errorParam === "NAO_REGISTRADO") {
    setStatus(tr("paciente-login:errors.naoRegistrado", "Sua conta existe, mas o cadastro de paciente não foi finalizado."), "err");
  }

  async function fetchProfile(idToken) {
    const res = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/me`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    if (res.status === 404) return { ok: false, code: "NAO_REGISTRADO" };
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return { ok: false, code: data?.error || "ERRO_PERFIL" };
    return { ok: true, account: data.account };
  }

  function humanize(err) {
    const code = err?.code || "";
    if (code === "auth/invalid-credential") return tr("paciente-login:errors.invalidCredential", "E-mail ou senha incorretos.");
    if (code === "auth/wrong-password")     return tr("paciente-login:errors.wrongPassword", "Senha incorreta.");
    if (code === "auth/user-not-found")     return tr("paciente-login:errors.userNotFound", "Conta não encontrada.");
    if (code === "auth/too-many-requests")  return tr("paciente-login:errors.tooManyRequests", "Muitas tentativas. Tente novamente em alguns minutos.");
    if (code === "auth/network-request-failed") return tr("paciente-login:errors.networkError", "Erro de conexão.");
    return err?.message || tr("paciente-login:errors.genericError", "Erro ao entrar.");
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;

    const email    = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      setStatus(tr("paciente-login:errors.emptyFields", "Preencha e-mail e senha."), "err");
      submitBtn.disabled = false;
      return;
    }

    try {
      setStatus(tr("paciente-login:errors.authenticating", "Autenticando…"));
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const idToken = await cred.user.getIdToken();

      setStatus(tr("paciente-login:errors.loadingProfile", "Carregando perfil…"));
      const profile = await fetchProfile(idToken);
      if (!profile.ok) {
        if (profile.code === "NAO_REGISTRADO") {
          setStatus(tr("paciente-login:errors.incompleteProfile", "Sua conta existe mas falta finalizar o cadastro de paciente. Indo…"), "err");
          setTimeout(() => { window.location.href = "./paciente-cadastro.html"; }, 1500);
          return;
        }
        setStatus(tr("paciente-login:errors.errorPrefix", "Erro: ") + profile.code, "err");
        submitBtn.disabled = false;
        return;
      }

      const a = profile.account;
      if (!a.e2eeSalt || !a.wrappedDEK || !a.wrappedDEKIv) {
        setStatus(tr("paciente-login:errors.noKey", "Sua conta está sem chave de cifragem. Recadastre-se."), "err");
        submitBtn.disabled = false;
        return;
      }

      setStatus(tr("paciente-login:errors.unlockingKey", "Desbloqueando sua chave…"));
      let dek;
      try {
        dek = await unwrapDek({
          wrappedDEK:   a.wrappedDEK,
          wrappedDEKIv: a.wrappedDEKIv,
          e2eeSalt:     a.e2eeSalt
        }, password);
      } catch {
        setStatus(tr("paciente-login:errors.keyUnlockFailed", "Senha aceita mas a chave não pôde ser desbloqueada."), "err");
        submitBtn.disabled = false;
        return;
      }

      rememberPatientDek(dek);
      rememberPatientUser({ uid: cred.user.uid, email, displayName: a.displayName });

      setStatus(tr("paciente-login:errors.entering", "Entrando…"), "ok");
      window.location.href = redirect;
    } catch (error) {
      console.error("paciente_login_error", error);
      setStatus(humanize(error), "err");
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
