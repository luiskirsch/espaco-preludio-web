  <style>
    .chat-shell { display: flex; flex-direction: column; height: 100dvh; }
    .chat-header {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: var(--a-surface); border-bottom: 1px solid var(--a-line);
      position: sticky; top: 0; z-index: 30; flex-shrink: 0;
    }
    .chat-header__back { background:none;border:none;cursor:pointer;padding:6px;color:var(--a-ink2); }
    .chat-header__avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--a-bg2); display:flex;align-items:center;justify-content:center;
      font-family:var(--ff-serif);font-size:15px;color:var(--a-ink2);flex-shrink:0;overflow:hidden;
    }
    .chat-header__avatar img { width:100%;height:100%;object-fit:cover; }
    .chat-header__info { flex: 1; min-width: 0; }
    .chat-header__name { font-size: 15px; font-weight: 700; color: var(--a-ink); }
    .chat-header__esp  { font-size: 12px; color: var(--a-ink2); }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--a-line); border-radius: 4px; }
    .msg { max-width: 78%; display: flex; flex-direction: column; gap: 3px; }
    .msg--out { align-self: flex-end; align-items: flex-end; }
    .msg--in  { align-self: flex-start; align-items: flex-start; }
    .msg__bubble {
      padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45;
      position: relative; word-break: break-word;
    }
    .msg--out .msg__bubble { background: var(--a-ink); color: #fff; border-bottom-right-radius: 4px; }
    .msg--in  .msg__bubble { background: var(--a-surface); color: var(--a-ink); border-bottom-left-radius: 4px; box-shadow: var(--a-shadow); }
    .msg__time { font-size: 10px; color: var(--a-ink3); padding: 0 4px; }
    .msg__status { font-size: 10px; color: rgba(255,255,255,.6); padding: 0 4px; }
    .chat-input-bar {
      padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: var(--a-surface); border-top: 1px solid var(--a-line);
      display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0;
    }
    .chat-input-wrap {
      flex: 1; background: var(--a-bg); border-radius: 22px;
      padding: 10px 16px; display: flex; align-items: center;
      min-height: 44px; max-height: 120px;
    }
    .chat-input {
      flex: 1; background: none; border: none; outline: none;
      font-family: var(--ff-sans); font-size: 14px; color: var(--a-ink);
      resize: none; line-height: 1.4; max-height: 80px; overflow-y: auto;
    }
    .chat-input::placeholder { color: var(--a-ink3); }
    .chat-send {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--a-accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 120ms, background 150ms; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .chat-send:active { transform: scale(.92); }
    .chat-send:disabled { background: var(--a-line); }
    .chat-send svg { color: #fff; }
    .date-sep { text-align: center; font-size: 11px; color: var(--a-ink3); font-weight: 600;
      background: var(--a-bg); padding: 3px 10px; border-radius: 999px;
      align-self: center; margin: 4px 0; }
    .typing { display: flex; gap: 4px; padding: 10px 14px; background: var(--a-surface);
      border-radius: 18px; border-bottom-left-radius: 4px; box-shadow: var(--a-shadow);
      align-self: flex-start; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--a-ink3);
      animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
    .chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; text-align: center; padding: 32px; }
    .chat-loading { display: flex; flex-direction: column; gap: 1px; padding: 8px 16px; }
    .chat-list { display: flex; flex-direction: column; gap: 1px; }
    .conv-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      background: var(--a-surface); cursor: pointer; transition: background 120ms;
      text-decoration: none; color: inherit;
      width: 100%; border: 0; font: inherit; text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .conv-item:active { background: var(--a-bg2); }
    .conv-item__avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--a-bg2);
      display:flex;align-items:center;justify-content:center;font-family:var(--ff-serif);
      font-size:18px;color:var(--a-ink2);flex-shrink:0;overflow:hidden; }
    .conv-item__avatar img { width:100%;height:100%;object-fit:cover; }
    .conv-item__info { flex: 1; min-width: 0; }
    .conv-item__name { font-size: 14px; font-weight: 700; color: var(--a-ink); }
    .conv-item__preview { font-size: 12px; color: var(--a-ink2); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-item__time { font-size: 11px; color: var(--a-ink3); flex-shrink: 0; }
    .conv-item__badge { width: 20px; height: 20px; border-radius: 50%; background: var(--a-accent);
      color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; }
  </style>

<body class="a-portal-authenticated">
<div class="a-shell">

  <!-- Vista: lista de conversas -->
  <div id="listView" style="display:flex;flex-direction:column;height:100dvh;">
    <div class="a-header">
      <button class="a-header__back" onclick="history.back()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="a-header__title">Mensagens</div>
    </div>

    <div id="convLoading" class="chat-loading">
      <div class="a-skel" style="width:100%;height:70px;border-radius:14px;"></div>
      <div class="a-skel" style="width:100%;height:70px;border-radius:14px;"></div>
      <div class="a-skel" style="width:100%;height:70px;border-radius:14px;"></div>
    </div>
    <div id="convList" class="chat-list" style="display:none;"></div>
    <div id="convEmpty" class="chat-empty a-hide">
      <div style="font-size:48px;">💬</div>
      <div style="font-family:var(--ff-serif);font-size:20px;">Nenhuma conversa ainda</div>
      <div class="a-sub" style="max-width:280px;margin-top:8px;">As conversas aparecem aqui quando o profissional iniciar contato, depois que sua consulta for confirmada.</div>
      <a href="./buscar.html" class="a-btn a-btn--accent a-mt-16">Buscar profissional</a>
    </div>
  </div>

  <!-- Vista: conversa individual -->
  <div id="chatView" class="chat-shell" style="display:none;">
    <div class="chat-header">
      <button class="chat-header__back" onclick="backToList()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="chat-header__avatar" id="chatAvatar">?</div>
      <div class="chat-header__info">
        <div class="chat-header__name" id="chatName">—</div>
        <div class="chat-header__esp" id="chatEsp"></div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-bar">
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chatInput" placeholder="Mensagem…" rows="1"></textarea>
      </div>
      <button class="chat-send" id="chatSendBtn" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "../js/firebase-config.js";
  import {
    generateEcdhKeypair, wrapKey, unwrapKey,
    unwrapThreadKeyFromPeer, encryptNote, decryptNote
  } from "../js/crypto.js";
  import { recallPatientDek } from "../js/patient-session.js";

  let currentUser = null;
  let idToken = null;
  let dek = null;
  let myEcdhPrivBytes = null;
  let currentThreadId = null;
  let currentThread = null;
  let pollTimer = null;
  const threadKeyCache = new Map();

  function esc(s) { return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtTime(ms) { const d=new Date(Number(ms)); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
  function fmtDay(ms) {
    const d=new Date(Number(ms)); const today=new Date(); today.setHours(0,0,0,0);
    const diff = Math.floor((d.getTime()-today.getTime())/86400000);
    if (diff===0) return "Hoje"; if (diff===-1) return "Ontem";
    return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
  }
  function reauth() {
    window.location.href = "./login.html?reauth=1&redirect=" + encodeURIComponent(location.pathname + location.search);
  }

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "./login.html"; return; }
    currentUser = user;
    idToken = await user.getIdToken();

    dek = recallPatientDek();
    if (!dek) { reauth(); return; }

    try {
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/me`, {
        headers: { Authorization: `Bearer ${idToken}` }
      });
      if (!r.ok) throw new Error("perfil indisponível");
    } catch {
      document.getElementById("convLoading").style.display = "none";
      document.getElementById("convEmpty").classList.remove("a-hide");
      return;
    }

    try {
      await ensureEcdhKeypair();
    } catch (e) {
      document.getElementById("convLoading").style.display = "none";
      document.getElementById("convList").innerHTML = "";
      document.getElementById("convEmpty").classList.remove("a-hide");
      console.error("chat_ecdh_init_failed", e);
      return;
    }

    loadThreads();
    setInterval(loadThreads, 30000);
  });

  // ─── ECDH keypair: lazy gen + cache no backend ─────────────────────
  async function ensureEcdhKeypair() {
    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/keypair`, {
      headers: { Authorization: `Bearer ${idToken}` }
    });
    if (r.ok) {
      const d = await r.json();
      myEcdhPrivBytes = await unwrapKey(d.ecdhPrivateWrapped, dek);
      return;
    }
    if (r.status !== 404) throw new Error(`GET keypair falhou: HTTP ${r.status}`);
    const kp = await generateEcdhKeypair();
    const privWrapped = await wrapKey(kp.privateRaw, dek);
    const post = await fetch(`${BACKEND_BASE_URL}/therapy/chat/keypair`, {
      method: "POST",
      headers: { Authorization: `Bearer ${idToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ ecdhPublicJwk: kp.publicJwk, ecdhPrivateWrapped: privWrapped })
    });
    if (!post.ok) throw new Error(`POST keypair falhou: HTTP ${post.status}`);
    myEcdhPrivBytes = kp.privateRaw;
  }

  async function unwrapThreadKey(t) {
    let key = threadKeyCache.get(t.threadId);
    if (key) return key;
    key = t.myThreadKeyWrappedVia === "own-dek"
      ? await unwrapKey(t.myThreadKeyWrapper, dek)
      : await unwrapThreadKeyFromPeer(t.myThreadKeyWrapper, myEcdhPrivBytes, t.peerEcdhPublicJwk);
    threadKeyCache.set(t.threadId, key);
    return key;
  }

  let _lastThreads = [];
  async function loadThreads() {
    try {
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads`, {
        headers: { Authorization: `Bearer ${idToken}` }
      });
      const d = await r.json().catch(() => ({}));
      document.getElementById("convLoading").style.display = "none";
      if (!r.ok || !d.ok) throw new Error("threads");
      _lastThreads = d.threads || [];
      if (!_lastThreads.length) {
        document.getElementById("convList").style.display = "none";
        document.getElementById("convEmpty").classList.remove("a-hide");
        return;
      }
      document.getElementById("convEmpty").classList.add("a-hide");
      document.getElementById("convList").style.display = "flex";
      await renderThreads();
    } catch {
      document.getElementById("convLoading").style.display = "none";
      if (!_lastThreads.length) document.getElementById("convEmpty").classList.remove("a-hide");
    }
  }

  async function renderThreads() {
    const convList = document.getElementById("convList");
    const rows = await Promise.all(_lastThreads.map(async (t, index) => {
      const name = t.therapistDisplayName || "Profissional";
      const initials = name.trim().split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase() || "?";
      const badge = t.unreadCount > 0 ? `<div class="conv-item__badge">${t.unreadCount > 99 ? "99+" : t.unreadCount}</div>` : "";
      let preview = "Sem mensagens";
      if (t.lastMessageCiphertext && t.lastMessageIv) {
        try {
          const key = await unwrapThreadKey(t);
          preview = await decryptNote({ ciphertext: t.lastMessageCiphertext, iv: t.lastMessageIv }, key);
        } catch { preview = "[mensagem corrompida]"; }
      }
      return `<button type="button" class="conv-item" data-thread-id="${esc(t.threadId)}" data-index="${index}">
        <div class="conv-item__avatar">${esc(initials)}</div>
        <div class="conv-item__info">
          <div class="conv-item__name">${esc(name)}</div>
          <div class="conv-item__preview">${esc(preview)}</div>
        </div>
        <div class="a-flex-col a-items-center" style="gap:4px;flex-shrink:0;">
          <div class="conv-item__time">${t.lastMessageAt ? fmtTime(t.lastMessageAt) : ""}</div>
          ${badge}
        </div>
      </button>`;
    }));
    convList.innerHTML = rows.join("");
    convList.querySelectorAll("[data-thread-id]").forEach(btn => {
      btn.addEventListener("click", () => openThread(btn.dataset.threadId));
    });
  }

  window.backToList = function backToList() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    currentThreadId = null;
    document.getElementById("chatView").style.display = "none";
    document.getElementById("listView").style.display = "flex";
    loadThreads();
  };

  async function openThread(threadId) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    currentThreadId = threadId;
    document.getElementById("listView").style.display = "none";
    document.getElementById("chatView").style.display = "flex";
    document.getElementById("chatMessages").innerHTML = "";

    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(threadId)}`, {
      headers: { Authorization: `Bearer ${idToken}` }
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { backToList(); return; }
    currentThread = d.thread;

    const name = currentThread.therapistDisplayName || "Profissional";
    document.getElementById("chatName").textContent = name;
    document.getElementById("chatEsp").textContent = "";
    const initials = name.trim().split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase() || "?";
    document.getElementById("chatAvatar").textContent = initials;

    const threadKeyBytes = await unwrapThreadKey(currentThread);
    await refreshMessages(threadKeyBytes);

    fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(threadId)}/read`, {
      method: "PATCH",
      headers: { Authorization: `Bearer ${idToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ until: Date.now() })
    }).catch(() => {});

    pollTimer = setInterval(() => refreshMessages(threadKeyBytes), 5000);
  }

  async function refreshMessages(threadKeyBytes) {
    const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(currentThreadId)}/messages?limit=100`, {
      headers: { Authorization: `Bearer ${idToken}` }
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) return;

    const decrypted = [];
    for (const m of (d.messages || [])) {
      try {
        const plain = await decryptNote({ ciphertext: m.ciphertext, iv: m.iv }, threadKeyBytes);
        decrypted.push({ ...m, plain });
      } catch {
        decrypted.push({ ...m, plain: "[mensagem corrompida]" });
      }
    }

    const container = document.getElementById("chatMessages");
    let lastDate = "";
    container.innerHTML = decrypted.map(m => {
      const isOut = m.senderRole === "patient";
      const dayLabel = fmtDay(m.createdAt);
      let dateSep = "";
      if (dayLabel !== lastDate) { dateSep = `<div class="date-sep">${esc(dayLabel)}</div>`; lastDate = dayLabel; }
      return `${dateSep}
        <div class="msg ${isOut ? "msg--out" : "msg--in"}">
          <div class="msg__bubble">${esc(m.plain)}</div>
          <div class="${isOut ? "msg__status" : "msg__time"}">${fmtTime(m.createdAt)}</div>
        </div>`;
    }).join("") || "";
    container.scrollTop = container.scrollHeight;
  }

  const chatInput = document.getElementById("chatInput");
  const sendBtn   = document.getElementById("chatSendBtn");

  chatInput.addEventListener("input", () => {
    sendBtn.disabled = !chatInput.value.trim();
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 80) + "px";
  });
  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener("click", sendMessage);

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || !currentThreadId) return;
    const threadKeyBytes = threadKeyCache.get(currentThreadId);
    if (!threadKeyBytes) return;
    chatInput.value = ""; chatInput.style.height = "auto"; sendBtn.disabled = true;
    try {
      const enc = await encryptNote(text, threadKeyBytes);
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/chat/threads/${encodeURIComponent(currentThreadId)}/messages`, {
        method: "POST",
        headers: { Authorization: `Bearer ${idToken}`, "Content-Type": "application/json" },
        body: JSON.stringify(enc)
      });
      if (!r.ok) throw new Error("send failed");
      await refreshMessages(threadKeyBytes);
    } catch { /* mensagem fica no campo perdida — usuário pode reenviar */ }
  }
</script>
</body>
