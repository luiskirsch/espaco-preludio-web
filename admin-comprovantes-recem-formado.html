<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Comprovantes Recém-formado · Espaço Prelúdio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/espaco-preludio.css?v=3-71">
</head>
<body>

<div class="ep-shell">
  <header class="ep-topbar">
    <a href="./index.html" class="ep-brand" aria-label="Espaço Prelúdio">
      <span class="ep-brand__mark">EP</span>
      <span class="ep-brand__name">
        <span class="ep-brand__lead">Espaço</span>
        <span>Prelúdio · Admin</span>
      </span>
    </a>
    <nav class="ep-nav">
      <a href="./admin-verificacoes.html" class="ep-text-sm">CRP/CRM</a>
      <a href="./admin-comprovantes.html" class="ep-text-sm">Estudante</a>
      <a href="./admin-comprovantes-recem-formado.html" class="ep-text-sm" style="font-weight: 600;">Recém-formado</a>
      <a href="./admin-comprovantes-formacao.html" class="ep-text-sm">Sem conselho</a>
      <span id="adminEmail" class="ep-text-sm ep-text-muted">…</span>
      <button id="logoutBtn" class="ep-btn ep-btn--ghost ep-btn--sm" type="button">Sair</button>
    </nav>
  </header>

  <main class="ep-main">

    <section id="loginPanel" class="ep-hide" style="max-width: 400px; margin: 40px auto;">
      <div class="ep-auth__panel">
        <h2 class="ep-auth__title">Acesso Admin</h2>
        <form id="loginForm" class="ep-stack ep-mt-16" novalidate>
          <div class="ep-field">
            <label class="ep-label" for="email">E-mail</label>
            <input id="email" class="ep-input" type="email" autocomplete="email" required>
          </div>
          <div class="ep-field">
            <label class="ep-label" for="password">Senha</label>
            <input id="password" class="ep-input" type="password" autocomplete="current-password" required>
          </div>
          <div class="ep-status" id="loginStatus"></div>
          <button class="ep-btn ep-btn--primary ep-btn--lg ep-btn--block" type="submit" id="loginBtn">Entrar</button>
        </form>
      </div>
    </section>

    <section id="dashboardPanel" class="ep-hide">
      <div class="ep-flex" style="justify-content: space-between; align-items: end; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
        <div>
          <div class="ep-eyebrow">Painel administrativo</div>
          <h1 class="ep-h1 ep-mt-12">Comprovantes Recém-formado</h1>
          <p class="ep-text-muted ep-mt-0">Inscrições CRP/CRM cuja IA não teve confiança automática suficiente.</p>
        </div>
        <div class="ep-flex" style="gap: 6px;">
          <button class="ep-btn ep-btn--ghost ep-btn--sm" data-filter="pending-review">Em revisão</button>
          <button class="ep-btn ep-btn--ghost ep-btn--sm" data-filter="eligible">Aprovados</button>
          <button class="ep-btn ep-btn--ghost ep-btn--sm" data-filter="rejected">Rejeitados</button>
          <button class="ep-btn ep-btn--ghost ep-btn--sm" data-filter="all">Todos</button>
        </div>
      </div>

      <div id="list" class="ep-stack" style="gap: 12px;">
        <div class="ep-skeleton">Carregando…</div>
      </div>
    </section>

    <section id="forbiddenPanel" class="ep-hide" style="max-width: 460px; margin: 60px auto; text-align: center;">
      <div class="ep-auth__panel">
        <h2 class="ep-auth__title">Acesso negado.</h2>
        <p class="ep-auth__sub">Sua conta não está na allowlist de admin.</p>
        <button class="ep-btn ep-btn--ghost ep-btn--block ep-mt-16" type="button" id="forbiddenLogout">Sair</button>
      </div>
    </section>

  </main>
</div>

<div class="ep-modal" id="detailModal" role="dialog" aria-modal="true">
  <div class="ep-modal__panel" style="max-width: 920px;">
    <h3 class="ep-modal__title" id="modalTitle">Comprovante</h3>
    <div id="modalBody"></div>
    <div class="ep-modal__actions">
      <button type="button" class="ep-btn ep-btn--ghost" id="closeModal">Fechar</button>
      <button type="button" class="ep-btn ep-btn--ghost" id="rejectBtn" style="color: #b8453d; border-color: rgba(184,69,61,0.3);">Rejeitar</button>
      <button type="button" class="ep-btn ep-btn--primary" id="approveBtn">Aprovar</button>
    </div>
  </div>
</div>

<script type="module">
  import {
    onAuthStateChanged, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "./js/firebase-config.js";

  const loginPanel     = document.getElementById("loginPanel");
  const dashboardPanel = document.getElementById("dashboardPanel");
  const forbiddenPanel = document.getElementById("forbiddenPanel");
  const adminEmailEl   = document.getElementById("adminEmail");
  const listEl         = document.getElementById("list");

  let idToken = null;
  let currentFilter = "pending-review";

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    }[c]));
  }
  function fmtDate(ms) {
    if (!ms) return "—";
    return new Date(ms).toLocaleString("pt-BR", {
      day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
    });
  }
  function fmtSize(bytes) {
    if (!bytes) return "—";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(2) + " MB";
  }
  function show(panel) {
    [loginPanel, dashboardPanel, forbiddenPanel].forEach(p => p.classList.add("ep-hide"));
    panel.classList.remove("ep-hide");
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email    = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const statusEl = document.getElementById("loginStatus");
    const loginBtn = document.getElementById("loginBtn");
    loginBtn.disabled = true;
    statusEl.textContent = "Autenticando…";
    try { await signInWithEmailAndPassword(auth, email, password); }
    catch (err) {
      statusEl.textContent = err?.message || "Erro de autenticação.";
      statusEl.className = "ep-status is-err";
      loginBtn.disabled = false;
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => { await signOut(auth); window.location.reload(); });
  document.getElementById("forbiddenLogout").addEventListener("click", async () => { await signOut(auth); window.location.reload(); });

  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(b => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      loadList();
    });
  });

  async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}), "Authorization": `Bearer ${idToken}` };
    if (opts.body) headers["Content-Type"] = "application/json";
    const res = await fetch(BACKEND_BASE_URL + path, { ...opts, headers });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw Object.assign(new Error(data?.error || ("HTTP_" + res.status)), { status: res.status });
    return data;
  }

  async function loadList() {
    listEl.innerHTML = `<div class="ep-skeleton">Carregando…</div>`;
    try {
      const data = await api(`/therapy/admin/comprovantes-recem-formado?status=${currentFilter}`);
      renderList(data.items || []);
    } catch (err) {
      if (err.status === 403) { show(forbiddenPanel); return; }
      listEl.innerHTML = `<div class="ep-error-state">Erro: ${escapeHtml(err.message)}</div>`;
    }
  }

  function renderList(items) {
    if (items.length === 0) {
      listEl.innerHTML = `<div class="ep-empty"><p class="ep-text-muted ep-mt-0">Nenhum comprovante neste filtro.</p></div>`;
      return;
    }
    listEl.innerHTML = "";
    for (const item of items) {
      const ext = item.recemFormadoDoc?.extracted || {};
      const conf = item.recemFormadoDoc?.confidence != null ? Math.round(item.recemFormadoDoc.confidence * 100) + "%" : "—";
      const card = document.createElement("article");
      card.className = "ep-admin-card";
      const meses = ext.monthsSinceInscricao;
      card.innerHTML = `
        <div>
          <div class="ep-admin-card__name">${escapeHtml(item.displayName || "(sem nome)")}</div>
          <div class="ep-admin-card__meta">
            ${ext.conselho ? escapeHtml(ext.conselho) : "?"} ${ext.registro ? "· " + escapeHtml(ext.registro) : ""}
            ${ext.regiao ? " (" + escapeHtml(ext.regiao) + ")" : ""}
            ${meses != null ? " · inscrito há " + meses + (meses === 1 ? " mês" : " meses") : ""}
            <br>
            Plano: <strong>${escapeHtml(item.plano || "?")}</strong>
            · IA: ${conf}
            · Enviado ${fmtDate(item.recemFormadoDoc?.lastUploadedAt)}
          </div>
        </div>
        <div class="ep-flex" style="gap: 8px; align-items: center;">
          <button class="ep-btn ep-btn--primary ep-btn--sm" type="button" data-uid="${escapeHtml(item.therapistUid)}">Abrir</button>
        </div>
      `;
      card.querySelector("[data-uid]").addEventListener("click", () => openDetail(item.therapistUid));
      listEl.appendChild(card);
    }
  }

  const modal       = document.getElementById("detailModal");
  const modalTitle  = document.getElementById("modalTitle");
  const modalBody   = document.getElementById("modalBody");
  const approveBtn  = document.getElementById("approveBtn");
  const rejectBtn   = document.getElementById("rejectBtn");
  document.getElementById("closeModal").addEventListener("click", () => modal.classList.remove("is-open"));

  let activeUid = null;

  async function openDetail(uid) {
    activeUid = uid;
    modal.classList.add("is-open");
    modalBody.innerHTML = `<div class="ep-skeleton">Carregando…</div>`;
    approveBtn.disabled = true;
    rejectBtn.disabled  = true;
    try {
      const { item } = await api(`/therapy/admin/comprovantes-recem-formado/${encodeURIComponent(uid)}`);
      const t = item.therapist || {};
      const ext = item.extracted || {};
      const dataUrl = `data:${item.mediaType};base64,${item.fileBase64}`;
      modalTitle.textContent = `Recém-formado · ${t.displayName || ""}`;

      const reasonsHtml = (item.reasons || []).map(r => `<li>${escapeHtml(r)}</li>`).join("");
      const conf = item.confidence != null ? Math.round(item.confidence * 100) + "%" : "—";
      const meses = ext.monthsSinceInscricao;

      modalBody.innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start;">
          <div>
            <div class="ep-text-sm ep-text-muted ep-mt-0"><strong>Profissional cadastrado</strong></div>
            <p style="margin: 4px 0;">${escapeHtml(t.displayName || "")}<br>
              <span class="ep-text-sm ep-text-muted">${escapeHtml(t.email || "")}</span><br>
              <span class="ep-text-sm ep-text-muted">${t.crp ? "CRP " + escapeHtml(t.crp) : ""} ${t.crm ? " · CRM " + escapeHtml(t.crm) : ""}</span>
            </p>

            <div class="ep-text-sm ep-text-muted ep-mt-16"><strong>Extraído pela IA · confiança ${conf}</strong></div>
            <p style="margin: 4px 0; font-size: 13.5px;">
              <strong>Nome:</strong> ${escapeHtml(ext.nome || "—")}<br>
              <strong>Conselho:</strong> ${escapeHtml(ext.conselho || "—")}<br>
              <strong>Registro:</strong> ${escapeHtml(ext.registro || "—")} ${ext.regiao ? "(" + escapeHtml(ext.regiao) + ")" : ""}<br>
              <strong>Data inscrição:</strong> ${escapeHtml(ext.dataInscricao || "—")} ${meses != null ? "(" + meses + (meses === 1 ? " mês" : " meses") + " atrás)" : ""} ${meses != null && meses <= 12 ? "✓ dentro" : "✗ fora"} da janela<br>
              <strong>Situação:</strong> ${escapeHtml(ext.situacao || "—")}<br>
              <strong>Tipo doc:</strong> ${escapeHtml(ext.tipoDocumento || "—")}<br>
              ${ext.observacoes ? `<strong>Obs IA:</strong> <em>${escapeHtml(ext.observacoes)}</em>` : ""}
            </p>

            ${reasonsHtml ? `<div class="ep-text-sm ep-text-muted ep-mt-16"><strong>Motivos:</strong><ul>${reasonsHtml}</ul></div>` : ""}

            <div class="ep-text-sm ep-text-muted ep-mt-16">
              <strong>Verificar publicamente:</strong>
              ${t.crp ? `<a href="https://cadastro.cfp.org.br/buscaPublica/" target="_blank" rel="noopener">CFP</a>` : ""}
              ${t.crm ? `<a href="https://portal.cfm.org.br/busca-medicos/" target="_blank" rel="noopener">CFM</a>` : ""}
            </div>

            <div class="ep-text-sm ep-text-muted ep-mt-12">
              <strong>Tamanho:</strong> ${fmtSize(item.fileSize)} · ${escapeHtml(item.mediaType)}<br>
              <strong>Hash:</strong> <code style="font-size: 11px;">${escapeHtml(item.fileHash || "").slice(0, 16)}…</code>
            </div>
          </div>
          <div>
            ${item.mediaType === "application/pdf"
              ? `<a class="ep-btn ep-btn--ghost ep-btn--block" href="${dataUrl}" target="_blank">Abrir PDF em nova aba ↗</a>`
              : `<img src="${dataUrl}" alt="Comprovante" style="max-width: 100%; max-height: 600px; border-radius: 10px; border: 1px solid rgba(28,31,29,0.10);">`
            }
          </div>
        </div>
      `;
      approveBtn.disabled = false;
      rejectBtn.disabled  = false;
    } catch (err) {
      modalBody.innerHTML = `<div class="ep-error-state">Erro: ${escapeHtml(err.message)}</div>`;
    }
  }

  approveBtn.addEventListener("click", async () => {
    if (!activeUid) return;
    if (!confirm("Aprovar inscrição como recém-formado? O profissional poderá contratar a R$ 99,50/mês.")) return;
    const notes = prompt("Notas internas (opcional):", "") || "";
    approveBtn.disabled = true;
    try {
      await api(`/therapy/admin/comprovantes-recem-formado/${encodeURIComponent(activeUid)}/aprovar`, {
        method: "POST",
        body: JSON.stringify({ notes })
      });
      modal.classList.remove("is-open");
      await loadList();
    } catch (err) {
      alert("Erro ao aprovar: " + err.message);
      approveBtn.disabled = false;
    }
  });

  rejectBtn.addEventListener("click", async () => {
    if (!activeUid) return;
    const reason = prompt("Motivo da recusa:", "");
    if (reason == null) return;
    const trimmed = reason.trim();
    if (!trimmed) { alert("Informe um motivo."); return; }
    rejectBtn.disabled = true;
    try {
      await api(`/therapy/admin/comprovantes-recem-formado/${encodeURIComponent(activeUid)}/rejeitar`, {
        method: "POST",
        body: JSON.stringify({ reason: trimmed })
      });
      modal.classList.remove("is-open");
      await loadList();
    } catch (err) {
      alert("Erro ao rejeitar: " + err.message);
      rejectBtn.disabled = false;
    }
  });

  onAuthStateChanged(auth, async (user) => {
    if (!user) { show(loginPanel); adminEmailEl.textContent = ""; return; }
    try {
      idToken = await user.getIdToken();
      adminEmailEl.textContent = user.email || "";
      const res = await fetch(`${BACKEND_BASE_URL}/therapy/admin/comprovantes-recem-formado?status=pending-review`, {
        headers: { "Authorization": `Bearer ${idToken}` }
      });
      if (res.status === 403 || res.status === 503) { show(forbiddenPanel); return; }
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        forbiddenPanel.querySelector(".ep-auth__sub").textContent = "Erro: " + (j.error || res.status);
        show(forbiddenPanel);
        return;
      }
      const data = await res.json();
      show(dashboardPanel);
      document.querySelector('[data-filter="pending-review"]').classList.add("is-active");
      renderList(data.items || []);
    } catch (err) {
      forbiddenPanel.querySelector(".ep-auth__sub").textContent = "Erro: " + err.message;
      show(forbiddenPanel);
    }
  });
</script>

</body>
</html>
