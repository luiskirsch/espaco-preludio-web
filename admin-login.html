<!DOCTYPE html>
<html lang="pt-BR" data-i18n-ns="p-admin-login">
<head>
<script>(function(){if(window.top!==window.self){try{window.top.location.replace(location.href);}catch(_){document.documentElement.innerHTML="";}return;}var h=(location.hostname||"").toLowerCase(),p=location.protocol||"";var A=["espacopreludio.com","www.espacopreludio.com","espacopreludio.com.br","www.espacopreludio.com.br","localhost","127.0.0.1"];if(p==="file:"||h&&A.indexOf(h)===-1){document.documentElement.innerHTML="<style>*{margin:0;padding:0}html,body{background:#0d1117;height:100%;display:flex;align-items:center;justify-content:center}p{color:#ccc;font:15px/1.7 sans-serif;text-align:center;max-width:320px}a{color:#5b8af5;text-decoration:none}</style><p>Este conte\u00fado s\u00f3 est\u00e1 dispon\u00edvel no site oficial.<br><a href=\"https://espacopreludio.com.br\">espacopreludio.com.br<\/a><\/p>";setTimeout(function(){location.replace("https://espacopreludio.com.br");},2500);}else{document.documentElement.classList.add("guard-ok");}})();</script><style>html:not(.guard-ok) body{visibility:hidden!important;background:#0d1117!important}</style>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="p-admin-login:login_admin_espaco_preludio_fee94">Login Admin · Espaço Prelúdio</title>
  <link rel="icon" type="image/png" href="/logo_oficial_fundo_transparente.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/espaco-preludio.css?v=3-277">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--ep-bg); }
    .admin-card { width: 100%; max-width: 400px; }
    .admin-brand { display: flex; align-items: center; gap: 14px; justify-content: center; margin-bottom: 40px; }
    .admin-brand__logo { width: 44px; height: 44px; border-radius: 50%; background: #0f0c09; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .admin-brand__logo img { width: 28px; height: 28px; filter: invert(1); opacity: 0.9; }
    .admin-brand__text { line-height: 1.2; }
    .admin-brand__name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; color: var(--ep-ink); }
    .admin-brand__tag { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; color: var(--ep-ink-3); text-transform: uppercase; }
    .admin-divider { height: 1px; background: linear-gradient(to right, transparent, rgba(215,176,107,0.4), transparent); margin: 0 0 28px 0; }
    .admin-footer { text-align: center; font-size: 12px; color: var(--ep-ink-3); margin-top: 20px; }
    .admin-footer a { color: var(--ep-gold); text-decoration: none; }
    .admin-footer a:hover { text-decoration: underline; }
  </style>
  <script>(function(){try{var l=null;try{l=new URLSearchParams(location.search).get("lang");}catch(_){}if(!l)l=localStorage.getItem("ep_lang");if(!l){var n=(navigator.language||"").toLowerCase();if(n.indexOf("en")===0)l="en-US";else if(n.indexOf("es")===0)l="es-ES";}if(l==="en-US"||l==="es-ES")document.documentElement.classList.add("ep-i18n-pending");}catch(e){}})();</script>
  <style>html.ep-i18n-pending body{visibility:hidden}</style>
  <script src="/i18n/init.js?v=2-3" defer></script>
</head>
<body>

<div class="admin-card">

  <!-- Brand -->
  <div class="admin-brand">
    <div class="admin-brand__logo">
      <img src="./logo_oficial_fundo_transparente.png" alt="EP">
    </div>
    <div class="admin-brand__text">
      <div class="admin-brand__name">Espaço Prelúdio</div>
      <div class="admin-brand__tag" data-i18n="p-admin-login:painel_admin_c68af">Painel Admin</div>
    </div>
  </div>

  <!-- Card -->
  <div class="ep-auth__panel" style="padding: 32px 36px;">
    <h1 style="font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ep-ink);margin:0 0 4px 0;text-align:center;" data-i18n="p-admin-login:acesso_restrito_ec12f">Acesso restrito</h1>
    <p style="font-size:13px;color:var(--ep-ink-3);text-align:center;margin:0 0 24px 0;" data-i18n="p-admin-login:somente_e_mails_autorizados_tem_24b38">Somente e-mails autorizados têm acesso ao painel.</p>

    <div class="admin-divider"></div>

    <form id="loginForm" novalidate>
      <div class="ep-field">
        <label class="ep-label" for="adminEmail">E-mail</label>
        <input id="adminEmail" class="ep-input" type="email" autocomplete="email" placeholder="contato@espacopreludio.com.br" required>
      </div>
      <div class="ep-field" style="margin-top: 14px;">
        <label class="ep-label" for="adminPassword" data-i18n="p-admin-login:senha_deba0">Senha</label>
        <input id="adminPassword" class="ep-input" type="password" autocomplete="current-password" placeholder="••••••••••" required>
      </div>

      <div id="loginStatus" class="ep-status" style="margin-top: 14px; min-height: 20px;"></div>

      <button type="submit" id="loginBtn" class="ep-btn ep-btn--primary ep-btn--lg ep-btn--block" style="margin-top: 20px;" data-i18n="p-admin-login:entrar_7573b">
        Entrar
      </button>

      <p style="text-align:center;margin-top:14px;margin-bottom:0;">
        <button type="button" id="forgotBtn" style="background:none;border:none;padding:0;font:inherit;font-size:13px;color:var(--ep-ink-3);cursor:pointer;text-decoration:underline;">
          Esqueci minha senha
        </button>
      </p>
    </form>
  </div>

  <p class="admin-footer">
    <span data-i18n="p-admin-login:nao_e_admin_7cccc">Não é admin?</span> <a href="./login.html" data-i18n="p-admin-login:acesso_profissional_6801e">Acesso profissional →</a>
    &nbsp;·&nbsp;
    <button id="sairBtn" type="button" style="background:none;border:none;padding:0;font:inherit;font-size:12px;color:var(--ep-ink-3);cursor:pointer;text-decoration:underline;" data-i18n="p-admin-login:sair_da_conta_atual_68f19">Sair da conta atual</button>
  </p>

</div>

<script type="module">
  import {
    onAuthStateChanged, signInWithEmailAndPassword, signOut,
    sendPasswordResetEmail, browserSessionPersistence, setPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth } from "./js/firebase-config.js";

  const dest      = new URLSearchParams(location.search).get("from") || "./admin-painel.html";
  const emailEl   = document.getElementById("adminEmail");
  const passEl    = document.getElementById("adminPassword");
  const statusEl  = document.getElementById("loginStatus");
  const loginBtn  = document.getElementById("loginBtn");
  const loginForm = document.getElementById("loginForm");
  const sairBtn   = document.getElementById("sairBtn");

  // Already authenticated? Go directly
  onAuthStateChanged(auth, user => {
    if (user) window.location.replace(dest);
  });

  loginForm.addEventListener("submit", async e => {
    e.preventDefault();
    loginBtn.disabled = true;
    statusEl.textContent = "Autenticando…";
    statusEl.className = "ep-status";

    try {
      // Sessão vive apenas na aba atual — fecha a aba, perde a sessão
      await setPersistence(auth, browserSessionPersistence);
      await signInWithEmailAndPassword(auth, emailEl.value.trim().toLowerCase(), passEl.value);
    } catch (err) {
      const code = err?.code || "";
      const msg =
        (code === "auth/invalid-credential" || code === "auth/user-not-found" || code === "auth/wrong-password")
          ? "E-mail ou senha incorretos." :
        code === "auth/too-many-requests"
          ? "Muitas tentativas. Aguarde alguns minutos." :
        code === "auth/network-request-failed"
          ? "Sem conexão. Verifique sua internet." :
          "Erro ao autenticar. Tente novamente.";
      statusEl.textContent = msg;
      statusEl.className = "ep-status is-err";
      loginBtn.disabled = false;
    }
  });

  sairBtn.addEventListener("click", async () => {
    await signOut(auth);
    sairBtn.textContent = "Saído.";
  });

  document.getElementById("forgotBtn").addEventListener("click", async () => {
    const email = emailEl.value.trim().toLowerCase();
    if (!email) {
      statusEl.textContent = "Digite o e-mail acima antes de redefinir a senha.";
      statusEl.className = "ep-status is-err";
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      statusEl.textContent = "E-mail de redefinição enviado! Verifique sua caixa de entrada.";
      statusEl.className = "ep-status";
    } catch (err) {
      statusEl.textContent = "Não foi possível enviar o e-mail. Verifique o endereço digitado.";
      statusEl.className = "ep-status is-err";
    }
  });
</script>

</body>
</html>
