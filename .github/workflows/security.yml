name: Portal security and integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # A primeira abertura do Chrome no runner monta caches de fontes e perfil
      # e passava dos 12 s, derrubando o primeiro teste de navegador da suíte.
      - name: Aquecer o Chrome
        run: google-chrome --headless=new --disable-gpu --no-first-run --dump-dom about:blank > /dev/null
      - run: npm run check
      - run: npm audit --audit-level=high
