<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{width:540px;height:960px;overflow:hidden}
body{font-family:Inter,sans-serif;background:#041f22;color:#fff}
.f{position:relative;width:540px;height:960px;overflow:hidden;background:radial-gradient(ellipse 80% 45% at 50% 62%,rgba(214,170,74,.25),transparent 70%),radial-gradient(ellipse 70% 40% at 0% 0%,rgba(30,110,110,.4),transparent 70%),linear-gradient(170deg,#063237,#052a2e 50%,#031a1c)}
.f:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:18px 18px}
.ring{position:absolute;left:50%;top:640px;border:1px solid rgba(241,216,142,.16);border-radius:50%;transform:translate(-50%,-50%)}
.hd{position:relative;z-index:3;text-align:center;padding:54px 36px 0}
.eb{display:inline-flex;align-items:center;gap:10px;color:#e9cf87;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.eb:before,.eb:after{content:"";width:22px;height:1px;background:#e9cf87;opacity:.7}
h1{font-family:Fraunces,serif;font-weight:500;font-size:40px;line-height:1.06;letter-spacing:-1.2px;margin:14px 0 12px}
h1 em{font-style:italic;color:#f1d88e}
.sub{font-size:15px;line-height:1.45;color:rgba(255,255,255,.7)}
.ph{position:absolute;z-index:2;left:50%;top:290px;width:356px;height:740px;margin-left:-178px;border-radius:54px;padding:11px;background:linear-gradient(145deg,#4a4a4c,#0b0b0c 35%,#232325);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 40px 80px rgba(0,0,0,.6),0 0 140px rgba(214,170,74,.2)}
.isl{position:absolute;top:24px;left:50%;width:96px;height:28px;margin-left:-48px;background:#000;border-radius:20px;z-index:9}
.sc{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#f5f0e8;color:#1c1f1d}
.sb{height:50px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:13px;font-weight:600}
.sb i{font-style:normal;letter-spacing:1px;font-size:11px}
.ah{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border-bottom:1px solid rgba(28,31,29,.08)}
.bk{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.07);display:grid;place-items:center;font-size:16px}
.ah b{font-family:Fraunces,serif;font-weight:500;font-size:18px}
.pad{padding:14px 16px}
.srch{background:#fff;border-radius:14px;padding:12px 14px;font-size:13px;color:#9a9992;box-shadow:0 2px 12px rgba(0,0,0,.05);display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:7px;margin:12px 0 4px;white-space:nowrap}
.chip{padding:7px 13px;border-radius:999px;font-size:12px;background:#fff;border:1px solid rgba(28,31,29,.1);color:#5a5a56}.chip.on{background:#1c1a16;color:#fff;border-color:#1c1a16}
.pro{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px;margin-top:10px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:Fraunces,serif;font-size:17px;color:#fff;position:relative}
.av.on:after{content:"";position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:#3bb273;border:2px solid #fff}
.pro .t{flex:1;min-width:0}.pro b{display:block;font-size:14px;font-weight:600}.pro i{display:block;font-style:normal;font-size:11.5px;color:#5a5a56;margin-top:2px}.pro s{display:block;text-decoration:none;font-size:11px;color:#9a9992;margin-top:3px}
.vf{display:inline-block;width:14px;height:14px;border-radius:50%;background:#2f80ed;color:#fff;font-size:9px;text-align:center;line-height:14px;margin-left:4px;vertical-align:1px}
.tag{font-size:10.5px;font-weight:700;color:#2d6a3e;background:#e4efe6;padding:5px 8px;border-radius:8px;white-space:nowrap}
.nav{position:absolute;left:0;right:0;bottom:0;height:74px;background:#1c1a16;display:flex;padding-bottom:12px}
.nav div{flex:1;display:grid;place-items:center;align-content:center;gap:3px;font-size:10.5px;color:rgba(255,255,255,.55)}.nav div span{font-size:18px}.nav .on{color:#e9cf87}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 14px rgba(0,0,0,.06);margin-top:12px}
.lbl{font-size:10.5px;letter-spacing:1.4px;font-weight:600;color:#9a9992;text-transform:uppercase}
.btn{background:#1c1a16;color:#fff;text-align:center;border-radius:14px;padding:14px;font-size:14px;font-weight:600}
.gold{background:#e9cf87;color:#1c1a16}
</style></head><body>
<div class="f" id="f"></div>
<script>
const ICON='../app-icon.png';
const S={
1:{eb:'Espaço Prelúdio',h:'Cuidado que cabe<br>na <em>sua rotina.</em>',s:'Psicologia online para pacientes,<br>alunos e colaboradores.',scr:`
<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(214,170,74,.22),transparent 45%),#0d0b09;color:#fff;display:grid;place-items:center;text-align:center">
<div style="position:absolute;width:420px;height:420px;border-radius:50%;background:#171410;top:-160px;left:-20px"></div>
<div style="position:absolute;width:300px;height:300px;border-radius:50%;background:#14110e;bottom:-120px;right:-90px"></div>
<div style="position:relative"><img src="${ICON}" style="width:92px;height:92px;border-radius:50%;box-shadow:0 0 0 1px rgba(241,216,142,.3),0 0 60px rgba(241,216,142,.35)">
<div style="margin-top:22px;font-size:10px;letter-spacing:5px;color:#e9cf87">ESPAÇO</div>
<div style="font-family:Fraunces,serif;font-size:36px;margin-top:4px">Prelúdio</div>
<div style="width:30px;height:1px;background:#e9cf87;margin:14px auto;opacity:.6"></div>
<div style="font-size:12.5px;color:rgba(255,255,255,.6)">Saúde mental ao seu alcance</div>
<div style="display:flex;gap:8px;justify-content:center;margin-top:40px">${['Pacientes','Alunos','Colaboradores'].map(x=>`<span style="font-size:11px;padding:7px 12px;border:1px solid rgba(241,216,142,.35);border-radius:999px;color:#f6e7bd">${x}</span>`).join('')}</div>
</div></div>`},
2:{eb:'Encontre',h:'O psicólogo certo<br><em>para você.</em>',s:'Profissionais verificados, filtrados por<br>especialidade, abordagem e cidade.',scr:`
<div class="ah"><div class="bk">←</div><b>Buscar profissional</b></div>
<div class="pad"><div class="srch">🔍 Nome, especialidade, cidade…</div>
<div class="chips"><span class="chip">Todos</span><span class="chip on">Psicologia</span><span class="chip">TCC</span><span class="chip">Psiquiatria</span><span class="chip">Casal</span></div>
${[['Marina Costa','Psicologia Clínica · TCC','Curitiba/PR','MC','#2d6a3e,#173d24','Hoje'],['Rafael Lima','Ansiedade · Adultos','Porto Alegre/RS','RL','#c8963a,#8a6020','Hoje'],['Júlia Rocha','Adolescentes · Família','São Paulo/SP','JR','#8a5a4a,#5a3428','Amanhã'],['Beatriz Nunes','Psicanálise','Belo Horizonte/MG','BN','#3c6e8f,#1f4560','Qui'],['Tiago Moreira','Luto · Depressão','Florianópolis/SC','TM','#6b5b95,#41366a','Sex']].map((p,i)=>`<div class="pro"><div class="av ${i<2?'on':''}" style="background:linear-gradient(135deg,${p[4]})">${p[3]}</div><div class="t"><b>${p[0]}<span class="vf">✓</span></b><i>${p[1]}</i><s>📍 ${p[2]}</s></div><span class="tag">${p[5]}</span></div>`).join('')}
</div>`},
3:{eb:'Agende',h:'Sua sessão em<br><em>poucos toques.</em>',s:'Escolha o dia e o horário que<br>encaixam na sua semana.',scr:`
<div class="ah"><div class="bk">←</div><b>Agendar sessão</b></div>
<div class="pad">
<div class="pro" style="margin-top:0"><div class="av on" style="background:linear-gradient(135deg,#2d6a3e,#173d24)">MC</div><div class="t"><b>Marina Costa<span class="vf">✓</span></b><i>Psicóloga · Psicologia Clínica</i><s>⭐ 4,9 · 120 sessões</s></div></div>
<div class="card"><div class="lbl">Outubro 2026</div>
<div style="display:flex;justify-content:space-between;margin-top:12px">${[['Seg',12],['Ter',13],['Qua',14],['Qui',15],['Sex',16]].map((d,i)=>`<div style="width:50px;text-align:center;padding:10px 0;border-radius:12px;${i==3?'background:#1c1a16;color:#fff':'background:#f5f0e8'}"><div style="font-size:10.5px;opacity:.7">${d[0]}</div><div style="font-size:18px;font-weight:600;margin-top:2px">${d[1]}</div></div>`).join('')}</div></div>
<div class="card"><div class="lbl">Horários disponíveis</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">${['08:00','09:00','11:00','14:00','17:00','19:00'].map(h=>`<div style="text-align:center;padding:11px 0;border-radius:11px;font-size:13.5px;font-weight:600;${h=='19:00'?'background:#e4efe6;color:#2d6a3e;box-shadow:inset 0 0 0 1.5px #2d6a3e':'border:1px solid rgba(28,31,29,.12)'}">${h}</div>`).join('')}</div></div>
<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="lbl">Resumo</div><div style="font-size:14px;font-weight:600;margin-top:4px">Qui, 15 out · 19:00</div><div style="font-size:11.5px;color:#5a5a56">Videochamada · 50 min</div></div><div style="font-family:Fraunces,serif;font-size:20px">R$ 120</div></div>
<div class="btn" style="margin-top:14px">Confirmar agendamento</div>
</div>`},
4:{eb:'Videochamada',h:'Sessão por vídeo,<br><em>protegida.</em>',s:'Criptografia ponta a ponta. Ninguém<br>além de vocês dois tem acesso.',scr:`
<div style="position:absolute;inset:0;background:#0b0b0b">
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#3a4a46,#151a19 70%)"></div>
<div style="position:absolute;left:50%;top:170px;transform:translateX(-50%);text-align:center;color:#fff"><div class="av" style="width:120px;height:120px;font-size:44px;background:linear-gradient(135deg,#2d6a3e,#173d24);margin:0 auto;box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 0 14px rgba(255,255,255,.03)">MC</div><div style="font-family:Fraunces,serif;font-size:22px;margin-top:18px">Marina Costa</div><div style="font-size:12px;opacity:.6;margin-top:4px">Psicóloga</div></div>
<div style="position:absolute;top:62px;left:16px;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.45);color:#fff;padding:7px 11px;border-radius:999px;font-size:11.5px"><span style="width:7px;height:7px;border-radius:50%;background:#e05555"></span>32:14</div>
<div style="position:absolute;top:62px;right:16px;display:flex;gap:6px;align-items:center;background:rgba(59,178,115,.2);color:#9fe0bc;padding:7px 11px;border-radius:999px;font-size:11px;font-weight:600">🔒 Ponta a ponta</div>
<div style="position:absolute;right:16px;bottom:200px;width:96px;height:140px;border-radius:16px;background:linear-gradient(160deg,#6b5a48,#2c2520);border:2px solid rgba(255,255,255,.15);display:grid;place-items:center"><div class="av" style="width:46px;height:46px;background:linear-gradient(135deg,#c8963a,#8a6020)">A</div></div>
<div style="position:absolute;left:0;right:0;bottom:110px;display:flex;justify-content:center;gap:14px">${['🎙️','📷','💬'].map(x=>`<div style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px">${x}</div>`).join('')}<div style="width:54px;height:54px;border-radius:50%;background:#e05555;display:grid;place-items:center;font-size:20px;color:#fff">✕</div></div>
</div>`},
5:{eb:'Acompanhe',h:'Como você se sente,<br><em>dia após dia.</em>',s:'Registre seu humor e leve a evolução<br>para a sua sessão.',scr:`
<div class="ah"><div class="bk">←</div><b>Meu humor</b></div>
<div class="pad">
<div style="background:linear-gradient(140deg,#2a241c,#14110d);color:#fff;border-radius:18px;padding:22px;text-align:center"><div style="font-size:46px">🙂</div><div style="font-family:Fraunces,serif;font-size:22px;margin-top:6px">Bem</div><div style="font-size:11.5px;opacity:.6;margin-top:2px">Seg, 12 de out</div></div>
<div class="card"><div class="lbl">✓ Registrado hoje</div><div style="display:flex;gap:6px;margin-top:10px">${[['😄','Ótimo'],['🙂','Bem'],['😐','Ok'],['😪','Cansado'],['😔','Mal']].map((m,i)=>`<div style="flex:1;text-align:center;padding:9px 0;border-radius:11px;${i==1?'background:#fdf3dd;box-shadow:inset 0 0 0 1.5px #c8963a':'background:#f5f0e8'}"><div style="font-size:20px">${m[0]}</div><div style="font-size:9.5px;color:#5a5a56;margin-top:2px">${m[1]}</div></div>`).join('')}</div></div>
<div class="card"><div class="lbl">Últimos 7 dias</div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;height:120px;margin-top:12px">${[[46,'Ter'],[38,'Qua'],[62,'Qui'],[78,'Sex'],[90,'Sáb'],[70,'Dom'],[82,'Seg']].map((b,i)=>`<div style="text-align:center;width:32px"><div style="height:${b[0]}px;border-radius:9px;background:${i==6?'linear-gradient(#e9cf87,#c8963a)':'linear-gradient(#4a9e66,#2d6a3e)'}"></div><div style="font-size:10px;color:#9a9992;margin-top:6px">${b[1]}</div></div>`).join('')}</div></div>
<div class="card" style="display:flex;gap:10px;align-items:center"><div style="font-size:22px">📈</div><div style="font-size:12.5px;color:#5a5a56;line-height:1.4"><b style="color:#1c1f1d">Semana em alta.</b> Seu humor está melhor que na semana passada.</div></div>
</div>`},
6:{eb:'Escolas e empresas',h:'Para alunos e<br><em>colaboradores.</em>',s:'Benefício da sua escola ou empresa,<br>com sigilo total.',scr:`
<div class="pad" style="padding-top:8px">
<div style="font-size:12.5px;color:#9a9992">Bom dia,</div><div style="font-family:Fraunces,serif;font-size:26px;font-weight:500">Camila</div>
<div style="margin-top:14px;border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,#0b4a50,#062f33);position:relative;overflow:hidden"><div style="position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(rgba(241,216,142,.4),transparent 70%)"></div><div class="lbl" style="color:#e9cf87">Benefício ativo</div><div style="font-size:17px;font-weight:600;margin-top:6px">Grupo Horizonte</div><div style="font-size:12px;opacity:.75;margin-top:2px">4 sessões por mês · incluídas</div><div style="height:6px;border-radius:6px;background:rgba(255,255,255,.15);margin-top:14px"><div style="width:25%;height:100%;border-radius:6px;background:#e9cf87"></div></div><div style="font-size:11px;opacity:.7;margin-top:6px">1 de 4 usadas em outubro</div></div>
<div class="card"><div class="lbl">Próxima sessão</div><div style="display:flex;gap:12px;align-items:center;margin-top:10px"><div class="av on" style="background:linear-gradient(135deg,#8a5a4a,#5a3428)">JR</div><div style="flex:1"><b style="font-size:14px">Júlia Rocha</b><div style="font-size:11.5px;color:#5a5a56">Qua, 14 out · 18:30</div></div></div><div class="btn gold" style="margin-top:12px;padding:11px;font-size:13px">Entrar na sala</div></div>
<div class="card"><div class="lbl">Jornada de bem-estar</div><div style="font-size:14px;font-weight:600;margin-top:6px">Conversas difíceis no trabalho</div><div style="display:flex;gap:5px;margin-top:10px">${[1,1,1,0,0].map(x=>`<div style="flex:1;height:6px;border-radius:6px;background:${x?'#2d6a3e':'#ede8de'}"></div>`).join('')}</div><div style="font-size:11px;color:#9a9992;margin-top:6px">3 de 5 etapas</div></div>
<div class="card" style="display:flex;gap:10px;align-items:center;margin-top:12px"><div style="font-size:20px">🔒</div><div style="font-size:12px;color:#5a5a56;line-height:1.4">Sua empresa <b style="color:#1c1f1d">não vê</b> o conteúdo das suas sessões.</div></div>
</div>
<div class="nav"><div class="on"><span>⌂</span>Início</div><div><span>💬</span>Chat</div><div><span>📅</span>Consultas</div><div><span>👤</span>Perfil</div></div>`}
};
const n=+location.hash.slice(1)||1,d=S[n];
document.getElementById('f').innerHTML=`<div class="ring" style="width:520px;height:520px"></div><div class="ring" style="width:780px;height:780px"></div>
<div class="hd"><div class="eb">${d.eb}</div><h1>${d.h}</h1><div class="sub">${d.s}</div></div>
<div class="ph"><div class="isl"></div><div class="sc">${n==1||n==4?'':'<div class="sb"><span>9:41</span><i>●●● ▮</i></div>'}${d.scr}</div></div>`;
</script></body></html>
