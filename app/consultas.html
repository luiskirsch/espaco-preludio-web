<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){if(window.top!==window.self){try{window.top.location.replace(location.href);}catch(_){document.documentElement.innerHTML="";}return;}var h=(location.hostname||"").toLowerCase(),p=location.protocol||"";var A=["espacopreludio.com","www.espacopreludio.com","espacopreludio.com.br","www.espacopreludio.com.br","localhost","127.0.0.1"];if(p==="file:"||h&&A.indexOf(h)===-1){document.documentElement.innerHTML="<style>*{margin:0;padding:0}html,body{background:#0d1117;height:100%;display:flex;align-items:center;justify-content:center}p{color:#ccc;font:15px/1.7 sans-serif;text-align:center;max-width:320px}a{color:#5b8af5;text-decoration:none}</style><p>Este conte\u00fado s\u00f3 est\u00e1 dispon\u00edvel no site oficial.<br><a href=\"https://espacopreludio.com.br\">espacopreludio.com.br<\/a><\/p>";setTimeout(function(){location.replace("https://espacopreludio.com.br");},2500);}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Consultas · Espaço Prelúdio</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="/logo_oficial_fundo_transparente.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
  <style>
    .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--a-line); padding: 0 16px; }
    .tab-btn {
      flex: 1; height: 48px; border: none; background: none;
      font-family: var(--ff-sans); font-size: 14px; font-weight: 600;
      color: var(--a-ink3); cursor: pointer; position: relative;
      transition: color 150ms;
    }
    .tab-btn.is-active { color: var(--a-ink); }
    .tab-btn.is-active::after {
      content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 2px; background: var(--a-ink); border-radius: 2px 2px 0 0;
    }
    .sessions-list { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
    .sess-card { background: var(--a-surface); border-radius: var(--a-radius); box-shadow: var(--a-shadow); overflow: hidden; }
    .sess-card__bar { height: 4px; }
    .sess-card__bar--scheduled { background: var(--a-accent); }
    .sess-card__bar--completed { background: #888; }
    .sess-card__bar--canceled  { background: #e88; }
    .sess-card__bar--pending   { background: var(--a-gold); }
    .sess-card__body { padding: 14px 16px; }
    .sess-card__header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .sess-card__prof { font-size: 15px; font-weight: 600; color: var(--a-ink); }
    .sess-card__esp  { font-size: 12px; color: var(--a-ink2); margin-top: 2px; }
    .sess-card__time { font-family: var(--ff-mono); font-size: 12px; font-weight: 600; color: var(--a-accent); margin-top: 8px; }
    .sess-card__actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--a-line); }
    .countdown { font-size: 11px; color: var(--a-ink3); margin-top: 4px; }
  </style>
  <script src="./sw-register.js" defer></script>
</head>
<body>
<div class="a-shell">

  <div class="a-header">
    <div class="a-header__title" style="margin-left: 0;">Minhas consultas</div>
  </div>

  <div class="a-page a-page-enter">

    <div class="tabs">
      <button class="tab-btn is-active" id="tabProx" onclick="showTab('prox')">Próximas</button>
      <button class="tab-btn" id="tabHist" onclick="showTab('hist')">Histórico</button>
      <button class="tab-btn" id="tabPend" onclick="showTab('pend')">Pendentes</button>
    </div>

    <div id="loadingSkel" class="sessions-list">
      <div class="a-skel" style="height:110px;border-radius:16px;"></div>
      <div class="a-skel" style="height:110px;border-radius:16px;"></div>
      <div class="a-skel" style="height:110px;border-radius:16px;"></div>
    </div>

    <div id="tabProxContent" class="sessions-list a-hide"></div>
    <div id="tabHistContent" class="sessions-list a-hide"></div>
    <div id="tabPendContent" class="sessions-list a-hide"></div>

    <div id="emptyState" class="a-empty a-hide">
      <div class="a-empty__icon">📅</div>
      <div class="a-empty__title">Nada aqui</div>
      <div class="a-empty__sub" id="emptyMsg">Você não tem consultas nesta categoria.</div>
      <a href="./buscar.html" class="a-btn a-btn--accent a-mt-8">Buscar profissional</a>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="a-nav">
    <a href="./home.html" class="a-nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Início</span>
    </a>
    <a href="./buscar.html" class="a-nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Buscar</span>
    </a>
    <a href="./consultas.html" class="a-nav__item is-active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Consultas</span>
      <span class="a-nav__dot"></span>
    </a>
    <a href="./perfil.html" class="a-nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Perfil</span>
    </a>
  </nav>
</div>

<!-- Modal: cancelar -->
<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;place-items:center;" id="cancelModal">
  <div style="background:var(--a-surface);border-radius:20px;padding:24px;margin:16px;max-width:380px;width:100%;">
    <h3 style="font-family:var(--ff-serif);font-size:20px;margin:0 0 8px;">Cancelar consulta?</h3>
    <p style="font-size:13px;color:var(--a-ink2);line-height:1.5;margin:0 0 20px;">O registro da consulta será mantido. Você pode reagendar a qualquer momento.</p>
    <div style="display:flex;gap:10px;">
      <button class="a-btn a-btn--ghost" style="flex:1;" onclick="document.getElementById('cancelModal').style.display='none'">Voltar</button>
      <button class="a-btn a-btn--primary" style="flex:1;background:#b8453d;" id="confirmCancelBtn">Cancelar</button>
    </div>
  </div>
</div>

<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "../js/firebase-config.js";

  let allSessions = [];
  let cancellingId = null;

  const STATUS_LABEL = { scheduled:"Confirmada", completed:"Realizada", canceled:"Cancelada", in_progress:"Em andamento", pending:"Aguardando" };
  const STATUS_BADGE = { scheduled:"a-badge--ok", completed:"a-badge--pend", canceled:"a-badge--err", in_progress:"a-badge--ok", pending:"a-badge--warn" };
  const STATUS_BAR   = { scheduled:"scheduled", completed:"completed", canceled:"canceled", in_progress:"scheduled", pending:"pending" };

  function esc(s) { return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function fmtDt(ms) {
    const d = new Date(Number(ms));
    const weekday = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()];
    const months  = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    return `${weekday}, ${d.getDate()} de ${months[d.getMonth()]} · ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }

  function countdown(ms) {
    const diff = Number(ms) - Date.now();
    if (diff < 0) return "";
    const h = Math.floor(diff / 3600000);
    const d = Math.floor(h / 24);
    if (d > 0) return `em ${d} dia${d>1?"s":""}`;
    if (h > 0) return `em ${h}h`;
    return "em breve";
  }

  function renderCard(s) {
    const bar = STATUS_BAR[s.status] || "pending";
    const badge = STATUS_BADGE[s.status] || "a-badge--pend";
    const label = STATUS_LABEL[s.status] || s.status;
    const isUpcoming = s.status === "scheduled" && Number(s.scheduledAt) > Date.now();
    const cd = isUpcoming ? countdown(s.scheduledAt) : "";
    return `
      <div class="sess-card">
        <div class="sess-card__bar sess-card__bar--${bar}"></div>
        <div class="sess-card__body">
          <div class="sess-card__header">
            <div>
              <div class="sess-card__prof">${esc(s.therapistName||"Profissional")}</div>
              <div class="sess-card__esp">${esc(s.especialidade||"")}</div>
            </div>
            <span class="a-badge ${badge}" style="flex-shrink:0;">${esc(label)}</span>
          </div>
          <div class="sess-card__time">${fmtDt(s.scheduledAt)}</div>
          ${cd ? `<div class="countdown">⏰ ${cd}</div>` : ""}
          ${isUpcoming ? `
          <div class="sess-card__actions">
            <a href="./agendar.html?p=${encodeURIComponent(s.therapistSlug||"")}" class="a-btn a-btn--ghost a-btn--sm" style="flex:1;">Reagendar</a>
            <button class="a-btn a-btn--sm" style="flex:1;background:rgba(184,69,61,.1);color:#b8453d;border:none;" onclick="openCancel('${esc(s.sessionId||s.id||"")}')">Cancelar</button>
          </div>` : ""}
          ${s.status === "completed" ? `
          <div class="sess-card__actions">
            <a href="./documentos.html" class="a-btn a-btn--ghost a-btn--sm" style="flex:1;">Ver documentos</a>
            <a href="./buscar.html?p=${encodeURIComponent(s.therapistSlug||"")}" class="a-btn a-btn--ghost a-btn--sm" style="flex:1;">Repetir consulta</a>
          </div>` : ""}
        </div>
      </div>`;
  }

  window.showTab = function(tab) {
    ["prox","hist","pend"].forEach(t => {
      document.getElementById(`tab${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.toggle("is-active", t===tab);
      document.getElementById(`tab${t.charAt(0).toUpperCase()+t.slice(1)}Content`).classList.add("a-hide");
    });
    document.getElementById("emptyState").classList.add("a-hide");
    const now = Date.now();
    const filtered = {
      prox: allSessions.filter(s => s.status === "scheduled" && Number(s.scheduledAt) > now),
      hist: allSessions.filter(s => ["completed","canceled"].includes(s.status)),
      pend: allSessions.filter(s => s.status === "pending" || (s.status === "scheduled" && Number(s.scheduledAt) <= now))
    }[tab] || [];
    const contentEl = document.getElementById(`tab${tab.charAt(0).toUpperCase()+tab.slice(1)}Content`);
    if (!filtered.length) {
      const msgs = { prox:"Sem consultas agendadas. Que tal marcar uma?", hist:"Nenhuma consulta realizada ainda.", pend:"Nenhum pedido pendente." };
      document.getElementById("emptyMsg").textContent = msgs[tab];
      document.getElementById("emptyState").classList.remove("a-hide");
    } else {
      contentEl.innerHTML = filtered.map(renderCard).join("");
      contentEl.classList.remove("a-hide");
    }
  };

  window.openCancel = function(id) {
    cancellingId = id;
    document.getElementById("cancelModal").style.display = "grid";
  };

  document.getElementById("confirmCancelBtn").addEventListener("click", async () => {
    if (!cancellingId) return;
    document.getElementById("cancelModal").style.display = "none";
    try {
      const token = await auth.currentUser.getIdToken();
      await fetch(`${BACKEND_BASE_URL}/therapy/sessoes/${cancellingId}/cancelar`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ reason: "Cancelado pelo paciente" })
      });
      const s = allSessions.find(x => (x.sessionId||x.id) === cancellingId);
      if (s) s.status = "canceled";
      showTab("prox");
    } catch { }
  });

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "./login.html"; return; }
    try {
      const token = await user.getIdToken();
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/sessoes`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const d = await r.json().catch(() => ({}));
      allSessions = (d.sessions || []).sort((a,b) => Number(b.scheduledAt) - Number(a.scheduledAt));
      document.getElementById("loadingSkel").style.display = "none";
      showTab("prox");
    } catch {
      document.getElementById("loadingSkel").style.display = "none";
      showTab("prox");
    }
  });
</script>
</body>
</html>
