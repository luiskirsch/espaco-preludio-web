<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mensagens · Espaço Prelúdio</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="/logo_oficial_fundo_transparente.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
  <style>
    .chat-shell { display: flex; flex-direction: column; height: 100dvh; }
    .chat-header {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: var(--a-surface); border-bottom: 1px solid var(--a-line);
      position: sticky; top: 0; z-index: 30; flex-shrink: 0;
    }
    .chat-header__back { background:none;border:none;cursor:pointer;padding:6px;color:var(--a-ink2); }
    .chat-header__avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--a-bg2); display:flex;align-items:center;justify-content:center;
      font-family:var(--ff-serif);font-size:15px;color:var(--a-ink2);flex-shrink:0;overflow:hidden;
    }
    .chat-header__avatar img { width:100%;height:100%;object-fit:cover; }
    .chat-header__info { flex: 1; min-width: 0; }
    .chat-header__name { font-size: 15px; font-weight: 700; color: var(--a-ink); }
    .chat-header__esp  { font-size: 12px; color: var(--a-ink2); }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--a-line); border-radius: 4px; }
    .msg { max-width: 78%; display: flex; flex-direction: column; gap: 3px; }
    .msg--out { align-self: flex-end; align-items: flex-end; }
    .msg--in  { align-self: flex-start; align-items: flex-start; }
    .msg__bubble {
      padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45;
      position: relative; word-break: break-word;
    }
    .msg--out .msg__bubble { background: var(--a-ink); color: #fff; border-bottom-right-radius: 4px; }
    .msg--in  .msg__bubble { background: var(--a-surface); color: var(--a-ink); border-bottom-left-radius: 4px; box-shadow: var(--a-shadow); }
    .msg__time { font-size: 10px; color: var(--a-ink3); padding: 0 4px; }
    .msg__status { font-size: 10px; color: rgba(255,255,255,.6); padding: 0 4px; }
    .chat-input-bar {
      padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: var(--a-surface); border-top: 1px solid var(--a-line);
      display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0;
    }
    .chat-input-wrap {
      flex: 1; background: var(--a-bg); border-radius: 22px;
      padding: 10px 16px; display: flex; align-items: center;
      min-height: 44px; max-height: 120px;
    }
    .chat-input {
      flex: 1; background: none; border: none; outline: none;
      font-family: var(--ff-sans); font-size: 14px; color: var(--a-ink);
      resize: none; line-height: 1.4; max-height: 80px; overflow-y: auto;
    }
    .chat-input::placeholder { color: var(--a-ink3); }
    .chat-send {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--a-accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 120ms, background 150ms; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .chat-send:active { transform: scale(.92); }
    .chat-send:disabled { background: var(--a-line); }
    .chat-send svg { color: #fff; }
    .date-sep { text-align: center; font-size: 11px; color: var(--a-ink3); font-weight: 600;
      background: var(--a-bg); padding: 3px 10px; border-radius: 999px;
      align-self: center; margin: 4px 0; }
    .typing { display: flex; gap: 4px; padding: 10px 14px; background: var(--a-surface);
      border-radius: 18px; border-bottom-left-radius: 4px; box-shadow: var(--a-shadow);
      align-self: flex-start; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--a-ink3);
      animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
    .chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; text-align: center; padding: 32px; }
    .chat-list { display: flex; flex-direction: column; gap: 1px; }
    .conv-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      background: var(--a-surface); cursor: pointer; transition: background 120ms;
      text-decoration: none; color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .conv-item:active { background: var(--a-bg2); }
    .conv-item__avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--a-bg2);
      display:flex;align-items:center;justify-content:center;font-family:var(--ff-serif);
      font-size:18px;color:var(--a-ink2);flex-shrink:0;overflow:hidden; }
    .conv-item__avatar img { width:100%;height:100%;object-fit:cover; }
    .conv-item__info { flex: 1; min-width: 0; }
    .conv-item__name { font-size: 14px; font-weight: 700; color: var(--a-ink); }
    .conv-item__preview { font-size: 12px; color: var(--a-ink2); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-item__time { font-size: 11px; color: var(--a-ink3); flex-shrink: 0; }
    .conv-item__badge { width: 20px; height: 20px; border-radius: 50%; background: var(--a-accent);
      color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; }
  </style>
  <script src="./sw-register.js" defer></script>
</head>
<body>
<div class="a-shell">

  <!-- Vista: lista de conversas -->
  <div id="listView" style="display:flex;flex-direction:column;height:100dvh;">
    <div class="a-header">
      <button class="a-header__back" onclick="history.back()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="a-header__title">Mensagens</div>
    </div>

    <div id="convLoading" style="padding:16px;" class="a-flex-col a-gap-12">
      <div class="a-skel" style="height:72px;border-radius:0;"></div>
      <div class="a-skel" style="height:72px;border-radius:0;"></div>
    </div>
    <div class="chat-list" id="convList" style="display:none;flex:1;overflow-y:auto;"></div>
    <div class="chat-empty a-hide" id="convEmpty">
      <div style="font-size:48px;">💬</div>
      <div style="font-family:var(--ff-serif);font-size:20px;">Sem mensagens</div>
      <div class="a-sub" style="max-width:240px;">Suas conversas com profissionais aparecerão aqui após agendar uma consulta.</div>
      <a href="./buscar.html" class="a-btn a-btn--accent a-mt-8">Buscar profissional</a>
    </div>
  </div>

  <!-- Vista: conversa individual -->
  <div id="chatView" class="chat-shell" style="display:none;">
    <div class="chat-header">
      <button class="chat-header__back" onclick="backToList()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="chat-header__avatar" id="chatAvatar">?</div>
      <div class="chat-header__info">
        <div class="chat-header__name" id="chatName">—</div>
        <div class="chat-header__esp" id="chatEsp"></div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-bar">
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chatInput" placeholder="Mensagem…" rows="1"></textarea>
      </div>
      <button class="chat-send" id="chatSendBtn" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "../js/firebase-config.js";

  let currentUser = null;
  let currentConvId = null;
  let messages = [];
  let pollTimer = null;

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "./login.html"; return; }
    currentUser = user;
    loadConversations();
  });

  function esc(s) { return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtTime(ms) { const d=new Date(Number(ms)); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
  function fmtDay(ms) {
    const d=new Date(Number(ms)); const today=new Date(); today.setHours(0,0,0,0);
    const diff = Math.floor((d.getTime()-today.getTime())/86400000);
    if (diff===0) return "Hoje"; if (diff===-1) return "Ontem";
    return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
  }

  async function loadConversations() {
    try {
      const token = await currentUser.getIdToken();
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/mensagens/conversas`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const d = await r.json().catch(() => ({}));
      document.getElementById("convLoading").style.display = "none";
      const convs = d.conversas || d.items || [];
      if (!convs.length) { document.getElementById("convEmpty").classList.remove("a-hide"); return; }
      document.getElementById("convList").style.display = "flex";
      document.getElementById("convList").innerHTML = convs.map(c => {
        const initials = (c.therapistName||"?").match(/\b\p{L}/gu)?.slice(0,2).join("").toUpperCase()||"?";
        const avatar = c.therapistPhoto
          ? `<img src="data:image/jpeg;base64,${c.therapistPhoto}" alt="">`
          : initials;
        const badge = c.unread > 0 ? `<div class="conv-item__badge">${c.unread}</div>` : "";
        return `<div class="conv-item" onclick="openChat('${esc(c.convId||c.therapistUid)}','${esc(c.therapistName)}','${esc(c.especialidade||"")}','${esc(initials)}','${esc(c.therapistPhoto||"")}')">
          <div class="conv-item__avatar">${avatar}</div>
          <div class="conv-item__info">
            <div class="conv-item__name">${esc(c.therapistName)}</div>
            <div class="conv-item__preview">${esc(c.lastMessage||"")}</div>
          </div>
          <div class="a-flex-col a-items-center" style="gap:4px;flex-shrink:0;">
            <div class="conv-item__time">${c.lastAt ? fmtTime(c.lastAt) : ""}</div>
            ${badge}
          </div>
        </div>`;
      }).join("");
    } catch {
      document.getElementById("convLoading").style.display = "none";
      document.getElementById("convEmpty").classList.remove("a-hide");
    }
  }

  window.openChat = async function(convId, name, esp, initials, photo) {
    currentConvId = convId;
    document.getElementById("listView").style.display = "none";
    document.getElementById("chatView").style.display = "flex";
    document.getElementById("chatName").textContent = name;
    document.getElementById("chatEsp").textContent  = esp;
    document.getElementById("chatAvatar").innerHTML = photo
      ? `<img src="data:image/jpeg;base64,${photo}" alt="">`
      : initials;
    document.getElementById("chatMessages").innerHTML = "";
    await loadMessages();
    pollTimer = setInterval(loadMessages, 4000);
  };

  function backToList() {
    clearInterval(pollTimer);
    currentConvId = null;
    document.getElementById("chatView").style.display = "none";
    document.getElementById("listView").style.display = "flex";
  }

  async function loadMessages() {
    if (!currentConvId) return;
    try {
      const token = await currentUser.getIdToken();
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/mensagens/${encodeURIComponent(currentConvId)}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const d = await r.json().catch(() => ({}));
      const msgs = d.mensagens || d.messages || [];
      if (msgs.length !== messages.length) {
        messages = msgs;
        renderMessages();
      }
    } catch {}
  }

  function renderMessages() {
    const container = document.getElementById("chatMessages");
    let lastDate = "";
    container.innerHTML = messages.map(m => {
      const isOut = m.fromPatient || m.senderType === "patient";
      const dayLabel = fmtDay(m.sentAt || m.at || m.createdAt);
      let dateSep = "";
      if (dayLabel !== lastDate) { dateSep = `<div class="date-sep">${dayLabel}</div>`; lastDate = dayLabel; }
      return `${dateSep}
        <div class="msg ${isOut ? "msg--out" : "msg--in"}">
          <div class="msg__bubble">${esc(m.text || m.body || "")}</div>
          <div class="${isOut ? "msg__status" : "msg__time"}">${fmtTime(m.sentAt||m.at||m.createdAt)} ${isOut ? (m.read ? "✓✓" : "✓") : ""}</div>
        </div>`;
    }).join("");
    container.scrollTop = container.scrollHeight;
  }

  const chatInput = document.getElementById("chatInput");
  const sendBtn   = document.getElementById("chatSendBtn");

  chatInput.addEventListener("input", () => {
    sendBtn.disabled = !chatInput.value.trim();
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 80) + "px";
  });
  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener("click", sendMessage);

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || !currentConvId) return;
    chatInput.value = ""; chatInput.style.height = "auto"; sendBtn.disabled = true;
    // Optimistic
    messages.push({ text, sentAt: Date.now(), fromPatient: true });
    renderMessages();
    try {
      const token = await currentUser.getIdToken();
      await fetch(`${BACKEND_BASE_URL}/therapy/paciente/mensagens/${encodeURIComponent(currentConvId)}`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
    } catch {}
  }
</script>
</body>
</html>
