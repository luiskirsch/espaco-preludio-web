  <style>
    .mood-hero {

    .history-date  { font-family: var(--ff-mono); font-size: 11px; color: var(--a-ink3); }
    .streak-card {
      background: linear-gradient(135deg, rgba(45,106,62,.1), rgba(45,106,62,.04));

      border-radius: var(--a-radius); padding: 16px;

    .streak-num { font-family: var(--ff-serif); font-size: 40px; font-weight: 500; color: var(--a-accent); line-height: 1; }
  </style>

<body class="a-portal-authenticated">
<div class="a-shell">

  <div class="a-header">
    <div class="a-header__title" data-i18n="p-app-humor:meu_humor_d1287">Meu humor</div>
  </div>

  <div class="a-page a-page--no-nav a-page-enter">

    <!-- Hero humor do dia -->
    <div class="mood-hero" id="moodHero">
      <span class="mood-hero__emoji" id="heroEmoji">😐</span>
      <div class="mood-hero__label" id="heroLabel">Como está você hoje?</div>
      <div class="mood-hero__date" id="heroDate"></div>
    </div>

    <!-- Picker -->
    <div class="a-section">
      <div class="mood-picker-card">
        <div class="mood-picker-label" data-i18n="p-app-humor:toque_para_registrar_seu_humor_f13d8">Toque para registrar seu humor</div>
        <div class="mood-picker-row" id="moodPicker">
          <button class="mood-btn" data-mood="1" data-emoji="😞" data-label="Mal" data-i18n-html="p-app-humor:mal_4af02">
            <span class="mood-btn__emoji">😞</span>
            <span class="mood-btn__label">Mal</span>
          </button>
          <button class="mood-btn" data-mood="2" data-emoji="😔" data-label="Cansado" data-i18n-html="p-app-humor:cansado_fbc2f">
            <span class="mood-btn__emoji">😔</span>
            <span class="mood-btn__label">Cansado</span>
          </button>
          <button class="mood-btn" data-mood="3" data-emoji="😐" data-label="Ok" data-i18n-html="p-app-humor:ok_77d05">
            <span class="mood-btn__emoji">😐</span>
            <span class="mood-btn__label">Ok</span>
          </button>
          <button class="mood-btn" data-mood="4" data-emoji="🙂" data-label="Bem" data-i18n-html="p-app-humor:bem_6467c">
            <span class="mood-btn__emoji">🙂</span>
            <span class="mood-btn__label">Bem</span>
          </button>
          <button class="mood-btn" data-mood="5" data-emoji="😄" data-label="Ótimo" data-i18n-html="p-app-humor:otimo_d769f">
            <span class="mood-btn__emoji">😄</span>
            <span class="mood-btn__label">Ótimo</span>
          </button>
        </div>
        <div class="save-row">
          <button class="a-btn a-btn--accent a-hide" id="saveBtn" style="min-width:140px;" data-i18n="p-app-humor:salvar_humor_ea9d0">Salvar humor</button>
          <span class="a-hide" id="savedMsg" style="font-size:13px;color:var(--a-accent);font-weight:600;">✓ Registrado hoje!</span>
        </div>
      </div>
    </div>

    <!-- Streak -->
    <div class="a-section" style="padding-top:0;" id="streakSection">
      <div class="streak-card">
        <div class="streak-num" id="streakNum">0</div>
        <div>
          <div style="font-size:14px;font-weight:700;color:var(--a-accent);" data-i18n="p-app-humor:dias_seguidos_590a1">dias seguidos</div>
          <div style="font-size:12px;color:var(--a-ink2);margin-top:3px;" data-i18n="p-app-humor:registrando_seu_humor_377ff">registrando seu humor 🌱</div>
        </div>
      </div>
    </div>

    <!-- Gráfico semanal -->
    <div class="a-section" style="padding-top:0;">
      <div class="chart-card">
        <div class="chart-title" data-i18n="p-app-humor:ultimos_7_dias_0c7f5">Últimos 7 dias</div>
        <div class="chart-sub" data-i18n="p-app-humor:seu_indice_de_bem_estar_36dd1">Seu índice de bem-estar</div>
        <div class="chart-wrap">
          <canvas id="moodChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Histórico -->
    <div class="a-section" style="padding-top:0;">
      <div style="font-size:15px;font-weight:700;margin-bottom:12px;" data-i18n="p-app-humor:historico_bea29">Histórico</div>
      <div class="a-card a-card--pad" id="historyList">
        <div class="a-empty" style="padding:24px 0;">
          <div class="a-empty__icon" style="font-size:32px;">📝</div>
          <div class="a-empty__sub" data-i18n="p-app-humor:seus_registros_de_humor_aparecerao_1e555">Seus registros de humor aparecerão aqui.</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "../js/firebase-config.js";

  const MOODS = {
    1: { emoji:"😞", label:"Mal",     color:"#b8453d" },
    2: { emoji:"😔", label:"Cansado", color:"#d4704a" },
    3: { emoji:"😐", label:"Ok",      color:"#c8963a" },
    4: { emoji:"🙂", label:"Bem",     color:"#4a9e66" },
    5: { emoji:"😄", label:"Ótimo",   color:"#2d6a3e" },
  };
  const DAYS   = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

  let selectedMood = null;
  let currentUser  = null;
  let humorData    = {};
  let chartInstance = null;
  let todayLocked  = false;

  // Data em horário de São Paulo, não UTC — toISOString() usaria UTC e, entre
  // 21h e 23h59 em SP (UTC-3), o UTC já teria virado o dia seguinte, fazendo
  // o humor "de hoje" cair no dia errado tanto aqui quanto no que é salvo.
  function todayStr() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date()).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
    return `${parts.year}-${parts.month}-${parts.day}`;
  }
  function shiftDate(dateStr, days) {
    const date = new Date(`${dateStr}T12:00:00Z`);
    date.setUTCDate(date.getUTCDate() + days);
    return date.toISOString().slice(0, 10);
  }
  function dateFromKey(dateStr) {
    return new Date(`${dateStr}T12:00:00Z`);
  }
  const sessionKey = () => currentUser ? `ep:humor:session:${currentUser.uid}` : null;

  function readSessionCache() {
    try {
      const key = sessionKey();
      if (!key) return null;
      const raw = sessionStorage.getItem(key);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed.date !== todayStr()) return null;
      return parsed.data;
    } catch { return null; }
  }
  function writeSessionCache(data) {
    try {
      const key = sessionKey();
      if (key) sessionStorage.setItem(key, JSON.stringify({ date: todayStr(), data }));
    } catch {}
  }

  function lockPicker() {
    todayLocked = true;
    document.querySelectorAll(".mood-btn").forEach(b => {
      b.disabled = true;
      b.style.opacity = b.classList.contains("is-selected") ? "1" : ".55";
      b.style.cursor = "default";
    });
  }

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "./login.html"; return; }
    currentUser = user;
    // Remove a antiga chave compartilhada entre contas, usada antes do cache
    // ser isolado por usuário neste dispositivo.
    try { sessionStorage.removeItem("ep:humor:session"); } catch {}

    const today = dateFromKey(todayStr());
    document.getElementById("heroDate").textContent =
      `${DAYS[today.getUTCDay()]}, ${today.getUTCDate()} de ${MONTHS[today.getUTCMonth()]}`;

    // Render do cache de sessão imediatamente
    const cached = readSessionCache();
    if (cached) {
      humorData = cached;
      renderAll();
    }

    document.querySelectorAll(".mood-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (todayLocked) return;
        selectedMood = Number(btn.dataset.mood);
        markBtn(selectedMood);
        const m = MOODS[selectedMood];
        document.getElementById("heroEmoji").textContent = m.emoji;
        document.getElementById("heroLabel").textContent = m.label;
        document.getElementById("saveBtn").classList.remove("a-hide");
        document.getElementById("savedMsg").classList.add("a-hide");
      });
    });

    document.getElementById("saveBtn").addEventListener("click", saveHumor);

    await loadFromBackend();
  });

  async function loadFromBackend() {
    try {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (key?.startsWith("ep:humor:")) localStorage.removeItem(key);
      }
    } catch {}

    try {
      const token = await currentUser.getIdToken();
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/humor?days=30`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const d = await r.json().catch(() => ({}));
      if (!d.ok) throw new Error(d.error || "api");
      humorData = {};
      d.items.forEach(item => { humorData[item.date] = item.mood; });
      writeSessionCache(humorData);
      renderAll();
    } catch {
      if (!Object.keys(humorData).length) {
        document.getElementById("savedMsg").textContent = "Não foi possível carregar o histórico.";
      }
    }
  }

  async function saveHumor() {
    if (!selectedMood || todayLocked) return;
    const date = todayStr();
    humorData[date] = selectedMood;
    document.getElementById("saveBtn").classList.add("a-hide");
    document.getElementById("savedMsg").classList.remove("a-hide");
    lockPicker();
    renderAll();
    writeSessionCache(humorData);
    try {
      const token = await currentUser.getIdToken();
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/humor`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ mood: selectedMood })
      });
      const response = await r.json().catch(() => ({}));
      if (!r.ok || !response.ok) throw new Error(response.error || "fail");
      if (response.date && response.date !== date) {
        delete humorData[date];
        humorData[response.date] = response.mood;
        writeSessionCache(humorData);
        renderAll();
      }
    } catch {
      delete humorData[date];
      todayLocked = false;
      document.querySelectorAll(".mood-btn").forEach(b => {
        b.disabled = false; b.style.opacity = ""; b.style.cursor = "";
      });
      document.getElementById("savedMsg").textContent = "Não foi possível salvar. Tente novamente.";
      document.getElementById("saveBtn").classList.remove("a-hide");
      writeSessionCache(humorData);
      markBtn(selectedMood);
      buildChart();
      buildStreak();
      loadHistory();
    }
  }

  function renderAll() {
    const today = todayStr();
    const todayMood = humorData[today];
    if (todayMood) {
      const m = MOODS[todayMood];
      document.getElementById("heroEmoji").textContent = m.emoji;
      document.getElementById("heroLabel").textContent = m.label;
      document.getElementById("savedMsg").classList.remove("a-hide");
      document.getElementById("saveBtn").classList.add("a-hide");
      markBtn(todayMood);
      if (!todayLocked) lockPicker();
    } else if (!todayLocked) {
      selectedMood = null;
      markBtn(null);
      document.getElementById("heroEmoji").textContent = "😐";
      document.getElementById("heroLabel").textContent = "Como está você hoje?";
    }
    buildChart();
    buildStreak();
    loadHistory();
  }

  function markBtn(mood) {
    document.querySelectorAll(".mood-btn").forEach(b => {
      b.classList.toggle("is-selected", Number(b.dataset.mood) === mood);
    });
  }

  function buildChart() {
    const labels = [], data = [], colors = [];
    const today = todayStr();
    for (let i = 6; i >= 0; i--) {
      const dateStr = shiftDate(today, -i);
      const d = dateFromKey(dateStr);
      labels.push(DAYS[d.getUTCDay()]);
      const val = humorData[dateStr] || 0;
      data.push(val);
      colors.push(val ? (MOODS[val]?.color || "#ccc") : "rgba(0,0,0,.06)");
    }
    const ctx = document.getElementById("moodChart").getContext("2d");
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type: "bar",
      data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 8, borderSkipped: false }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => MOODS[c.raw]?.label || "Sem registro" } } },
        scales: {
          y: { min: 0, max: 5, ticks: { display: false }, grid: { color: "rgba(0,0,0,.04)" } },
          x: { ticks: { font: { size: 11, weight: "600" } }, grid: { display: false } }
        }
      }
    });
  }

  function buildStreak() {
    let streak = 0;
    const today = todayStr();
    for (let i = 0; i < 365; i++) {
      const date = shiftDate(today, -i);
      if (humorData[date]) streak++;
      else if (i > 0) break;
    }
    document.getElementById("streakNum").textContent = streak;
  }

  function loadHistory() {
    const sorted = Object.entries(humorData).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 30);
    const list = document.getElementById("historyList");
    if (!sorted.length) {
      list.innerHTML = `<div class="a-empty" style="padding:24px 0;"><div class="a-empty__icon" style="font-size:32px;">📝</div><div class="a-empty__sub">Seus registros de humor aparecerão aqui.</div></div>`;
      return;
    }
    list.innerHTML = sorted.map(([dateStr, val]) => {
      const d = dateFromKey(dateStr);
      const m = MOODS[val] || MOODS[3];
      return `<div class="history-item">
        <div class="history-emoji">${m.emoji}</div>
        <div class="history-info">
          <div class="history-day">${m.label}</div>
          <div class="history-label">${DAYS[d.getUTCDay()]}</div>
        </div>
        <div class="history-date">${d.getUTCDate()} de ${MONTHS[d.getUTCMonth()]}</div>
      </div>`;
    }).join("");
  }
</script>
</body>
