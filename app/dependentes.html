<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../js/domain-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dependentes · Espaço Prelúdio</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="/logo_oficial_fundo_transparente.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
  <style>
    .dep-card {
      background: var(--a-surface); border-radius: var(--a-radius);
      box-shadow: var(--a-shadow); padding: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .dep-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--a-bg2); display: flex; align-items: center; justify-content: center;
      font-family: var(--ff-serif); font-size: 20px; color: var(--a-ink2); flex-shrink: 0;
    }
    .dep-info { flex: 1; min-width: 0; }
    .dep-name { font-size: 15px; font-weight: 700; color: var(--a-ink); }
    .dep-rel  { font-size: 12px; color: var(--a-ink2); margin-top: 3px; }
    .dep-age  { font-size: 11px; color: var(--a-ink3); margin-top: 1px; }
    .dep-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .add-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 56px; border-radius: var(--a-radius);
      border: 2px dashed var(--a-line); background: none; cursor: pointer;
      font-size: 14px; font-weight: 600; color: var(--a-ink2);
      transition: all 150ms; -webkit-tap-highlight-color: transparent;
    }
    .add-btn:active { background: var(--a-bg2); border-color: var(--a-accent); color: var(--a-accent); }
    .info-box { background: rgba(45,106,62,.06); border: 1px solid rgba(45,106,62,.15);
      border-radius: var(--a-radius-sm); padding: 12px 14px; font-size: 13px;
      color: var(--a-ink2); line-height: 1.6; }
    .rel-select { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rel-opt {
      padding: 10px; border-radius: var(--a-radius-sm); border: 1.5px solid var(--a-line);
      background: var(--a-surface); font-size: 13px; font-weight: 600; color: var(--a-ink2);
      cursor: pointer; text-align: center; transition: all 120ms;
    }
    .rel-opt.is-selected { border-color: var(--a-accent); background: rgba(45,106,62,.08); color: var(--a-accent); }
  </style>
  <script src="./sw-register.js" defer></script>
</head>
<body>
<div class="a-shell">
  <div class="a-header">
    <button class="a-header__back" onclick="history.back()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="a-header__title">Dependentes</div>
  </div>

  <div class="a-page a-page--no-nav a-page-enter">
    <div class="a-section">
      <div class="info-box">
        💚 Adicione familiares para que eles também possam usar o programa de saúde. Cada dependente tem acesso ao diretório e pode agendar consultas.
      </div>

      <div class="a-flex-col a-gap-10 a-mt-16" id="depList">
        <div class="a-skel" style="height:84px;border-radius:16px;" id="depLoading"></div>
      </div>

      <button class="add-btn a-mt-12" id="addDepBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Adicionar dependente
      </button>
    </div>
  </div>
</div>

<!-- Modal: adicionar dependente -->
<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;" id="addModal">
  <div style="background:var(--a-surface);border-radius:20px 20px 0 0;padding:24px;width:100%;max-height:85dvh;overflow-y:auto;">
    <div style="width:36px;height:4px;border-radius:2px;background:var(--a-line);margin:0 auto 20px;"></div>
    <h3 style="font-family:var(--ff-serif);font-size:22px;margin:0 0 20px;">Novo dependente</h3>

    <div class="a-field"><label class="a-field__label">Nome completo *</label>
      <input id="depNome" class="a-input" type="text" placeholder="Ex.: Maria Silva" autocomplete="name"></div>

    <div class="a-field">
      <label class="a-field__label">Parentesco *</label>
      <div class="rel-select" id="relSelect">
        <div class="rel-opt" data-rel="filho">👧 Filho(a)</div>
        <div class="rel-opt" data-rel="conjuge">💑 Cônjuge</div>
        <div class="rel-opt" data-rel="pai_mae">👴 Pai/Mãe</div>
        <div class="rel-opt" data-rel="outro">👤 Outro</div>
      </div>
    </div>

    <div class="a-field">
      <label class="a-field__label">Data de nascimento *</label>
      <input id="depNasc" class="a-input" type="date">
    </div>

    <div class="a-field">
      <label class="a-field__label">E-mail (opcional)</label>
      <input id="depEmail" class="a-input" type="email" placeholder="Para enviar o link de acesso" inputmode="email">
    </div>

    <div id="addErro" class="a-alert a-alert--err a-hide a-mt-8"></div>

    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="a-btn a-btn--ghost" style="flex:1;" onclick="document.getElementById('addModal').style.display='none'">Cancelar</button>
      <button class="a-btn a-btn--primary" style="flex:1;" id="saveDepBtn">Adicionar</button>
    </div>
  </div>
</div>

<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "../js/firebase-config.js";

  const REL_LABELS = { filho:"Filho(a)", conjuge:"Cônjuge", pai_mae:"Pai/Mãe", outro:"Outro" };
  const REL_EMOJI  = { filho:"👧", conjuge:"💑", pai_mae:"👴", outro:"👤" };

  let currentUser = null;
  let dependentes = [];
  let selectedRel = "";

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "./login.html"; return; }
    currentUser = user;
    loadDependentes();
  });

  function calcIdade(nasc) {
    if (!nasc) return null;
    const d = new Date(nasc); const hoje = new Date();
    let idade = hoje.getFullYear() - d.getFullYear();
    if (hoje.getMonth() < d.getMonth() || (hoje.getMonth()===d.getMonth() && hoje.getDate()<d.getDate())) idade--;
    return idade;
  }

  function renderDeps(deps) {
    document.getElementById("depLoading").style.display = "none";
    const list = document.getElementById("depList");
    if (!deps.length) {
      list.innerHTML = `<div class="a-empty" style="padding:24px 0;"><div class="a-empty__icon" style="font-size:36px;">👨‍👩‍👧</div><div class="a-empty__sub">Adicione seus familiares para compartilhar o benefício.</div></div>`;
      return;
    }
    list.innerHTML = deps.map((d, i) => {
      const emoji   = REL_EMOJI[d.parentesco] || "👤";
      const relLabel = REL_LABELS[d.parentesco] || d.parentesco;
      const idade   = calcIdade(d.dataNascimento);
      const initials = (d.nome||"?").match(/\b\p{L}/gu)?.slice(0,2).join("").toUpperCase()||"?";
      return `<div class="dep-card">
        <div class="dep-avatar">${initials}</div>
        <div class="dep-info">
          <div class="dep-name">${d.nome}</div>
          <div class="dep-rel">${emoji} ${relLabel}</div>
          ${idade !== null ? `<div class="dep-age">${idade} anos</div>` : ""}
        </div>
        <div class="dep-actions">
          <a href="./buscar.html?dep=${encodeURIComponent(d.id||i)}" class="a-btn a-btn--sm a-btn--accent" style="font-size:11px;padding:0 10px;">Agendar</a>
          <button class="a-btn a-btn--sm a-btn--ghost" style="font-size:11px;padding:0 10px;color:#b8453d;" onclick="removeDep('${d.id||i}')">✕</button>
        </div>
      </div>`;
    }).join("");
  }

  async function loadDependentes() {
    const key = `ep:dependentes:${currentUser.uid}`;
    try {
      const token = await currentUser.getIdToken();
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/dependentes`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const d = await r.json().catch(() => ({}));
      if (d.ok) {
        dependentes = d.dependentes || [];
        localStorage.setItem(key, JSON.stringify(dependentes)); // cache offline
      } else throw new Error("api");
    } catch {
      // Offline: usa cache local
      const saved = localStorage.getItem(key);
      dependentes = saved ? JSON.parse(saved) : [];
    }
    renderDeps(dependentes);
  }

  document.getElementById("addDepBtn").addEventListener("click", () => {
    document.getElementById("addModal").style.display = "flex";
    selectedRel = "";
    document.querySelectorAll(".rel-opt").forEach(o => o.classList.remove("is-selected"));
    document.getElementById("depNome").value  = "";
    document.getElementById("depNasc").value  = "";
    document.getElementById("depEmail").value = "";
    document.getElementById("addErro").classList.add("a-hide");
  });

  document.querySelectorAll(".rel-opt").forEach(opt => {
    opt.addEventListener("click", () => {
      document.querySelectorAll(".rel-opt").forEach(o => o.classList.remove("is-selected"));
      opt.classList.add("is-selected");
      selectedRel = opt.dataset.rel;
    });
  });

  document.getElementById("saveDepBtn").addEventListener("click", async () => {
    const nome  = document.getElementById("depNome").value.trim();
    const nasc  = document.getElementById("depNasc").value;
    const email = document.getElementById("depEmail").value.trim();
    const erro  = document.getElementById("addErro");
    erro.classList.add("a-hide");
    if (!nome) { erro.textContent = "Informe o nome."; erro.classList.remove("a-hide"); return; }
    if (!selectedRel) { erro.textContent = "Selecione o parentesco."; erro.classList.remove("a-hide"); return; }
    if (!nasc) { erro.textContent = "Informe a data de nascimento."; erro.classList.remove("a-hide"); return; }

    document.getElementById("saveDepBtn").disabled = true;
    try {
      const token = await currentUser.getIdToken();
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/dependentes`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ nome, parentesco: selectedRel, dataNascimento: nasc, email: email || null })
      });
      const d = await r.json().catch(() => ({}));
      if (!d.ok) throw new Error("api");
      // Recarrega do backend para garantir consistência
      await loadDependentes();
    } catch {
      // Fallback offline
      const dep = { id: Date.now().toString(), nome, parentesco: selectedRel, dataNascimento: nasc, email: email || null };
      dependentes.push(dep);
      localStorage.setItem(`ep:dependentes:${currentUser.uid}`, JSON.stringify(dependentes));
      renderDeps(dependentes);
    }
    document.getElementById("saveDepBtn").disabled = false;
    document.getElementById("addModal").style.display = "none";
  });

  window.removeDep = async function(id) {
    if (!confirm("Remover este dependente?")) return;
    try {
      const token = await currentUser.getIdToken();
      await fetch(`${BACKEND_BASE_URL}/therapy/paciente/dependentes/${id}`, {
        method: "DELETE", headers: { Authorization: `Bearer ${token}` }
      });
      await loadDependentes(); // recarrega do backend
    } catch {
      dependentes = dependentes.filter(d => d.id !== id);
      localStorage.setItem(`ep:dependentes:${currentUser.uid}`, JSON.stringify(dependentes));
      renderDeps(dependentes);
    }
  };
</script>
</body>
</html>
