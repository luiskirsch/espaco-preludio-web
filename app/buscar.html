<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Buscar · Espaço Prelúdio</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="/logo_oficial_fundo_transparente.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
  <style>
    .buscar-top { padding: 16px 16px 12px; background: var(--a-bg); position: sticky; top: 0; z-index: 30; }
    .buscar-top__title { font-family: var(--ff-serif); font-size: 22px; font-weight: 500; margin-bottom: 12px; }
    .results-list { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 16px; }
    .a-prof-card__arrow { color: var(--a-ink3); flex-shrink: 0; }
  </style>
  <script src="./sw-register.js" defer></script>
</head>
<body>
<div class="a-shell">
  <div class="a-page a-page-enter">

    <div class="buscar-top">
      <div class="buscar-top__title">Encontre seu profissional</div>
      <div class="a-search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--a-ink3);flex-shrink:0;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="search" placeholder="Nome, especialidade, cidade…" autocomplete="off">
      </div>
      <div class="a-chips a-mt-8" id="chipsEsp">
        <button class="a-chip is-active" data-esp="">Todos</button>
        <button class="a-chip" data-esp="psicologia-clinica">Psicologia</button>
        <button class="a-chip" data-esp="psiquiatria">Psiquiatria</button>
        <button class="a-chip" data-esp="terapia-cognitivo-comportamental">TCC</button>
        <button class="a-chip" data-esp="terapia-de-casal">Casal</button>
        <button class="a-chip" data-esp="neuropsicologia">Neuro</button>
        <button class="a-chip" data-esp="terapia-familiar">Família</button>
        <button class="a-chip" data-esp="psicanalise">Psicanálise</button>
      </div>
    </div>

    <div id="searchHint" class="a-empty">
      <div class="a-empty__icon">🔍</div>
      <div class="a-empty__title">Busque um profissional</div>
      <div class="a-empty__sub">Selecione uma especialidade ou digite o nome ou cidade.</div>
    </div>

    <div id="searchLoading" class="a-section a-hide">
      <div class="a-flex-col a-gap-12">
        <div class="a-skel" style="height:84px;border-radius:16px;"></div>
        <div class="a-skel" style="height:84px;border-radius:16px;"></div>
        <div class="a-skel" style="height:84px;border-radius:16px;"></div>
      </div>
    </div>

    <div id="searchEmpty" class="a-empty a-hide">
      <div class="a-empty__icon">🤔</div>
      <div class="a-empty__title">Nenhum resultado</div>
      <div class="a-empty__sub">Tente outros filtros ou uma cidade diferente.</div>
    </div>

    <div class="results-list a-hide" id="resultsList"></div>

  </div>

  <!-- Bottom Nav -->
  <nav class="a-nav">
    <a href="./home.html" class="a-nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Início</span>
    </a>
    <a href="./buscar.html" class="a-nav__item is-active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Buscar</span>
      <span class="a-nav__dot"></span>
    </a>
    <a href="./consultas.html" class="a-nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Consultas</span>
    </a>
    <a href="./perfil.html" class="a-nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Perfil</span>
    </a>
  </nav>
</div>

<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "../js/firebase-config.js";

  onAuthStateChanged(auth, u => { if (!u) window.location.href = "./login.html"; });

  const ESP_LABELS = {
    "psicologia-clinica": "Psicologia clínica",
    "terapia-cognitivo-comportamental": "TCC",
    "psiquiatria": "Psiquiatria",
    "psicanalise": "Psicanálise",
    "terapia-de-casal": "Terapia de casal",
    "neuropsicologia": "Neuropsicologia",
    "terapia-familiar": "Terapia familiar",
  };

  let currentEsp = "";
  let searchTimer;

  const searchInput = document.getElementById("searchInput");
  const resultsList = document.getElementById("resultsList");
  const searchHint  = document.getElementById("searchHint");
  const searchLoading = document.getElementById("searchLoading");
  const searchEmpty = document.getElementById("searchEmpty");

  function esc(s) { return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function initials(name) {
    return (name||"?").match(/\b\p{L}/gu)?.slice(0,2).join("").toUpperCase() || "?";
  }

  function renderResults(items) {
    searchLoading.classList.add("a-hide");
    searchHint.classList.add("a-hide");
    if (!items.length) { resultsList.classList.add("a-hide"); searchEmpty.classList.remove("a-hide"); return; }
    searchEmpty.classList.add("a-hide");
    resultsList.innerHTML = items.map(p => {
      const espLabel = ESP_LABELS[p.especialidade] || p.especialidade || "Profissional de saúde";
      const loc = [p.cidade, p.uf].filter(Boolean).join("/");
      const avatar = p.photoBase64
        ? `<img src="data:${p.photoMime||'image/jpeg'};base64,${p.photoBase64}" alt="">`
        : initials(p.displayName);
      const verified = p.isVerified ? `<span class="a-verified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg></span>` : "";
      return `
        <div class="a-prof-card" onclick="window.location='./agendar.html?p=${encodeURIComponent(p.slug)}'">
          <div class="a-prof-avatar">${avatar}</div>
          <div class="a-prof-info">
            <div class="a-prof-name">${esc(p.displayName)} ${verified}</div>
            <div class="a-prof-esp">${esc(espLabel)}</div>
            ${loc ? `<div class="a-prof-loc"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(loc)}</div>` : ""}
          </div>
          <div class="a-prof-card__arrow">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>`;
    }).join("");
    resultsList.classList.remove("a-hide");
  }

  async function buscar() {
    const q = searchInput.value.trim();
    if (!q && !currentEsp) { searchHint.classList.remove("a-hide"); resultsList.classList.add("a-hide"); return; }
    searchHint.classList.add("a-hide");
    searchEmpty.classList.add("a-hide");
    resultsList.classList.add("a-hide");
    searchLoading.classList.remove("a-hide");
    try {
      const params = new URLSearchParams();
      if (currentEsp) params.set("especialidade", currentEsp);
      if (q) params.set("q", q);
      const res = await fetch(`${BACKEND_BASE_URL}/public/profissionais?${params}`);
      const data = await res.json().catch(() => ({}));
      renderResults(data.items || []);
    } catch {
      searchLoading.classList.add("a-hide");
      searchEmpty.classList.remove("a-hide");
    }
  }

  searchInput.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(buscar, 350); });

  document.querySelectorAll(".a-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".a-chip").forEach(c => c.classList.remove("is-active"));
      chip.classList.add("is-active");
      currentEsp = chip.dataset.esp;
      buscar();
    });
  });
</script>
</body>
</html>
