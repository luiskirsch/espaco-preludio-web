<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){if(window.top!==window.self){try{window.top.location.replace(location.href);}catch(_){document.documentElement.innerHTML="";}return;}var h=(location.hostname||"").toLowerCase(),p=location.protocol||"";var A=["espacopreludio.com","www.espacopreludio.com","espacopreludio.com.br","www.espacopreludio.com.br","localhost","127.0.0.1"];if(p==="file:"||h&&A.indexOf(h)===-1){document.documentElement.innerHTML="<style>*{margin:0;padding:0}html,body{background:#0d1117;height:100%;display:flex;align-items:center;justify-content:center}p{color:#ccc;font:15px/1.7 sans-serif;text-align:center;max-width:320px}a{color:#5b8af5;text-decoration:none}</style><p>Este conte\u00fado s\u00f3 est\u00e1 dispon\u00edvel no site oficial.<br><a href=\"https://espacopreludio.com.br\">espacopreludio.com.br<\/a><\/p>";setTimeout(function(){location.replace("https://espacopreludio.com.br");},2500);}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Documentos · Espaço Prelúdio</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="/logo_oficial_fundo_transparente.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
  <style>
    .doc-card {
      background: var(--a-surface); border-radius: var(--a-radius);
      box-shadow: var(--a-shadow); padding: 16px;
      display: flex; align-items: center; gap: 14px;
      cursor: pointer; transition: transform 120ms;
      -webkit-tap-highlight-color: transparent;
    }
    .doc-card:active { transform: scale(.98); }
    .doc-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .doc-icon--recibo  { background: rgba(45,106,62,.1); }
    .doc-icon--receita { background: rgba(60,90,180,.1); }
    .doc-icon--atestado { background: rgba(200,120,40,.1); }
    .doc-icon--laudo   { background: rgba(140,60,140,.1); }
    .doc-info { flex: 1; min-width: 0; }
    .doc-title { font-size: 14px; font-weight: 600; color: var(--a-ink); }
    .doc-sub   { font-size: 12px; color: var(--a-ink2); margin-top: 3px; }
    .doc-date  { font-family: var(--ff-mono); font-size: 11px; color: var(--a-ink3); margin-top: 3px; }
    .doc-arrow { color: var(--a-ink3); flex-shrink: 0; }
    .filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; }
    .filter-row::-webkit-scrollbar { display: none; }
  </style>
  <script src="./sw-register.js" defer></script>
</head>
<body>
<div class="a-shell">

  <div class="a-header">
    <button class="a-header__back" onclick="history.back()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="a-header__title">Documentos</div>
  </div>

  <div class="a-page a-page--no-nav a-page-enter">

    <div class="filter-row" id="filterRow">
      <button class="a-chip is-active" data-tipo="">Todos</button>
      <button class="a-chip" data-tipo="recibo">Recibos</button>
      <button class="a-chip" data-tipo="receita">Receitas</button>
      <button class="a-chip" data-tipo="atestado">Atestados</button>
      <button class="a-chip" data-tipo="laudo">Laudos</button>
    </div>

    <div id="loadingSkel" class="a-section">
      <div class="a-flex-col a-gap-12">
        <div class="a-skel" style="height:80px;border-radius:16px;"></div>
        <div class="a-skel" style="height:80px;border-radius:16px;"></div>
        <div class="a-skel" style="height:80px;border-radius:16px;"></div>
      </div>
    </div>

    <div id="docList" class="a-section a-hide">
      <div class="a-flex-col a-gap-10" id="docListInner"></div>
    </div>

    <div id="emptyDocs" class="a-empty a-hide">
      <div class="a-empty__icon">📄</div>
      <div class="a-empty__title">Sem documentos</div>
      <div class="a-empty__sub">Seus recibos, receitas e atestados aparecerão aqui após as consultas.</div>
    </div>

  </div>
</div>

<!-- Viewer modal -->
<div style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;flex-direction:column;" id="viewerModal">
  <div style="display:flex;align-items:center;gap:12px;padding:16px;background:var(--a-surface);">
    <button style="background:none;border:none;cursor:pointer;padding:4px;" onclick="document.getElementById('viewerModal').style.display='none'">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <span id="viewerTitle" style="font-size:15px;font-weight:600;flex:1;"></span>
    <a id="viewerDownload" href="#" download style="background:none;border:none;cursor:pointer;color:var(--a-accent);font-size:13px;font-weight:700;text-decoration:none;">⬇ Baixar</a>
  </div>
  <iframe id="viewerFrame" style="flex:1;border:none;background:#f5f5f5;"></iframe>
</div>

<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "../js/firebase-config.js";

  const ICONS  = { recibo:"🧾", receita:"💊", atestado:"📋", laudo:"🔬", encaminhamento:"📨" };
  const COLORS = { recibo:"recibo", receita:"receita", atestado:"atestado", laudo:"laudo" };

  function esc(s) { return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtDate(ms) { return new Date(Number(ms)).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}); }

  let allDocs = [];
  let currentTipo = "";

  function renderDocs(docs) {
    const inner = document.getElementById("docListInner");
    document.getElementById("loadingSkel").style.display = "none";
    if (!docs.length) {
      document.getElementById("docList").classList.add("a-hide");
      document.getElementById("emptyDocs").classList.remove("a-hide");
      return;
    }
    document.getElementById("emptyDocs").classList.add("a-hide");
    document.getElementById("docList").classList.remove("a-hide");
    inner.innerHTML = docs.map(d => {
      const tipo = d.tipo || d.type || "recibo";
      const icon  = ICONS[tipo]  || "📄";
      const color = COLORS[tipo] || "recibo";
      const prof  = d.therapistName || "Profissional";
      return `
        <div class="doc-card" onclick="openDoc('${esc(d.id||d.documentId||"")}','${esc(d.titulo||tipo)}','${esc(d.url||"")}')">
          <div class="doc-icon doc-icon--${color}">${icon}</div>
          <div class="doc-info">
            <div class="doc-title">${esc(d.titulo || tipo.charAt(0).toUpperCase()+tipo.slice(1))}</div>
            <div class="doc-sub">${esc(prof)}</div>
            <div class="doc-date">${fmtDate(d.createdAt||d.at||Date.now())}</div>
          </div>
          <div class="doc-arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>`;
    }).join("");
  }

  window.openDoc = function(id, titulo, url) {
    if (!url) return;
    document.getElementById("viewerTitle").textContent = titulo;
    document.getElementById("viewerFrame").src = url;
    document.getElementById("viewerDownload").href = url;
    document.getElementById("viewerDownload").download = titulo + ".pdf";
    document.getElementById("viewerModal").style.display = "flex";
  };

  function filterDocs() {
    const filtered = currentTipo ? allDocs.filter(d => (d.tipo||d.type||"recibo") === currentTipo) : allDocs;
    renderDocs(filtered);
  }

  document.querySelectorAll(".a-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".a-chip").forEach(c => c.classList.remove("is-active"));
      chip.classList.add("is-active");
      currentTipo = chip.dataset.tipo;
      filterDocs();
    });
  });

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = "./login.html"; return; }
    try {
      const token = await user.getIdToken();
      // Busca recibos do paciente
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/paciente/documentos`, {
        headers: { Authorization: `Bearer ${token}` }
      }).catch(() => null);
      const data = r ? (await r.json().catch(() => ({}))) : {};
      allDocs = (data.items || []);
      renderDocs(allDocs);
    } catch {
      document.getElementById("loadingSkel").style.display = "none";
      renderDocs([]);
    }
  });
</script>
</body>
</html>
