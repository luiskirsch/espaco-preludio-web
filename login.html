<!DOCTYPE html>
<html lang="pt-BR" class="ep-consult-html">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Espaço Prelúdio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/espaco-preludio.css?v=3-144">
</head>
<body>

<main class="ep-auth">
  <div class="ep-auth__panel">
    <a href="./index.html" class="ep-brand" aria-label="Espaço Prelúdio">
      <span class="ep-brand__mark">EP</span>
      <span class="ep-brand__name">
        <span class="ep-brand__lead">Espaço</span>
        <span>Prelúdio</span>
      </span>
    </a>

    <h2 class="ep-auth__title ep-mt-32">Entrar no consultório</h2>
    <p class="ep-auth__sub">
      Use seu e-mail profissional. Sua senha desbloqueia também a chave que cifra suas anotações.
    </p>

    <div id="reauthAlert" class="ep-alert ep-alert--info ep-mt-12 ep-hide">
      Sua sessão de cifragem expirou. Confirme sua senha para continuar.
    </div>

    <form id="loginForm" class="ep-stack ep-mt-16" novalidate>
      <div class="ep-field">
        <label class="ep-label" for="email">E-mail</label>
        <input id="email" class="ep-input" type="email" autocomplete="email" maxlength="160" required>
      </div>
      <div class="ep-field">
        <label class="ep-label" for="password">Senha</label>
        <input id="password" class="ep-input" type="password" autocomplete="current-password" required>
      </div>

      <div class="ep-status" id="status"></div>

      <div class="ep-stack" style="gap: 8px;">
        <button class="ep-btn ep-btn--primary ep-btn--lg ep-btn--block" type="submit" id="submitBtn">Entrar</button>
        <a href="./cadastro.html" class="ep-btn ep-btn--ghost ep-btn--block">Criar consultório</a>
      </div>
    </form>

    <div class="ep-auth__bottom">
      <a href="./recuperar.html">Esqueci minha senha · usar chave-semente</a>
    </div>
  </div>
</main>

<script type="module">
  import {
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "./js/firebase-config.js";
  import { unwrapDek, rememberDek, rememberUser } from "./js/crypto.js";
  // Sanitiza redirect: aceita so path relativo same-origin (./...). Bloqueia
  // //evil, /\\evil, https://evil, javascript:, data:, etc. — protege phishing
  // que abusava do redirect pra mandar user pro fake-login.
  function sanitizeRedirect(raw, fallback) {
    if (!raw || typeof raw !== "string") return fallback;
    if (!/^\.\/[a-zA-Z0-9_\-/.?=&%]+$/.test(raw)) return fallback;
    if (raw.includes(":") || raw.includes("//") || raw.includes("\\")) return fallback;
    return raw;
  }


  const params = new URLSearchParams(location.search);
  const reauth = params.get("reauth") === "1";
  const redirect = sanitizeRedirect(params.get("redirect"), "./painel.html");
  const errorParam = params.get("error");

  if (reauth) document.getElementById("reauthAlert").classList.remove("ep-hide");

  const statusEl = document.getElementById("status");
  function setStatus(text, type = "") {
    statusEl.textContent = text;
    statusEl.className = "ep-status";
    if (type) statusEl.classList.add("is-" + type);
  }

  if (errorParam === "NAO_REGISTRADO") {
    setStatus("Você ainda não tem cadastro de profissional. Crie sua conta primeiro.", "err");
  }

  async function fetchProfile(idToken) {
    const res = await fetch(`${BACKEND_BASE_URL}/therapy/profissional/me`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    if (res.status === 404) return { ok: false, code: "NAO_REGISTRADO" };
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return { ok: false, code: data?.error || "ERRO_PERFIL" };
    return { ok: true, therapist: data.therapist };
  }

  function humanize(err) {
    const code = err?.code || "";
    if (code === "auth/invalid-credential") return "E-mail ou senha incorretos.";
    if (code === "auth/wrong-password")     return "Senha incorreta.";
    if (code === "auth/user-not-found")     return "Conta não encontrada.";
    if (code === "auth/too-many-requests")  return "Muitas tentativas. Tente novamente em alguns minutos.";
    if (code === "auth/network-request-failed") return "Erro de conexão.";
    return err?.message || "Erro ao entrar.";
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;

    const email    = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      setStatus("Preencha e-mail e senha.", "err");
      submitBtn.disabled = false;
      return;
    }

    try {
      setStatus("Autenticando…");
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const idToken = await cred.user.getIdToken();

      setStatus("Carregando perfil…");
      const profile = await fetchProfile(idToken);
      if (!profile.ok) {
        if (profile.code === "NAO_REGISTRADO") {
          setStatus("Sua conta existe mas o cadastro de profissional não foi finalizado. Indo para o cadastro…", "err");
          setTimeout(() => { window.location.href = "./cadastro.html?step=profissional"; }, 1500);
          return;
        }
        setStatus("Erro: " + profile.code, "err");
        submitBtn.disabled = false;
        return;
      }

      const t = profile.therapist;
      if (!t.e2eeSalt || !t.wrappedDEK || !t.wrappedDEKIv) {
        setStatus("Sua conta está sem chave de cifragem. Recadastre-se ou entre em contato.", "err");
        submitBtn.disabled = false;
        return;
      }

      setStatus("Desbloqueando sua chave…");
      let dek;
      try {
        dek = await unwrapDek({
          wrappedDEK:   t.wrappedDEK,
          wrappedDEKIv: t.wrappedDEKIv,
          e2eeSalt:     t.e2eeSalt
        }, password);
      } catch {
        setStatus("Senha aceita mas a chave não pôde ser desbloqueada — possivelmente o cadastro está corrompido.", "err");
        submitBtn.disabled = false;
        return;
      }

      rememberDek(dek);
      rememberUser({ uid: cred.user.uid, email, displayName: t.displayName });

      setStatus("Entrando…", "ok");
      window.location.href = redirect;
    } catch (error) {
      console.error("login_error", error);
      setStatus(humanize(error), "err");
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
