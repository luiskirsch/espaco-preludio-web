<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{if(localStorage.getItem("ep:theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
  <title>Admin · Estudantes · Espaço Prelúdio</title>
  <link rel="icon" type="image/png" href="/logo_oficial_fundo_transparente.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/espaco-preludio.css?v=3-277">
  <style>
    .est-table { width:100%; border-collapse:collapse; font-size:13px; }
    .est-table th { text-align:left; padding:8px 10px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ep-ink-3); border-bottom:1px solid var(--ep-line); white-space:nowrap; }
    .est-table td { padding:9px 10px; border-bottom:1px solid var(--ep-line); vertical-align:middle; color:var(--ep-ink); }
    .est-table tr:hover td { background:var(--ep-bg-2); }
    .ep-drawer { position:fixed; top:0; right:0; bottom:0; width:420px; max-width:100vw; background:var(--ep-surface); border-left:1px solid var(--ep-line); z-index:200; display:flex; flex-direction:column; transform:translateX(100%); transition:transform 220ms ease; box-shadow:-4px 0 24px rgba(0,0,0,.12); }
    .ep-drawer.is-open { transform:translateX(0); }
    .ep-drawer__head { padding:20px 24px 16px; border-bottom:1px solid var(--ep-line); display:flex; align-items:center; justify-content:space-between; }
    .ep-drawer__body { padding:20px 24px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:14px; }
    .ep-drawer__row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .ep-drawer__label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ep-ink-3); margin-bottom:3px; }
    .ep-drawer__val { font-size:13px; color:var(--ep-ink); }
    .ep-drawer__foot { padding:16px 24px; border-top:1px solid var(--ep-line); display:flex; gap:8px; flex-wrap:wrap; }
    .ep-overlay { position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:199; display:none; }
    .ep-overlay.is-open { display:block; }
    .stats-row { display:flex; gap:16px; flex-wrap:wrap; margin-top:16px; }
    .stat-chip { background:var(--ep-bg-2); border:1px solid var(--ep-line); border-radius:8px; padding:10px 14px; font-size:12px; color:var(--ep-ink-2); }
    .stat-chip strong { display:block; font-size:22px; font-family:'Fraunces',serif; color:var(--ep-ink); }
  </style>
</head>
<body>
<script src="./js/admin-sidebar.js?v=1"></script>
<div id="overlay" class="ep-overlay"></div>
<div class="ep-shell">
  <header class="ep-topbar">
    <a href="./index.html" class="ep-brand" aria-label="Espaço Prelúdio">
      <span class="ep-brand__mark">EP</span>
      <span class="ep-brand__name"><span class="ep-brand__lead">Espaço</span><span>Prelúdio · Admin</span></span>
    </a>
    <nav class="ep-nav">
      <a href="./admin-painel.html" class="ep-text-sm">Painel</a>
      <a href="./admin-profissionais.html" class="ep-text-sm">Profissionais</a>
      <a href="./admin-empresas.html" class="ep-text-sm">Empresas</a>
      <a href="./admin-colaboradores.html" class="ep-text-sm">Colaboradores</a>
      <a href="./admin-estudantes.html" class="ep-text-sm is-active">Estudantes</a>
      <span id="adminEmail" class="ep-text-sm ep-text-muted">…</span>
      <button id="logoutBtn" class="ep-btn ep-btn--ghost ep-btn--sm" type="button">Sair</button>
    </nav>
  </header>

  <main class="ep-main">
    <section id="loginPanel" class="ep-hide" style="max-width:400px;margin:40px auto;">
      <div class="ep-auth__panel">
        <h2 class="ep-auth__title">Acesso Admin</h2>
        <form id="loginForm" class="ep-stack ep-mt-16" novalidate>
          <div class="ep-field"><label class="ep-label">E-mail</label><input id="loginEmail" class="ep-input" type="email" required></div>
          <div class="ep-field"><label class="ep-label">Senha</label><input id="loginPassword" class="ep-input" type="password" required></div>
          <p id="loginStatus" class="ep-text-sm ep-text-muted"></p>
          <button class="ep-btn ep-btn--primary ep-btn--block" type="submit">Entrar</button>
        </form>
      </div>
    </section>

    <section id="mainPanel" class="ep-hide">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
        <div>
          <div class="ep-eyebrow">Contratos Municipais</div>
          <h1 class="ep-h1 ep-mt-8">Estudantes</h1>
          <p class="ep-text-muted ep-mt-4">Gestão de alunos cadastrados via programa escolar.</p>
        </div>
        <button class="ep-btn ep-btn--ghost ep-btn--sm" id="btnExport">⬇ Exportar CSV</button>
      </div>

      <!-- Stats -->
      <div class="stats-row" id="statsRow"></div>

      <!-- Filtros -->
      <div class="ep-flex ep-mt-20" style="gap:8px;flex-wrap:wrap;align-items:center;">
        <input id="searchInput" class="ep-input" type="text" placeholder="Buscar nome, escola, responsável…" style="max-width:260px;">
        <input id="fEstado" class="ep-input" type="text" placeholder="UF" maxlength="2" style="max-width:60px;text-transform:uppercase;">
        <input id="fCidade" class="ep-input" type="text" placeholder="Cidade" style="max-width:140px;">
        <input id="fEscola" class="ep-input" type="text" placeholder="Escola" style="max-width:160px;">
        <select id="fIsMenor" class="ep-select" style="max-width:130px;">
          <option value="">Menores e maiores</option>
          <option value="true">Só menores</option>
          <option value="false">Só maiores</option>
        </select>
        <select id="fStatus" class="ep-select" style="max-width:160px;">
          <option value="all">Todos os status</option>
          <option value="ativo">Ativos</option>
          <option value="pendente-consentimento">Pendente consentimento</option>
          <option value="inativo">Inativos</option>
        </select>
        <button class="ep-btn ep-btn--primary ep-btn--sm" id="btnBuscar">Buscar</button>
        <span id="countLabel" class="ep-text-sm ep-text-muted"></span>
      </div>

      <div id="loadingMsg" class="ep-mt-24 ep-text-muted">Carregando…</div>
      <div id="emptyMsg" class="ep-hide ep-mt-24"><div class="ep-empty"><p class="ep-h3">Nenhum estudante encontrado.</p></div></div>

      <div id="tableWrap" class="ep-mt-16" style="display:none;overflow-x:auto;">
        <table class="est-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>Escola</th>
              <th>Turma</th>
              <th>Cidade/UF</th>
              <th>Contato</th>
              <th>Status</th>
              <th>Cadastro</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- Drawer: detalhes do estudante -->
<div class="ep-drawer" id="drawer">
  <div class="ep-drawer__head">
    <div>
      <div class="ep-text-xs ep-text-muted" id="drawerTipo"></div>
      <strong id="drawerNome" style="font-size:16px;"></strong>
    </div>
    <button class="ep-btn ep-btn--ghost ep-btn--sm" id="drawerClose">✕</button>
  </div>
  <div class="ep-drawer__body" id="drawerBody"></div>
  <div class="ep-drawer__foot" id="drawerFoot"></div>
</div>

<script type="module">
  import { onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { auth, BACKEND_BASE_URL } from "./js/firebase-config.js";

  let idToken = null;
  let allItems = [];
  let drawerItem = null;

  document.getElementById("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    try { await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value.trim(), document.getElementById("loginPassword").value); }
    catch { document.getElementById("loginStatus").textContent = "Credenciais inválidas."; }
  });
  document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, async user => {
    if (!user) { show("loginPanel"); return; }
    idToken = await user.getIdToken();
    document.getElementById("adminEmail").textContent = user.email || "?";
    show("mainPanel");
    loadEstudantes();
  });

  function show(id) {
    ["loginPanel","mainPanel"].forEach(x => document.getElementById(x).classList.toggle("ep-hide", x !== id));
  }

  function fmtDate(ms) { return ms ? new Date(ms).toLocaleDateString("pt-BR") : "—"; }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function statusBadge(s) {
    const cfg = {
      "ativo": ["Ativo", "#2d6a3e", "rgba(80,160,100,.15)"],
      "pendente-consentimento": ["Aguard. consent.", "#8a5b1a", "rgba(200,155,74,.15)"],
      "inativo": ["Inativo", "#666", "#eee"]
    };
    const [label, color, bg] = cfg[s] || [s, "#666", "#eee"];
    return `<span class="ep-badge" style="background:${bg};color:${color};font-size:10px;">${label}</span>`;
  }

  async function loadEstudantes() {
    document.getElementById("loadingMsg").textContent = "Carregando…";
    document.getElementById("tableWrap").style.display = "none";
    document.getElementById("emptyMsg").classList.add("ep-hide");
    try {
      idToken = await auth.currentUser?.getIdToken(true);
      const p = new URLSearchParams({
        status: document.getElementById("fStatus").value,
        estado: document.getElementById("fEstado").value.toUpperCase(),
        cidade: document.getElementById("fCidade").value.trim(),
        escola: document.getElementById("fEscola").value.trim(),
        isMenor: document.getElementById("fIsMenor").value,
        q: document.getElementById("searchInput").value.trim()
      });
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/admin/estudantes?${p}`, { headers: { Authorization: `Bearer ${idToken}` } });
      const d = await r.json().catch(() => ({}));
      document.getElementById("loadingMsg").textContent = "";
      allItems = d.items || [];
      renderStats(allItems);
      renderTable(allItems);
    } catch (e) {
      document.getElementById("loadingMsg").textContent = "Erro: " + e.message;
    }
  }

  function renderStats(items) {
    const ativos   = items.filter(e => e.status === "ativo").length;
    const pendente = items.filter(e => e.status === "pendente-consentimento").length;
    const menores  = items.filter(e => e.isMenor).length;
    const escolas  = new Set(items.map(e => e.escola)).size;
    document.getElementById("statsRow").innerHTML = `
      <div class="stat-chip"><strong>${items.length}</strong>Total</div>
      <div class="stat-chip"><strong>${ativos}</strong>Ativos</div>
      <div class="stat-chip"><strong>${pendente}</strong>Aguard. consentimento</div>
      <div class="stat-chip"><strong>${menores}</strong>Menores</div>
      <div class="stat-chip"><strong>${escolas}</strong>Escolas</div>
    `;
  }

  function renderTable(items) {
    const tbody = document.getElementById("tableBody");
    const wrap  = document.getElementById("tableWrap");
    const empty = document.getElementById("emptyMsg");
    document.getElementById("countLabel").textContent = `${items.length} resultado${items.length !== 1 ? "s" : ""}`;
    if (!items.length) { wrap.style.display = "none"; empty.classList.remove("ep-hide"); return; }
    empty.classList.add("ep-hide");
    wrap.style.display = "block";
    tbody.innerHTML = items.map(e => `
      <tr>
        <td>
          <strong>${esc(e.nome)}</strong>
          ${e.isMenor ? '<span class="ep-badge" style="font-size:9px;background:rgba(60,120,220,.12);color:#1a4a8a;margin-left:4px;">Menor</span>' : ''}
        </td>
        <td>${e.idade ?? "—"}</td>
        <td>${esc(e.escola)}</td>
        <td>${esc(e.turma || "—")}</td>
        <td>${esc(e.cidade)}/${esc(e.estado)}</td>
        <td style="font-size:12px;">
          ${e.isMenor
            ? `${esc(e.responsavelNome || "—")}<br><span class="ep-text-muted">${esc(e.responsavelEmail || "—")}</span>`
            : `${esc(e.email || "—")}<br><span class="ep-text-muted">${esc(e.telefone || "—")}</span>`}
        </td>
        <td>${statusBadge(e.status)}</td>
        <td style="font-size:11px;color:var(--ep-ink-3);">${fmtDate(e.createdAt)}</td>
        <td><button class="ep-btn ep-btn--ghost ep-btn--sm" onclick="openDrawer('${esc(e.id)}')">Detalhes</button></td>
      </tr>
    `).join("");
  }

  // Filtros
  document.getElementById("btnBuscar").addEventListener("click", loadEstudantes);
  document.getElementById("searchInput").addEventListener("keydown", e => { if (e.key === "Enter") loadEstudantes(); });
  document.getElementById("fStatus").addEventListener("change", loadEstudantes);
  document.getElementById("fIsMenor").addEventListener("change", loadEstudantes);

  // Export CSV
  document.getElementById("btnExport").addEventListener("click", () => {
    if (!allItems.length) return;
    const cols = ["nome","idade","isMenor","escola","turma","cidade","municipio","estado",
                  "email","telefone","responsavelNome","responsavelEmail","responsavelTelefone",
                  "consentimentoParental","status","createdAt"];
    const rows = [cols.join(";"), ...allItems.map(e => cols.map(k => `"${String(e[k] ?? "").replace(/"/g,'""')}"`).join(";"))];
    const blob = new Blob(["﻿" + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `estudantes-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  });

  // Drawer
  const drawer  = document.getElementById("drawer");
  const overlay = document.getElementById("overlay");

  window.openDrawer = async function(id) {
    const item = allItems.find(x => x.id === id) || {};
    drawerItem = { ...item, id };
    renderDrawer(drawerItem);
    drawer.classList.add("is-open");
    overlay.classList.add("is-open");
  };

  function renderDrawer(e) {
    document.getElementById("drawerTipo").textContent = e.isMenor ? "Menor de idade" : "Maior de idade";
    document.getElementById("drawerNome").textContent = e.nome || "—";

    const body = document.getElementById("drawerBody");
    body.innerHTML = `
      <div>
        <div class="ep-drawer__label">Status</div>
        <div>${statusBadge(e.status)} ${e.isMenor && !e.consentimentoParental ? '<span class="ep-text-xs ep-text-muted">consentimento pendente</span>' : ''}</div>
      </div>
      <div class="ep-drawer__row">
        <div><div class="ep-drawer__label">Data de nascimento</div><div class="ep-drawer__val">${e.dataNascimento || "—"}</div></div>
        <div><div class="ep-drawer__label">Idade</div><div class="ep-drawer__val">${e.idade ?? "—"} anos</div></div>
      </div>
      <div class="ep-drawer__row">
        <div><div class="ep-drawer__label">Escola</div><div class="ep-drawer__val">${esc(e.escola)}</div></div>
        <div><div class="ep-drawer__label">Turma/Série</div><div class="ep-drawer__val">${esc(e.turma || "—")}</div></div>
      </div>
      <div class="ep-drawer__row">
        <div><div class="ep-drawer__label">Cidade</div><div class="ep-drawer__val">${esc(e.cidade)}</div></div>
        <div><div class="ep-drawer__label">Município/UF</div><div class="ep-drawer__val">${esc(e.municipio || e.cidade)}/${esc(e.estado)}</div></div>
      </div>
      ${e.isMenor ? `
      <div style="border-top:1px solid var(--ep-line);padding-top:12px;">
        <div class="ep-drawer__label" style="margin-bottom:8px;">Responsável</div>
        <div class="ep-drawer__row">
          <div><div class="ep-drawer__label">Nome</div><div class="ep-drawer__val">${esc(e.responsavelNome || "—")}</div></div>
          <div><div class="ep-drawer__label">E-mail</div><div class="ep-drawer__val" style="font-size:12px;">${esc(e.responsavelEmail || "—")}</div></div>
        </div>
        <div class="ep-drawer__row" style="margin-top:8px;">
          <div><div class="ep-drawer__label">Telefone</div><div class="ep-drawer__val">${esc(e.responsavelTelefone || "—")}</div></div>
          <div><div class="ep-drawer__label">Consentimento</div><div class="ep-drawer__val">${e.consentimentoParental ? "✅ " + fmtDate(e.consentimentoAt) : "⏳ Pendente"}</div></div>
        </div>
      </div>` : `
      <div style="border-top:1px solid var(--ep-line);padding-top:12px;">
        <div class="ep-drawer__row">
          <div><div class="ep-drawer__label">E-mail</div><div class="ep-drawer__val" style="font-size:12px;">${esc(e.email || "—")}</div></div>
          <div><div class="ep-drawer__label">Telefone</div><div class="ep-drawer__val">${esc(e.telefone || "—")}</div></div>
        </div>
      </div>`}
      <div><div class="ep-drawer__label">Cadastrado em</div><div class="ep-drawer__val">${fmtDate(e.createdAt)}</div></div>
    `;

    const foot = document.getElementById("drawerFoot");
    foot.innerHTML = "";
    if (e.isMenor && !e.consentimentoParental) {
      const btnRe = document.createElement("button");
      btnRe.className = "ep-btn ep-btn--ghost ep-btn--sm";
      btnRe.textContent = "Reenviar e-mail de consentimento";
      btnRe.onclick = () => reenviarConsentimento(e.id);
      foot.appendChild(btnRe);
      const btnAp = document.createElement("button");
      btnAp.className = "ep-btn ep-btn--primary ep-btn--sm";
      btnAp.textContent = "Aprovar manualmente";
      btnAp.onclick = () => aprovarManualmente(e.id);
      foot.appendChild(btnAp);
    }
    if (e.status === "ativo") {
      const btnIn = document.createElement("button");
      btnIn.className = "ep-btn ep-btn--ghost ep-btn--sm";
      btnIn.style.color = "#b8453d";
      btnIn.textContent = "Desativar";
      btnIn.onclick = () => atualizarStatus(e.id, "inativo");
      foot.appendChild(btnIn);
    } else if (e.status === "inativo") {
      const btnRe = document.createElement("button");
      btnRe.className = "ep-btn ep-btn--primary ep-btn--sm";
      btnRe.textContent = "Reativar";
      btnRe.onclick = () => atualizarStatus(e.id, "ativo");
      foot.appendChild(btnRe);
    }
  }

  async function reenviarConsentimento(id) {
    try {
      idToken = await auth.currentUser?.getIdToken(true);
      const r = await fetch(`${BACKEND_BASE_URL}/therapy/admin/estudantes/${id}/reenviar-consentimento`, {
        method: "POST", headers: { Authorization: `Bearer ${idToken}` }
      });
      const d = await r.json().catch(() => ({}));
      if (d.ok) alert("E-mail reenviado!");
      else alert("Erro: " + (d.error || "Falha"));
    } catch (e) { alert("Erro: " + e.message); }
  }

  async function aprovarManualmente(id) {
    if (!confirm("Aprovar este estudante manualmente (sem confirmação do responsável)?")) return;
    try {
      idToken = await auth.currentUser?.getIdToken(true);
      await fetch(`${BACKEND_BASE_URL}/therapy/admin/estudantes/${id}`, {
        method: "PATCH",
        headers: { Authorization: `Bearer ${idToken}`, "Content-Type": "application/json" },
        body: JSON.stringify({ consentimentoParental: true })
      });
      closeDrawer();
      loadEstudantes();
    } catch (e) { alert("Erro: " + e.message); }
  }

  async function atualizarStatus(id, status) {
    try {
      idToken = await auth.currentUser?.getIdToken(true);
      await fetch(`${BACKEND_BASE_URL}/therapy/admin/estudantes/${id}`, {
        method: "PATCH",
        headers: { Authorization: `Bearer ${idToken}`, "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });
      closeDrawer();
      loadEstudantes();
    } catch (e) { alert("Erro: " + e.message); }
  }

  function closeDrawer() {
    drawer.classList.remove("is-open");
    overlay.classList.remove("is-open");
  }
  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  overlay.addEventListener("click", closeDrawer);
</script>

</body>
</html>
